<!DOCTYPE html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數學及ICT課件庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: 圓點紙底 + 漂浮數學／電腦符號的歡迎橫幅（右邊有電腦小精靈）→ 科目大按鈕 → 年級貼紙列 → 彩色課題卡片 */
:root{
  color-scheme:light;
  --bg:#f3f8ff; --dot:#d6e6fb; --card:#ffffff; --ink:#27335a; --muted:#6b7599; --line:#e3eaf7;
  --sun:#ffd23f; --sky:#4cc9f0; --grape:#7b6cf6; --mint:#3ddc97; --pink:#ff7aa2; --orange:#ff9f43;
  --round:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"Baloo 2","Chiron GoRound TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg); color:var(--ink); font-family:var(--round); font-size:16px; line-height:1.6;
  background-image:radial-gradient(var(--dot) 2px,transparent 2px); background-size:26px 26px;
}
.wrap{max-width:1080px;margin:0 auto;padding-inline:18px;padding-block:22px 48px}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--grape);outline-offset:3px}

/* ---------- 歡迎橫幅 ---------- */
.hero{position:relative;overflow:hidden;border-radius:32px;padding:30px 32px;
  background:linear-gradient(135deg,#ffe98a 0%,#ffd6e4 55%,#cfe9ff 100%);
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  box-shadow:0 8px 0 rgba(39,51,90,.08)}
.hero-text{position:relative;z-index:1;min-width:0;flex:1 1 320px}
.school{display:inline-block;font-family:var(--num);font-size:13px;letter-spacing:.06em;background:#fff;
  color:var(--grape);padding:3px 12px;border-radius:99px;font-weight:600}
h1{font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1.15;margin:10px 0 6px;text-wrap:balance;letter-spacing:.02em}
.hi{color:var(--muted);margin:0;font-size:16px}
.stats{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.stat{background:#fff;border-radius:99px;padding:4px 14px;font-size:14px;font-weight:600}
.stat.offline{color:var(--muted);font-size:13px}
.stat b{font-family:var(--num);font-size:18px;color:var(--pink);margin-right:2px;font-variant-numeric:tabular-nums}
.floaty{position:absolute;font-family:var(--num);font-weight:800;opacity:.35;pointer-events:none;user-select:none}
.bot{position:relative;z-index:1;width:190px;max-width:42%;flex:0 0 auto;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
@media (prefers-reduced-motion:reduce){.bot,.eye{animation:none}}

/* ---------- 科目 ---------- */
.subjects{display:flex;flex-wrap:wrap;gap:14px;margin:26px 0 18px}
.subj{display:flex;align-items:center;gap:12px;padding:10px 22px 10px 10px;border:3px solid var(--line);border-radius:22px;
  background:var(--card);color:var(--ink);font-size:19px;font-weight:800;cursor:pointer;
  box-shadow:0 5px 0 var(--line);transition:transform .15s,box-shadow .15s}
.subj:hover{transform:translateY(-2px)}
.subj .ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--c-soft)}
.subj .ico svg{width:30px;height:30px}
.subj .n{font-family:var(--num);font-size:14px;background:var(--bg);border-radius:99px;padding:0 9px;color:var(--muted)}
.subj[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff;box-shadow:0 5px 0 var(--c-deep)}
.subj[aria-pressed="true"] .ico{background:#fff}
.subj[aria-pressed="true"] .n{background:rgba(255,255,255,.3);color:#fff}

/* ---------- 年級 + 搜尋 ---------- */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}
.grades{display:flex;flex-wrap:wrap;gap:8px}
.grade{border:0;border-radius:99px;padding:7px 16px;background:var(--card);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;
  box-shadow:0 3px 0 var(--line);display:flex;gap:6px;align-items:center}
.grade .n{font-family:var(--num);font-size:13px;color:var(--muted)}
.grade[aria-pressed="true"]{background:var(--sun);box-shadow:0 3px 0 #e0b21c}
.grade[aria-pressed="true"] .n{color:var(--ink)}
.grade:disabled{opacity:.4;cursor:default}
.search-box{position:relative;flex:0 1 280px;min-width:200px}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px}
.search{width:100%;border:3px solid var(--line);border-radius:99px;padding:8px 16px 8px 40px;font-size:15px;background:var(--card);color:var(--ink)}
.search:focus{border-color:var(--sky);outline:none}

/* ---------- 課件清單 ---------- */
main{display:flex;flex-direction:column;gap:30px}
.gradeblock h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;font-size:24px;font-weight:800}
.badge{font-family:var(--num);background:var(--c);color:#fff;border-radius:14px;padding:2px 14px;transform:rotate(-3deg);display:inline-block;box-shadow:0 4px 0 var(--c-deep)}
.gradeblock h2 small{font-size:14px;font-weight:600;color:var(--muted)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.topic{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 6px 0 var(--line);min-width:0}
.topic h3{margin:0;padding:12px 18px;font-size:18px;font-weight:800;background:var(--t);display:flex;align-items:center;justify-content:space-between;gap:10px}
.topic h3 .n{font-family:var(--num);font-size:14px;background:#fff;border-radius:99px;padding:0 10px}
.items{list-style:none;margin:0;padding:6px 10px 10px}
.item{display:flex;flex-direction:column;gap:6px;padding:12px 10px;border-bottom:2px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:800;font-size:16.5px}
.item .d{color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:1px 10px;border-radius:99px;background:var(--bg);color:var(--grape)}
.open{align-self:flex-start;text-decoration:none;font-weight:800;font-size:15px;color:#fff;background:var(--c);
  padding:7px 18px;border-radius:99px;box-shadow:0 4px 0 var(--c-deep);transition:transform .12s,box-shadow .12s;display:inline-flex;gap:6px;align-items:center}
.open:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--c-deep)}
.open:active{transform:translateY(2px);box-shadow:0 2px 0 var(--c-deep)}
.open.none{background:var(--line);color:var(--muted);box-shadow:none;pointer-events:none}
.soon{color:var(--muted);font-size:14px;padding:14px 20px}
.empty{background:var(--card);border:3px dashed var(--line);border-radius:24px;padding:28px;text-align:center;color:var(--muted);line-height:1.9}
.empty .big{font-size:40px;display:block}
.empty code{font-family:var(--num);background:var(--bg);padding:1px 8px;border-radius:8px;color:var(--ink)}

/* 科目顏色 */
.theme-0{--c:var(--grape);--c-deep:#5646d4;--c-soft:#ebe8ff}
.theme-1{--c:#1eaee0;--c-deep:#1487b0;--c-soft:#dff5fd}
.theme-2{--c:#20b877;--c-deep:#178f5c;--c-soft:#dcf8ec}
.theme-3{--c:var(--pink);--c-deep:#e0507c;--c-soft:#ffe6ee}

@media (max-width:640px){
  .hero{padding:24px 20px}
  .bot{width:130px}
  .search-box{flex:1 1 100%}
  .topics{grid-template-columns:1fr}
}
</style>

<div class="wrap" id="app">
  <section class="hero">
    <span class="floaty" style="left:4%;top:8%;font-size:34px;color:var(--grape)">π</span>
    <span class="floaty" style="left:40%;top:6%;font-size:28px;color:var(--sky)">&lt;/&gt;</span>
    <span class="floaty" style="left:58%;bottom:8%;font-size:30px;color:var(--pink)">√x</span>
    <span class="floaty" style="left:30%;bottom:4%;font-size:26px;color:var(--mint)">01</span>
    <span class="floaty" style="left:48%;top:44%;font-size:26px;color:var(--orange)">△</span>
    <div class="hero-text">
      <span class="school" id="school"></span>
      <h1 id="title"></h1>
      <p class="hi">揀科目、揀年級，打開課件就可以開始學習！</p>
      <div class="stats" id="stats"></div>
    </div>
    <svg class="bot" viewBox="0 0 200 190" aria-hidden="true">
      <ellipse cx="100" cy="182" rx="62" ry="7" fill="#27335a" opacity=".12"/>
      <rect x="78" y="140" width="44" height="22" rx="6" fill="#9aa6d6"/>
      <rect x="54" y="158" width="92" height="16" rx="8" fill="#b7c1ea"/>
      <rect x="18" y="14" width="164" height="132" rx="30" fill="#7b6cf6"/>
      <rect x="32" y="28" width="136" height="100" rx="20" fill="#ffffff"/>
      <text x="44" y="56" font-family="Baloo 2, sans-serif" font-weight="800" font-size="18" fill="#4cc9f0">1+1=2</text>
      <text x="132" y="118" font-family="Baloo 2, sans-serif" font-weight="800" font-size="16" fill="#ff9f43">π</text>
      <ellipse class="eye" cx="76" cy="82" rx="8" ry="10" fill="#27335a"/>
      <ellipse class="eye" cx="124" cy="82" rx="8" ry="10" fill="#27335a"/>
      <circle cx="79" cy="78" r="3" fill="#fff"/><circle cx="127" cy="78" r="3" fill="#fff"/>
      <circle cx="60" cy="100" r="8" fill="#ff7aa2" opacity=".45"/><circle cx="140" cy="100" r="8" fill="#ff7aa2" opacity=".45"/>
      <path d="M88 100 q12 12 24 0" stroke="#27335a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="100" cy="6" r="7" fill="#ffd23f"/><rect x="97" y="8" width="6" height="10" fill="#7b6cf6"/>
    </svg>
  </section>

  <nav class="subjects" id="subjects" aria-label="科目"></nav>

  <div class="bar">
    <div class="grades" id="grades" aria-label="年級"></div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="#6b7599" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg>
      <label for="q" style="position:absolute;left:-9999px">搜尋</label>
      <input class="search" id="q" type="search" placeholder="搜尋課題或課件">
    </div>
  </div>

  <main id="list"><div class="empty"><span class="big">⏳</span>正在載入課件清單…</div></main>
</div>

<script>
/* ============================================================
   設定（只需設定一次）
   ============================================================ */
const CONFIG = {
  school: "Maryknoll Secondary School",
  title: "數學及ICT課件庫",
  SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTnHug9_QB5u15YeOhrdxA7CgTNq3iEo0CgaCfOdls8xyt9s6VnvFidR1xNBrrDURKx2M30Kfjr9Idh/pub?gid=1953720394&single=true&output=csv",
  BASE_URL: "https://johnathan-lh.github.io/Teacher/",   // 「連結」欄可只填檔案路徑，例如 Math/F1/坐標.html
  subjects: ["數學", "ICT"],              // 科目顯示次序（試算表出現的新科目會自動加在後面）
  grades: ["中一", "中二", "中三", "中四", "中五", "中六"]
};
/* 試算表第一行（欄名）：科目 | 年級 | 課題 | 課件名稱 | 連結 | 簡介 | 標籤 */

/* ============================================================
   以下是程式，一般不用修改
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let COURSES = [], SUBJECTS = [];
const state = { subject: "", grade: "全部", q: "" };
try { Object.assign(state, JSON.parse(localStorage.getItem("clib2") || "{}"), { q: "" }); } catch (e) {}
function save(){ try { localStorage.setItem("clib2", JSON.stringify({ subject: state.subject, grade: state.grade })); } catch (e) {} }

$("#school").textContent = CONFIG.school;
$("#title").textContent = CONFIG.title;

const TOPIC_COLORS = ["#fff1b8", "#d9f3ff", "#dcfbea", "#ffe3ec", "#ebe8ff", "#ffe8d1"];
const ICONS = {
  math: `<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="8" fill="#ffd23f"/><path d="M9 11h6M12 8v6M18 11h6M9.5 19.5l5 5M14.5 19.5l-5 5M18 20h6M18 24h6" stroke="#27335a" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  ict: `<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="17" rx="5" fill="#4cc9f0"/><rect x="6" y="8" width="20" height="11" rx="3" fill="#fff"/><path d="M12 11l-3 2.5 3 2.5M20 11l3 2.5-3 2.5M17 10.5l-2 6" stroke="#27335a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="11" y="23" width="10" height="3" rx="1.5" fill="#27335a"/></svg>`,
  other: `<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="4" width="22" height="24" rx="6" fill="#3ddc97"/><path d="M10 11h12M10 16h12M10 21h7" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>`
};
const iconFor = s => /數|math/i.test(s) ? ICONS.math : /ict|電腦|資訊|編程|程式/i.test(s) ? ICONS.ict : ICONS.other;

function parseCSV(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r"){
      if (ch === "\r" && text[i+1] === "\n") i++;
      row.push(f); rows.push(row); row = []; f = "";
    } else f += ch;
  }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}

function fullUrl(u){
  if (!u) return "";
  if (/^https?:\/\//i.test(u)) return u;
  return CONFIG.BASE_URL + u.replace(/^\.?\//, "").split("/").map(encodeURIComponent).join("/");
}

function toCourses(rows){
  const head = (rows.shift() || []).map(h => h.trim());
  const col = name => head.indexOf(name);
  const idx = { subject: col("科目"), grade: col("年級"), topic: col("課題"), title: col("課件名稱"),
                url: col("連結"), desc: col("簡介"), tags: col("標籤") };
  if (idx.subject < 0 || idx.grade < 0 || idx.title < 0) throw new Error("欄名不符");
  const get = (r, k) => idx[k] >= 0 ? (r[idx[k]] || "").trim() : "";
  return rows.map(r => ({
    subject: get(r, "subject"), grade: get(r, "grade"), topic: get(r, "topic") || "其他",
    title: get(r, "title"), url: fullUrl(get(r, "url")), desc: get(r, "desc"),
    tags: get(r, "tags").split(/[,，、]/).map(s => s.trim()).filter(Boolean)
  })).filter(c => c.subject && c.grade && (c.title || c.topic !== "其他"));
}

function showMessage(html){
  $("#subjects").innerHTML = ""; $("#grades").innerHTML = ""; $("#stats").innerHTML = "";
  $("#list").innerHTML = `<div class="empty">${html}</div>`;
}

const matchQ = c => !state.q || [c.topic, c.title, c.desc, ...c.tags].join(" ").toLowerCase().includes(state.q.toLowerCase());
const gradeOrder = g => { const i = CONFIG.grades.indexOf(g); return i < 0 ? 99 : i; };
const countReal = arr => arr.filter(c => c.title).length;

function render(){
  if (!COURSES.length){
    showMessage(`<span class="big">📭</span>試算表已連接，但暫時未有課件。<br>在試算表加入第一行後，稍等幾分鐘再重新整理此頁。`);
    return;
  }
  if (!SUBJECTS.includes(state.subject)) state.subject = SUBJECTS[0];
  const si = SUBJECTS.indexOf(state.subject);
  $("#app").className = "wrap theme-" + (si % 4);

  $("#stats").innerHTML = `<span class="stat"><b>${countReal(COURSES)}</b> 個課件</span><span class="stat"><b>${new Set(COURSES.map(c => c.subject + c.grade + c.topic)).size}</b> 個課題</span>`;

  $("#subjects").innerHTML = SUBJECTS.map((s, i) =>
    `<button class="subj theme-${i % 4}" data-s="${esc(s)}" aria-pressed="${s === state.subject}"><span class="ico">${iconFor(s)}</span>${esc(s)}<span class="n">${countReal(COURSES.filter(c => c.subject === s))}</span></button>`
  ).join("");

  const inSubj = COURSES.filter(c => c.subject === state.subject && matchQ(c));
  const allGrades = [...new Set([...CONFIG.grades, ...COURSES.map(c => c.grade)])].sort((a, b) => gradeOrder(a) - gradeOrder(b));
  $("#grades").innerHTML = ["全部", ...allGrades].map(g => {
    const rows = inSubj.filter(c => g === "全部" || c.grade === g);
    const off = rows.length === 0 && g !== "全部" && g !== state.grade;
    return `<button class="grade" data-g="${esc(g)}" aria-pressed="${g === state.grade}" ${off ? "disabled" : ""}>${esc(g)}<span class="n">${countReal(rows)}</span></button>`;
  }).join("");

  const shown = inSubj.filter(c => state.grade === "全部" || c.grade === state.grade);
  if (!shown.length){
    $("#list").innerHTML = `<div class="empty"><span class="big">🔍</span>${state.q ? `找不到「${esc(state.q)}」相關的課件。` : "這個年級暫時未有課件。"}</div>`;
    return;
  }

  let ci = 0;
  const grades = allGrades.filter(g => shown.some(c => c.grade === g));
  $("#list").innerHTML = grades.map(g => {
    const inGrade = shown.filter(c => c.grade === g);
    const topics = [...new Set(inGrade.map(c => c.topic))];
    return `<section class="gradeblock">
      <h2><span class="badge">${esc(g)}</span><small>${topics.length} 個課題 · ${countReal(inGrade)} 個課件</small></h2>
      <div class="topics">
      ${topics.map(t => {
        const list = inGrade.filter(c => c.topic === t && c.title);
        const bg = TOPIC_COLORS[ci++ % TOPIC_COLORS.length];
        const head = `<h3 style="--t:${bg}">${esc(t)}<span class="n">${list.length}</span></h3>`;
        if (!list.length) return `<div class="topic">${head}<div class="soon">課件準備中，敬請期待 ✨</div></div>`;
        return `<div class="topic">${head}<ul class="items">
          ${list.map(c => `<li class="item">
            <span class="t">${esc(c.title)}</span>
            ${c.desc ? `<span class="d">${esc(c.desc)}</span>` : ""}
            ${c.tags.length ? `<span class="tags">${c.tags.map(x => `<span class="tag">#${esc(x)}</span>`).join("")}</span>` : ""}
            ${/^https?:\/\//i.test(c.url) ? `<a class="open" href="${esc(c.url)}" target="_blank" rel="noopener">▶ 開始學習</a>` : `<span class="open none">未上載</span>`}
          </li>`).join("")}
        </ul></div>`;
      }).join("")}
      </div>
    </section>`;
  }).join("");
}

$("#subjects").addEventListener("click", e => {
  const b = e.target.closest(".subj"); if (!b) return;
  state.subject = b.dataset.s; state.grade = "全部"; save(); render();
});
$("#grades").addEventListener("click", e => {
  const b = e.target.closest(".grade"); if (!b || b.disabled) return;
  state.grade = b.dataset.g; save(); render();
});
$("#q").addEventListener("input", e => { state.q = e.target.value.trim(); if (COURSES.length) render(); });

const CSV_CACHE = "clib2-csv";
async function load(){
  if (!CONFIG.SHEET_CSV_URL){
    showMessage(`<span class="big">🔌</span>還未連接試算表。請把 CSV 連結貼到程式碼的 <code>SHEET_CSV_URL</code>。`);
    return;
  }
  const use = csv => {
    COURSES = toCourses(parseCSV(csv));
    SUBJECTS = [...new Set([...CONFIG.subjects.filter(s => COURSES.some(c => c.subject === s)), ...COURSES.map(c => c.subject)])];
    render();
  };
  try {
    const res = await fetch(CONFIG.SHEET_CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const csv = await res.text();
    use(csv);
    try { localStorage.setItem(CSV_CACHE, csv); } catch (e) {}
  } catch (err){
    // 讀取失敗時，改用上次成功讀到的清單（存在這部電腦的瀏覽器）
    let cached = null;
    try { cached = localStorage.getItem(CSV_CACHE); } catch (e) {}
    if (cached && err.message !== "欄名不符"){
      try {
        use(cached);
        $("#stats").insertAdjacentHTML("beforeend", `<span class="stat offline">⚠️ 未能連線，顯示的可能不是最新清單</span>`);
        return;
      } catch (e) {}
    }
    showMessage(err.message === "欄名不符"
      ? `<span class="big">🧐</span>讀到試算表，但欄名不符。<br>第一行要是：<code>科目</code> <code>年級</code> <code>課題</code> <code>課件名稱</code> <code>連結</code> <code>簡介</code> <code>標籤</code>`
      : `<span class="big">😵</span>未能讀取試算表。<br>請確認試算表已「發佈到網路」，而且連結以 <code>output=csv</code> 結尾。`);
  }
}
load();
</script>
