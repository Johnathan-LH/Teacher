name: Auto Update Multi-Folder Index
on:
  push:
    branches: [ main ]
    paths:
      - "**/*.html"          # 監控所有目錄下的 HTML 變動
      - "generate_index.py"  # 監控腳本自身的變動

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 聲明 GITHUB_TOKEN 的權限，這是修正「紅叉」報錯的關鍵
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 獲取完整歷史紀錄以利 Git 操作

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4

      - name: Run Scan Script
        run: python generate_index.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Johnathan-Bot"
          git config --global user.email "bot@github.com"
          
          # 檢查 index.html 是否有變動
          git add index.html
          if git diff --staged --quiet; then
            echo "偵測到 index.html 無變動，跳過提交。"
          else
            git commit -m "System: Auto-update portal index with subfolder support [skip ci]"
            git push
          fi
