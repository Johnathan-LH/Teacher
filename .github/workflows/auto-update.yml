name: Auto Update Multi-Folder Index
on:
  push:
    branches: [ main ]
    paths:
      - "**/*.html"          # 監控所有目錄下的 HTML 變動
      - "generate_index.py"  # 監控腳本自身的變動

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 重要：賦予寫入權限以更新 index.html
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4

      - name: Run Scan Script
        run: python generate_index.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Johnathan-Bot"
          git config --global user.email "bot@github.com"
          git add index.html
          # 檢查是否有變動，避免空提交導致報錯
          if git diff --staged --quiet; then
            echo "No changes in index.html, skipping push."
          else
            git commit -m "System: Auto-update portal index with filters [skip ci]"
            git push
          fi
