name: Auto Update Multi-Folder Index
on:
  push:
    paths:
      - "**/*.html"  # 監控所有層級文件夾下的 html 變動

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 賦予寫入權限以便 push index.html
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run script
        run: python generate_index.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add index.html
          git commit -m "Auto-update nested index [skip ci]" || echo "No changes"
          git push
