<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<title>恆等式 · 公開課</title>
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#F5F8FE; --grid:#DCE5F4; --ink:#1F2A44; --muted:#5B6782; --line:#C7D3E8;
  --hi:#FFE14D; --hi2:#FFF5BF; --mint:#4FC497; --mint2:#DCF5EA; --sky:#4C9EEB; --sky2:#DDEDFF;
  --pink:#FF7F9C; --pink2:#FFE2EA; --grape:#8B7CF6; --grape2:#ECE9FF; --bad:#E0344B; --good:#138F62; --stamp:#D7263D;
  --s1:#FFE2EA; --s2:#FFF5BF; --s3:#DCF5EA; --s4:#DDEDFF; --s5:#ECE9FF; --s6:#FFE8D1; --sun2:#FFF5BF;
}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
html.teacher{font-size:21px}
body{margin:0;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  touch-action:manipulation;line-height:1.55}
body.padopen{padding-bottom:300px}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.mx{font-family:"Times New Roman","STIX Two Text",Times,"PingFang HK","Noto Sans TC",serif;font-size:1.12em}
.mx i{font-style:italic}
.eqv{font-weight:900;font-size:1.3em;line-height:1;padding:0 .08em}

/* ---------- top ---------- */
#top{position:sticky;top:0;z-index:30;background:rgba(245,248,254,.97);padding:10px 16px 8px;border-bottom:2.5px solid var(--ink)}
.hdr{display:flex;align-items:center;gap:10px;max-width:960px;margin:0 auto 8px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--hi);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;font:900 28px/1 "Times New Roman",serif;flex:none;transform:rotate(-5deg)}
.hdr h1{font-size:1.1rem;margin:0;line-height:1.2;font-weight:900}
.hdr h1 small{display:block;font-weight:600;color:var(--muted);font-size:.78rem}
.hdr .sp{flex:1}
.tbadge{background:var(--ink);color:#fff;border-radius:8px;padding:4px 10px;font-size:.8rem;font-weight:700}
.gbtn{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-weight:800;font-size:.9rem;box-shadow:3px 3px 0 var(--ink)}
.timer{max-width:960px;margin:0 auto}
.twrap{position:relative;margin:0 0 18px}
.tbar{display:flex;height:32px;border-radius:10px;overflow:hidden;border:2.5px solid var(--ink);background:#fff}
.seg{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;padding:0 4px;font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;border-right:2px solid var(--ink)}
.seg:last-child{border-right:0}
.seg span{overflow:hidden;text-overflow:ellipsis}
.seg.past{background-image:repeating-linear-gradient(45deg,rgba(31,42,68,.22) 0 5px,transparent 5px 11px)}
.seg.cur{box-shadow:inset 0 0 0 3px var(--ink);font-weight:900}
.ptr{position:absolute;top:-7px;bottom:-7px;width:0;border-left:4px solid var(--ink);transform:translateX(-2px);transition:left .5s linear;pointer-events:none}
.ptr::before{content:"";position:absolute;top:-2px;left:-9px;border:7px solid transparent;border-top:9px solid var(--ink)}
.ticks{position:absolute;left:0;right:0;top:34px;height:16px;font-size:.68rem;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}
.tstat{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.9rem;font-weight:700}
.tstat .now{flex:1;min-width:220px}
.pace{border-radius:10px;padding:4px 12px;font-weight:800;border:2.5px solid var(--ink);background:#fff}
.pace.behind{background:var(--pink2)}
.pace.ahead{background:var(--sky2)}
.pace.on{background:var(--mint2)}
.pvw{font-size:.75rem;color:var(--muted)}
.tabs{display:flex;gap:8px;max-width:960px;margin:10px auto 0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 4px 6px 2px}
.tab{flex:none;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 6px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-weight:800;font-size:.92rem;box-shadow:2px 2px 0 var(--ink)}
.tab .n{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);font-weight:900}
.tab.on{background:var(--hi);transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.tab .ok{display:none;font-size:.78rem;background:var(--good);color:#fff;border-radius:6px;padding:0 6px}
.tab.done .ok{display:inline}

/* ---------- page ---------- */
main{max-width:960px;margin:0 auto;padding:6px 16px 70px}
.page{display:none}
.page.on{display:block}
.ph{display:flex;align-items:center;gap:12px;margin:22px 0 4px}
.ph .big{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.35rem;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);flex:none}
.ph h2{margin:0;font-size:1.55rem;font-weight:900;display:inline;background:linear-gradient(transparent 58%,var(--hi) 58%);padding:0 4px}
.ph .time{display:block;color:var(--muted);font-size:.85rem;font-weight:700;margin-top:2px}
.say{display:flex;align-items:center;gap:4px;margin:6px 0 4px}
.say .pencil{flex:none}
.bubble{position:relative;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px 14px;font-weight:700;font-size:.98rem;margin-left:8px}
.bubble::before{content:"";position:absolute;left:-11px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:11px solid var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-right:8px solid #fff;border-left:0}

.card{position:relative;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:18px 18px 16px 42px;box-shadow:4px 4px 0 var(--ink);margin:20px 0}
.card::before{content:"";position:absolute;left:26px;top:0;bottom:0;border-left:2px solid var(--pink)}
.card.plain{padding-left:18px}
.card.plain::before{display:none}
.card h3{margin:0 0 8px;font-size:1.12rem;font-weight:900}
.card ul{margin:6px 0;padding-left:1.3em}
.card li{margin:4px 0}
.card.done{border-color:var(--good);box-shadow:4px 4px 0 var(--good)}
.sticky{position:relative;background:var(--hi2);border-radius:4px;padding:20px 18px 16px;box-shadow:2px 3px 0 rgba(31,42,68,.28);margin:24px 6px 20px;transform:rotate(-.5deg)}
.sticky::before{content:"";position:absolute;top:-11px;left:50%;width:96px;height:22px;margin-left:-48px;background:rgba(139,124,246,.38);transform:rotate(2deg)}
.sticky h3{margin:0 0 6px;font-size:1.08rem;font-weight:900}
.tip{font-size:.92rem;color:var(--muted)}
.goal{display:flex;gap:10px;align-items:center;margin:6px 0;font-weight:700}
.goal b{flex:none;width:28px;height:28px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink)}

/* stamp */
.stamp{position:absolute;top:8px;right:12px;width:86px;height:86px;border:4px double var(--stamp);color:var(--stamp);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;line-height:1.1;text-align:center;transform:rotate(-14deg);background:rgba(255,255,255,.75);pointer-events:none;z-index:3}
.stamp.fresh{animation:stampIn .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{from{transform:rotate(-14deg) scale(2.4);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}

/* question */
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;padding-right:90px}
.qno{min-width:44px;height:36px;padding:0 10px;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.05rem}
.stars{font-size:.95rem;letter-spacing:1px;padding:2px 10px;border-radius:8px;border:2px solid var(--ink);background:var(--hi2);font-weight:700}
.tag{font-size:.82rem;padding:3px 10px;border-radius:8px;background:var(--grape2);border:2px solid var(--ink);font-weight:800}
.donebadge{display:none}
.qtitle{font-size:1.08rem;font-weight:700;margin:4px 0 10px}
.lines{margin:6px 0}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 0;font-size:1.15rem;line-height:1.6;min-height:48px}
.line.cont{padding-left:2.6em}
.line .lbl{font-weight:800;margin-right:4px;min-width:2em}
.line .note{margin-left:auto;color:var(--muted);font-size:.82rem;font-weight:700}
.line .note::before{content:"◀ "}
.tipbox{display:flex;gap:6px;align-items:center;background:var(--hi2);border:2px solid var(--ink);border-radius:14px;padding:6px 14px 6px 4px;margin:6px 0 12px;font-weight:700;font-size:1.02rem}
.tipbox .pencil{flex:none}

/* blanks */
.pick{display:inline-flex;position:relative;vertical-align:middle}
.pick button{min-width:46px;min-height:44px;padding:0 12px;border:2px solid var(--ink);background:#fff;font-size:1.1rem;margin-left:-2px}
.pick button:first-child{border-radius:10px 0 0 10px;margin-left:0}
.pick button:last-child{border-radius:0 10px 10px 0}
.pick button.on{background:var(--hi);font-weight:900;box-shadow:inset 0 0 0 3px var(--ink)}
.pick.stack{display:flex;flex-direction:column;gap:8px;width:100%;max-width:560px}
.pick.stack button{border-radius:12px !important;margin:0;text-align:left;padding:8px 16px}
.pick.stack button.on::after{content:"  ← 已選";font-size:.85rem;font-weight:800}
.pick.bad{outline:3px dashed var(--bad);outline-offset:3px;border-radius:12px}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:58px;min-height:44px;padding:0 10px;border:2.5px dashed var(--sky);border-radius:10px;background:var(--sky2);font-size:1.15rem;vertical-align:middle;position:relative}
.num.filled{border-style:solid;border-color:var(--ink);background:#fff}
.num.active{box-shadow:0 0 0 4px var(--hi),0 0 0 6px var(--ink)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:70px;min-height:48px;padding:2px;border:2.5px dashed #9AA8C4;border-radius:10px;background:#FBFCFF;vertical-align:middle;position:relative}
.slot.long{min-width:210px;justify-content:flex-start}
.slot.over{background:var(--hi2);border-color:var(--ink);border-style:solid}
.slot.ready{border-color:var(--ink)}
.bad{border-color:var(--bad) !important;border-style:dashed !important}
.bad::after{content:"✗";position:absolute;top:-11px;right:-11px;width:24px;height:24px;border-radius:50%;background:var(--bad);color:#fff;font:700 15px/24px sans-serif;text-align:center;z-index:2}
.tile{display:inline-flex;align-items:center;min-height:44px;padding:4px 14px;border-radius:10px;background:#fff;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;font-size:1.08rem}
.slot .tile{box-shadow:none;background:var(--grape2)}
.tile.sel{background:var(--hi);transform:translate(-1px,-2px);box-shadow:3px 4px 0 var(--ink)}
.tile.dragging{opacity:.25}
.tile.ghost{position:fixed;pointer-events:none;z-index:1000;opacity:.95;transform:rotate(-3deg) scale(1.06);box-shadow:5px 8px 0 rgba(31,42,68,.35);margin:0}
.bank{display:flex;flex-wrap:wrap;gap:10px;padding:12px;margin:8px 0 12px;border-radius:14px;background:#EEF3FB;border:2px dashed #9AA8C4;min-height:68px;align-items:center}
.bank .bl{width:100%;font-size:.8rem;color:var(--muted);font-weight:700}
.bank .empty{color:var(--muted);font-size:.85rem}

.qbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-weight:800;font-size:.98rem;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.pri{background:var(--mint)}
.btn.hint{background:var(--hi2)}
.btn.teach{background:var(--ink);color:#fff}
.btn:disabled{opacity:.45}
.hints{margin-top:12px;background:var(--sky2);border:2px solid var(--ink);border-radius:12px;padding:8px 14px}
.hints .h{padding:6px 0;border-bottom:1.5px dashed #9AA8C4}
.hints .h:last-child{border-bottom:0}
.hints .h b{display:inline-block;margin-right:6px;font-size:.85rem;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:0 8px}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-weight:800}
.fb.ok{background:var(--mint2);border:2.5px solid var(--good)}
.fb.no{background:var(--pink2);border:2.5px dashed var(--bad)}
.fb.info{background:#EEF3FB;border:2px solid #9AA8C4}

/* tables, chips, sliders */
.subx{margin:4px 0 6px}
.subpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.subl{font-weight:800}
.subpick .chip{min-width:60px;min-height:52px;font-size:1.2rem}
.subeq{border:2px solid var(--ink);border-radius:12px;background:#fff;padding:10px 14px;margin:10px 0}
.subh{margin-bottom:6px}
.subc{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;font-size:1.08rem}
.subt td{font-size:1.25rem;font-weight:800}
.optb{display:inline-flex;align-items:center;border:2px dashed var(--ink);border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:800;background:#fff;margin-left:6px}
.tbl{border-collapse:collapse;margin:8px 0;font-size:1.05rem;width:100%;max-width:640px;background:#fff}
.tbl th,.tbl td{border:2px solid var(--ink);padding:6px 8px;text-align:center;min-width:64px;height:48px}
.tbl th{background:var(--hi2)}
.tbl td.rh{text-align:left;font-weight:700;background:#FBFCFF}
.tbl .rv{min-height:36px;padding:0 10px;border-radius:8px;border:2px solid var(--ink);background:#fff;font-weight:800;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{min-width:48px;min-height:44px;padding:0 12px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-size:1.05rem;font-weight:700}
.chip.on{background:var(--hi);box-shadow:inset 0 0 0 3px var(--ink);font-weight:900}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:48px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:var(--sky2);border:2px solid var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;background:var(--hi);border:3px solid var(--ink);margin-top:-15px;box-shadow:2px 2px 0 var(--ink)}
input[type=range]::-moz-range-track{height:12px;border-radius:6px;background:var(--sky2);border:2px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--hi);border:3px solid var(--ink)}
.slab{display:block;font-weight:800;margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:10px;padding:4px 12px;font-weight:800;background:#fff}
.badge.yes{background:var(--mint2)}
.badge.no{background:var(--pink2);border-style:dashed}

.calc{font-size:1.08rem;font-weight:700;min-height:1.8em}

/* balance */
.balsvg{width:100%;max-width:440px;display:block;margin:0 auto}
.beam{transform-box:view-box;transform-origin:180px 64px;transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.pan{transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.baleq{font-size:1.3rem;text-align:center;font-weight:700;margin:6px 0}
.baleq .q{display:inline-block;min-width:1.4em;border:2px dashed var(--ink);border-radius:8px;margin:0 6px;font-weight:900}
.balstat{text-align:center;font-weight:800;font-size:1.05rem;margin:6px 0}
.tried{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tried span{border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-size:.9rem;background:var(--mint2);font-weight:700}
.tried span.u{background:var(--pink2);border-style:dashed}
.verdict{background:var(--hi2);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;font-weight:700;margin-top:8px}

/* area model */
.areasvg{width:100%;max-width:460px;display:block;margin:6px auto}
.ablk{transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.area .tw,.area .ts,.area .tm{opacity:0;transition:opacity .3s}
.area.s-whole .tw,.area.s-split .ts,.area.s-miss .tm{opacity:1}
.area.s-split .ablkB,.area.s-miss .ablkB{transform:translateX(22px)}
.area.s-miss .ablkB rect{fill:url(#hatch)}
.acap{text-align:center;font-weight:800;font-size:1.05rem;min-height:1.8em}
.area .chips{justify-content:center}

/* flow */
.flow{display:flex;flex-direction:column;align-items:center;gap:4px}
.fbx{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:8px 14px;font-weight:800;text-align:center;box-shadow:2px 2px 0 var(--ink)}
.fbx.ok{background:var(--mint2)}
.fbx.no{background:var(--pink2)}
.farr{font-size:1.2rem;font-weight:900;line-height:1}
.fsplit{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.fcol{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed #9AA8C4;border-radius:14px;padding:10px;background:#FBFCFF}
.fhead{font-weight:900;background:var(--hi);padding:0 10px;border-radius:6px;border:2px solid var(--ink)}
.fq{background:var(--hi2);border:2px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:900}
.fyn{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.fyn>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.fyn span{font-weight:900;color:var(--muted)}

/* demo, talk, self */
.demo .dcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.demo .dcol{background:#FBFCFF;border:2px solid var(--ink);border-radius:12px;padding:10px 12px}
.demo .dcol h4{margin:0 0 6px}
.demo .dl{font-size:1.1rem;min-height:34px;padding:2px 0}
.demo .dl.cont{padding-left:2.6em}
.demo .dl.hid{visibility:hidden}
.demo .dbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.talk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1.5px dashed #9AA8C4}
.talk:last-child{border-bottom:0}
.talk .ic{flex:none;width:44px;height:44px;border-radius:12px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.selfrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-bottom:1.5px dashed #9AA8C4}
.selfrow:last-child{border-bottom:0}
.selfrow .st{flex:1;min-width:220px;font-weight:700}
.selfrow .pick button{font-size:.92rem}
.eqcmp{display:flex;gap:14px;margin:14px 0 8px;flex-wrap:wrap}
.eqc{flex:1;min-width:140px;max-width:230px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.eqc .eqs{font:700 3.2rem/1.1 "Times New Roman",serif}
.eqc small{color:var(--muted);font-weight:700}
.eqc.hl{border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:var(--hi2);transform:rotate(-2deg)}
.eqc.hl .eqs{font-size:4.4rem;font-weight:900}
.eqc.hl b{font-size:1.15rem}
.sortl{list-style:none;padding:0;margin:8px 0}
.srow{display:flex;align-items:center;gap:10px;padding:6px 8px;margin:8px 0;border:2px solid var(--ink);background:#fff;border-radius:12px;position:relative;max-width:620px;box-shadow:2px 2px 0 var(--ink)}
.spos{width:32px;height:32px;border-radius:8px;background:var(--hi2);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.stext{flex:1;font-size:1.12rem}
.sbtn{display:flex;gap:6px;flex:none}
.sbtn button{min-width:46px;min-height:44px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-size:1rem}
.sbtn button:disabled{opacity:.3}

/* multiplication grid */

function hash(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ return function(){ seed=(seed+0x6D2B79F5)|0; var t=Math.imul(seed^(seed>>>15),1|seed); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function shuffle(a,seed){ var r=rng(seed), b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)); var x=b[i]; b[i]=b[j]; b[j]=x; } return b; }
var TOK=/\[(pick|num|slot):(\w+)(?:\|([^\]]*))?\]/g;
function parseT(t){
  var out=[], last=0, m; TOK.lastIndex=0;
  while((m=TOK.exec(t))){ if(m.index>last) out.push({text:t.slice(last,m.index)}); out.push({kind:m[1], id:m[2], arg:m[3]||''}); last=TOK.lastIndex; }
  if(last<t.length) out.push({text:t.slice(last)});
  return out;
}
Object.keys(Q).forEach(function(id){
  var q=Q[id];
  q._blanks=[]; q._bankLast={}; q._tiles=[]; q._bankOrder={};
  q._lines=(q.lines||[]).map(function(ln,i){
    var parts=parseT(ln.t);
    parts.forEach(function(p){
      if(p.kind){ q._blanks.push(p); if(p.kind==='slot') q._bankLast[p.arg]=i; }
    });
    var onlySlot = parts.length===1 && parts[0].kind==='slot';
    return {label:ln.label, note:ln.note, parts:parts, wide:onlySlot, cont:/^\s*=/.test(ln.t)};
  });
  if(q.banks){
    Object.keys(q.banks).forEach(function(b){
      var ids=[];
      q.banks[b].forEach(function(text){ var tid=q._tiles.length; q._tiles.push({id:tid, text:text, bank:b}); ids.push(tid); });
      q._bankOrder[b]=shuffle(ids, hash(id+b));
      q._bankLong=q._bankLong||{}; q._bankLong[b]=q.banks[b].some(function(x){return x.length>6;});
    });
  }
});

var KEY='identity-open-lesson-v13', S={}, T={};
try{ S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ S={}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function st(id){ if(!S[id]||!S[id].v) S[id]={v:{}, done:false, hint:0}; return S[id]; }
function tr(id){ if(!T[id]) T[id]={marks:{}, msg:null}; return T[id]; }

function norm(v){ return String(v==null?'':v).replace(/−/g,'-').replace(/\s+/g,'').replace(/^\+/,''); }
function valueOf(q,b,v){
  var raw=v[b.id];
  if(raw==null||raw==='') return null;
  if(b.kind==='slot'){ var t=q._tiles[raw]; return t?t.text:null; }
  if(b.kind==='num'){ var n=norm(raw); return (n===''||n==='-')?null:n; }
  return raw;
}
function same(b,a,e){
  if(b.kind==='num'){ return Number(norm(a))===Number(norm(e)); }
  return a===e;
}
function evaluate(q,v){
  if(q.type==='sort') return evalSort(q,v);
  if(q.check) return q.check(v,q);
  var best=null;
  [q.ans].concat(q.alts||[]).forEach(function(ans){
    var bad=[], empty=0;
    q._blanks.forEach(function(b){
      var val=valueOf(q,b,v);
      if(val==null){ empty++; bad.push(b.id); return; }
      if(!same(b,val,ans[b.id])) bad.push(b.id);
    });
    if(!best||bad.length<best.bad.length) best={bad:bad, empty:empty};
  });
  if(!best.bad.length) return {ok:true, bad:[]};
  if(best.empty===best.bad.length) return {ok:false, bad:best.bad, msg:'還有 '+best.empty+' 處未完成。'};
  var msg=null;
  for(var i=0;i<best.bad.length && !msg;i++){
    var bid=best.bad[i], b=q._blanks.filter(function(x){return x.id===bid;})[0];
    var val=valueOf(q,b,v); if(val==null) continue;
    var w=q.wrong&&q.wrong[bid];
    if(w){ msg = w[val] || w[norm(val)] || w['*'] || null; }
  }
  var filledBad=best.bad.length-best.empty;
  if(!msg) msg='有 '+filledBad+' 處不正確（已用 ✗ 標示），試試按「💡 提示」。';
  else if(best.empty) msg+='（另外還有 '+best.empty+' 處未完成。）';
  return {ok:false, bad:best.bad, msg:msg};
}
function teacherFill(id){
  var q=Q[id], s=st(id), used={};
  if(q.type==='sort'){ s.v={order:q.items.map(function(_,i){return i;})}; return; }
  s.v={};
  q._blanks.forEach(function(b){
    var a=q.ans[b.id];
    if(b.kind==='slot'){
      for(var i=0;i<q._tiles.length;i++){ var t=q._tiles[i]; if(!used[i] && t.bank===b.arg && t.text===a){ used[i]=1; s.v[b.id]=i; break; } }
    } else s.v[b.id]=a;
  });
  gridFill(id);
}

function ensureOrder(q,s){
  if(!s.v.order||s.v.order.length!==q.items.length){
    var o=shuffle(q.items.map(function(_,i){return i;}), hash(q.id));
    if(o.map(function(i){return q.items[i];}).join('|')===q.items.join('|')) o.reverse();
    s.v.order=o;
  }
  return s.v.order;
}
function evalSort(q,v){
  if(!v.order) return {ok:false, bad:[], msg:'請先用 ▲ ▼ 排列。'};
  var seq=v.order.map(function(i){return q.items[i];}), best=null;
  [q.items].concat(q.alts||[]).forEach(function(tg){
    var bad=[]; seq.forEach(function(x,k){ if(x!==tg[k]) bad.push(String(k)); });
    if(!best||bad.length<best.length) best=bad;
  });
  if(!best.length) return {ok:true, bad:[]};
  return {ok:false, bad:best, msg:'有 '+best.length+' 行位置不正確（已用 ✗ 標示），用 ▲ ▼ 調整次序。'};
}
function sortHTML(q,s,t){

};
function bankQ(id){ for(var i=0;i<BANK.length;i++) if(BANK[i].id===id) return BANK[i]; return null; }
function eqText(q){ return q.kind==='const' ? q.lhs+' ≡ '+q.rhs : q.L[0]+' = '+q.R[0]; }
function qText(q){
  if(q.kind==='chain') return q.q;
  if(q.kind==='const') return '若 `'+q.lhs+' ≡ '+q.rhs+'`，其中 `A` 和 `B` 都是常數，求 `A` 和 `B` 的值。';
  if(q.judge) return '判斷 `'+eqText(q)+'` 是否恆等式。';
  return '證明 `'+eqText(q)+'` '+(q.verdict==='yes'?'是':'不是')+'恆等式。';
}
function chainHTML(head, arr){
  return arr.map(function(t,i){ return '<div class="al'+(i?' c':'')+'">'+(i?math('= '+t):head+math(' = '+t))+'</div>'; }).join('');
}
function ansHTML(q){
  var h='';
  if(q.kind==='chain'){
    h+='<div class="al">'+math(q.start)+'</div>'+q.steps.map(function(t){ return '<div class="al c">'+math('= '+t)+'</div>'; }).join('');
    return h;
  }
  if(q.kind==='const'){
    h+=chainHTML('左方',q.L)+'<div class="al">右方 '+math('= '+q.rhs)+'</div>';
    h+=q.cmp.map(function(t){ return '<div class="al">'+fm(t)+'</div>'; }).join('');
    return h;
  }
  var eq=eqText(q), yes=q.verdict==='yes', m1=q.L.length>1||q.R.length>1;
  if(m1){
    if(!yes&&q.m2) h+='<div class="am">方法一</div>';
    h+=chainHTML('左方',q.L)+chainHTML('右方',q.R);
    h+='<div class="al">∵ 左方 '+(yes?'=':'≠')+' 右方</div>';
    h+='<div class="al">∴ '+(yes?math(eq.replace(' = ',' ≡ ')):math(eq)+' 不是恆等式。')+'</div>';
  }
  if(!yes&&q.m2){
    var m=q.m2;
    h+='<div class="am">'+(m1?'方法二':'解')+'</div>';
    h+='<div class="al">把 '+math('x = '+m.x)+' 代入等式。</div>';
    h+='<div class="al">左方 '+math('= '+m.L[0])+'</div>'+m.L.slice(1).map(function(t){ return '<div class="al c">'+math('= '+t)+'</div>'; }).join('');
    h+='<div class="al">右方 '+math('= '+m.R[0])+'</div>'+m.R.slice(1).map(function(t){ return '<div class="al c">'+math('= '+t)+'</div>'; }).join('');
    h+='<div class="al">∵ 左方 ≠ 右方</div><div class="al">∴ '+math('x = '+m.x)+' 不滿足等式。</div><div class="al">∴ '+math(eq)+' 不是恆等式。</div>';
    if(q.trap) h+='<div class="an">注意：代入 '+math('x = 0')+' 時左方 = 右方，不能用來證明，要改試其他 '+math('x')+' 值。</div>';
  }
  return h;
}
function pickSet(lv, avoid, seed){
  var ids=BANK.filter(function(q){ return q.lv===lv; }).map(function(q){ return q.id; });
  for(var k=0;k<20;k++){
    var s=shuffle(ids, seed+k*7919).slice(0,6).sort();
    if(!avoid||s.join()!==avoid.join()) return s;
  }
  return ids.slice(0,6);
}

  '</div>';
}
function renderTP(anim){
  var st=tpState(), body=document.getElementById('tpBody'); if(!body) return;
  document.querySelectorAll('.lvbtn').forEach(function(b){ var on=+b.dataset.lv===st.lv; b.classList.toggle('on',on); b.setAttribute('aria-checked',on); });
  if(!st.lv){ body.innerHTML='<div class="tpempty">選一個難度，題目便會在這裏出現。</div>'; return; }
  var set=st.sets[st.lv], cnt=set.filter(function(id){ return st.done[id]; }).length;
  body.innerHTML='<div class="tpbar"><div><b>'+LV_INFO[st.lv].stars+' '+LV_INFO[st.lv].name+'</b>　已抄 '+cnt+' / 6 題</div>'+
    '<button type="button" class="btn" id="tpNew">換一組題目</button></div>'+
    '<div class="tplist'+(anim?' tpin':'')+'">'+set.map(function(id,i){ return tpCard(id,i+1); }).join('')+'</div>'+
    (cnt===6?'<div class="fb ok">6 題都抄好了！回家把證明寫完，下一節課交。</div>':'');

function renderKey(lv){
  var el=document.getElementById('tpKey'); if(!el) return;

  el.innerHTML=BANK.filter(function(q){ return q.lv===lv; }).map(function(q){

document.addEventListener('click', function(e){
  var b=e.target.closest('.lvbtn');
  if(b){ var st=tpState(), lv=+b.dataset.lv, changed=st.lv!==lv; st.lv=lv;
    if(!st.sets[lv]) st.sets[lv]=pickSet(lv, null, (Date.now()%100000));
    save(); renderTP(changed); if(changed&&typeof buddySay==='function') buddySay(LV_INFO[lv].say,'hop'); return; }
  if(e.target.closest('#tpNew')){ var st2=tpState(), old=st2.sets[st2.lv];
    st2.sets[st2.lv]=pickSet(st2.lv, old, (Date.now()%100000)+13); save(); renderTP(true);
    if(typeof buddySay==='function') buddySay('換了一組新題目，記得連題號一起抄！'); return; }
  var c=e.target.closest('[data-copy]');
  if(c){ var st3=tpState(), id=c.dataset.copy; st3.done[id]=!st3.done[id]; save(); renderTP(false);
    var all=st3.sets[st3.lv].every(function(x){ return st3.done[x]; });
    if(all&&st3.done[id]&&typeof buddySay==='function') buddySay('全部抄好了！回家加油！','hop'); return; }
  var a=e.target.closest('[data-tpans]');
  if(a){ var box=a.nextElementSibling; box.hidden=!box.hidden; a.textContent=box.hidden?'顯示答案':'隱藏答案'; return; }
  var k=e.target.closest('[data-keylv]'); if(k){ renderKey(+k.dataset.keylv); }
});

  nav.addEventListener('click', function(e){ var b=e.target.closest('.tab'); if(b) showTab(b.dataset.tab); });
}
function shortName(n){ return {'證明是恆等式':'證明是','證明不是恆等式':'證明不是','挑戰區':'挑戰','自主練習':'自主練習'}[n]||n; }

/* =========================================================
   時間條（香港時間，自動運行）
   ========================================================= */
function sec(hm){ var a=hm.split(':'); return (+a[0])*3600+(+a[1])*60; }
var L0=sec(PH[0].s), L1=sec(PH[PH.length-1].e);
function hkSec(){ return ((Date.now()/1000+8*3600)%86400+86400)%86400; }
var OFF=0, PV=P.get('preview');
if(PV&&/^\d{1,2}:\d{2}$/.test(PV)) OFF=sec(PV)-hkSec(); else PV=null;
function nowSec(){ return ((hkSec()+OFF)%86400+86400)%86400; }
function fmtMS(s){ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function fmtHM(t){ t=Math.floor(t); return String(Math.floor(t/3600)).padStart(2,'0')+':'+String(Math.floor(t%3600/60)).padStart(2,'0'); }
function phaseAt(t){ for(var i=0;i<PH.length;i++){ if(t>=sec(PH[i].s)&&t<sec(PH[i].e)) return i; } return -1; }
function timerInfo(t,pi){
  var r={phase:-1, before:false, after:false, status:'', pace:'', paceKind:''};
  if(t<L0){ r.before=true; r.status='⏳ 課堂將於 14:25 開始（尚有 '+fmtMS(L0-t)+'）'; }
  else if(t>=L1){ r.after=true; r.status='🔔 課堂已完結'; }
  else { var i=phaseAt(t), p=PH[i]; r.phase=i; r.status='⏱ 現在 '+fmtHM(t)+'　應進行：第 '+(i+1)+' 部分 '+p.name+'（尚餘 '+fmtMS(sec(p.e)-t)+'）'; }
  if(!r.before && pi>=0){
    var q=PH[pi], s0=sec(q.s), e0=sec(q.e), m;
    if(r.after && pi===PH.length-1){ r.paceKind='on'; r.pace='✓ 已到最後部分'; }
    else if(t<s0-30){ m=Math.max(1,Math.round((s0-t)/60)); r.paceKind='ahead'; r.pace='⏩ 超前 '+m+' 分鐘'; }
    else if(t>e0+30){ m=Math.max(1,Math.round((t-e0)/60)); r.paceKind='behind'; r.pace='⏪ 落後 '+m+' 分鐘'; }
    else { r.paceKind='on'; r.pace='✓ 準時'; }
    r.pace+='（實際：第 '+(pi+1)+' 部分）';
  }
  return r;
}
function buildTimer(){
  var tot=L1-L0;
  document.getElementById('tbar').innerHTML=PH.map(function(p,i){
    return '<div class="seg" data-i="'+i+'" style="flex:'+(sec(p.e)-sec(p.s))+' 1 0;background-color:var('+p.col+')"><span>'+(i+1)+' '+shortName(p.name)+'</span></div>';
  }).join('');
  var marks=PH.map(function(p){return p.s;}).concat([PH[PH.length-1].e]);
  document.getElementById('ticks').innerHTML=marks.map(function(m){ return '<span style="left:'+((sec(m)-L0)/tot*100)+'%">'+m+'</span>'; }).join('');
}
function tick(){
  var t=nowSec(), pi=PH.map(function(p){return p.tab;}).indexOf(progTab);
  var r=timerInfo(t,pi);
  document.querySelectorAll('#tbar .seg').forEach(function(s,i){
    s.classList.toggle('past', t>=sec(PH[i].e));
    s.classList.toggle('cur', i===r.phase);
  });
  var ptr=document.getElementById('ptr');
  ptr.style.display=r.before?'none':'block';
  ptr.style.left=(Math.min(1,Math.max(0,(t-L0)/(L1-L0)))*100)+'%';
  document.getElementById('tnow').innerHTML=r.status+(PV?' <span class="pvw">（預覽時間）</span>':'');
  var pc=document.getElementById('tpace');
  if(TEACHER&&r.pace){ pc.hidden=false; pc.textContent=r.pace; pc.className='pace '+r.paceKind; }
  else pc.hidden=true;
}

  t2:'先熱身！證明恆等式時會用到這些技巧。',
  t3:'用天平試一試：甚麼等式無論 x 是甚麼都平衡？',

  t6:'最後整理一下今天學了甚麼。',

};
var PRAISE=['做得好！記得把步驟抄在工作紙上。','正確！你越來越熟練了。','好棒！下一題也難不到你。','完全正確！'];
var ENCOURAGE=['差一點！看看打了 ✗ 的位置。','不要緊，再試一次！','慢慢來，可以按「💡 提示」。'];
var buddy, bub, bubTimer=null, eyeTarget=null, idleTimer=null, idleSaid={}, pick=0;
function buddyBuild(){
  buddy=document.createElement('div'); buddy.id='buddy';
  buddy.innerHTML='<div class="bbub" id="bbub" role="status" aria-live="polite"></div><button type="button" id="buddyBtn" aria-label="鉛筆仔：點一下收起或打開">'+BUDDY_SVG+'</button>';
  document.body.appendChild(buddy);
  bub=buddy.querySelector('#bbub');
  try{ if(localStorage.getItem('identity-buddy-mini')==='1') buddy.classList.add('mini'); }catch(e){}
  buddy.querySelector('#buddyBtn').addEventListener('click', function(){
    var m=buddy.classList.toggle('mini');
    try{ localStorage.setItem('identity-buddy-mini', m?'1':'0'); }catch(e){}
    if(!m) buddySay('我回來了！有需要可以按「💡 提示」。');
  });
  document.addEventListener('pointermove', function(e){ eyeTarget={x:e.clientX, y:e.clientY}; lookSoon(); }, {passive:true});
  document.addEventListener('pointerdown', function(e){ eyeTarget={x:e.clientX, y:e.clientY}; lookSoon(); resetIdle(); }, {passive:true});
}
var lookRAF=null;
function lookSoon(){ if(!lookRAF) lookRAF=requestAnimationFrame(function(){ lookRAF=null; look(); }); }
function look(){
  if(!buddy||!eyeTarget) return;
  var r=buddy.querySelector('#buddyBtn').getBoundingClientRect();
  var cx=r.left+r.width*0.5, cy=r.top+r.height*0.4;
  var dx=eyeTarget.x-cx, dy=eyeTarget.y-cy, d=Math.sqrt(dx*dx+dy*dy)||1;
  var a=24*Math.PI/180, lx=(dx*Math.cos(a)+dy*Math.sin(a))/d, ly=(-dx*Math.sin(a)+dy*Math.cos(a))/d;
  var k=Math.min(1,d/160)*2.6;
  ['bpL','bpR'].forEach(function(id,i){
    var p=buddy.querySelector('#'+id); if(!p) return;
    p.setAttribute('cx',(i?57:43)+lx*k); p.setAttribute('cy',41+ly*k);
  });
}
function lookAt(el){ if(!el) return; var r=el.getBoundingClientRect(); eyeTarget={x:r.left+Math.min(r.width,300)/2, y:r.top+Math.min(r.height,200)/2}; look(); }
function buddySay(text, mood){
  if(!buddy||buddy.classList.contains('mini')) return;
  bub.innerHTML=fm(text.replace(/\bx\b/g,'`x`'));
  bub.classList.remove('show'); void bub.offsetWidth; bub.classList.add('show');
  clearTimeout(bubTimer); bubTimer=setTimeout(function(){ bub.classList.remove('show'); }, 4200);

    buddy.classList.remove('hop','tilt'); void buddy.offsetWidth; buddy.classList.add(mood);
    setTimeout(function(){ buddy.classList.remove(mood); }, 700);

  if(mouth) mouth.setAttribute('d', mood==='hop' ? 'M44 51 Q50 60 56 51 Z' : mood==='tilt' ? 'M45.5 54 Q50 51.5 54.5 54' : 'M45 52 Q50 57.5 55 52');
}
