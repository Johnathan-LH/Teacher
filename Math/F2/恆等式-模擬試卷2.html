<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b3a4b">
<title>2A 第3章 恆等式 模擬試卷 — 互動練習</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.21/katex.min.css">
<style>
:root {
  --paper: #f3efe4;
  --ink: #1d1a16;
  --muted: #5e584e;
  --navy: #1b3a4b;
  --navy-2: #274e63;
  --card: #fffdf8;
  --line: #e3d9c6;
  --stamp: #8f2d2d;
  --ok: #1c6b45;
  --ok-bg: #e7f5ee;
  --bad: #8f2d2d;
  --bad-bg: #fbeeed;
  --gold: #8a6a2f;
  --gold-bg: #f8f1de;
  --chip: #efe6d4;
  --shadow: 0 10px 30px rgba(27, 58, 75, 0.08);
  --font: "Iowan Old Style", Palatino, "Palatino Linotype", "Songti TC", "PMingLiU", "Noto Serif TC", serif;
  --ui: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  --kb-h: 0px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--ui);
  color: var(--ink);
  background:
    radial-gradient(1200px 400px at 10% -10%, rgba(196, 161, 90, 0.18), transparent 50%),
    var(--paper);
  line-height: 1.55;
  font-size: 17px;
  padding-bottom: calc(var(--kb-h) + 28px + env(safe-area-inset-bottom));
}
button, [role="button"] { font-family: inherit; cursor: pointer; }
button { touch-action: manipulation; }
img { max-width: 100%; }
.wrap { width: min(980px, calc(100% - 28px)); margin: 0 auto; }
header.top {
  background: var(--navy);
  color: #f7f3ea;
  padding: 22px 0 16px;
}
header.top h1 {
  font-family: var(--font);
  font-size: clamp(1.25rem, 2.4vw, 1.7rem);
  line-height: 1.35;
  margin: 0 0 6px;
  font-weight: 650;
  letter-spacing: 0.01em;
}
.sub { margin: 0; color: #e4dccb; font-size: 0.95rem; }
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-top: 14px;
}
.modes {
  display: flex;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 4px;
  gap: 4px;
}
.modes button, .ghost, .primary, .opt, .key, .qnav button, .self button, .calc-keys button {
  min-height: 44px;
  min-width: 44px;
  border-radius: 10px;
  border: 1px solid transparent;
  font-size: 1rem;
}
.modes button {
  background: transparent;
  color: #f7f3ea;
  padding: 0 14px;
}
.modes button[aria-pressed="true"] {
  background: #f7f3ea;
  color: var(--navy);
  font-weight: 700;
}
.ghost {
  background: transparent;
  color: #f7f3ea;
  border-color: rgba(247, 243, 234, 0.35);
  padding: 0 12px;
}
.qnav-wrap { padding: 14px 0 4px; }
.qnav {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
  gap: 6px;
}
.qnav button {
  background: var(--card);
  color: var(--navy);
  border: 1px solid var(--line);
  font-weight: 700;
  padding: 0;
  position: relative;
}
.qnav button.done { background: var(--ok); color: white; border-color: var(--ok); }
.qnav button.hint { background: var(--gold-bg); color: var(--gold); border-color: #e4d2a4; }
.qnav button.done::after, .qnav button.hint::after {
  content: "✓";
  position: absolute;
  top: 1px; right: 3px;
  font-size: 10px;
  line-height: 1;
}
.qnav button.hint::after { content: "💡"; font-size: 9px; }
.qnav button:focus-visible, .key:focus-visible, .opt:focus-visible, .primary:focus-visible, .ghost:focus-visible {
  outline: 3px solid #c4a15a;
  outline-offset: 2px;
}
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 0.86rem; margin: 8px 0 0; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }
.sw.todo { background: white; }
.sw.done { background: var(--ok); border-color: var(--ok); }
.sw.hint { background: var(--gold-bg); border-color: #e4d2a4; }
.formulas {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 14px 0;
}
.formulas div {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  font-family: var(--font);
  font-size: 0.98rem;
}
.sec {
  margin: 18px 0 8px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.sec h2 { font-family: var(--font); font-size: 1.25rem; margin: 0; color: var(--navy); }
.sec span { color: var(--stamp); font-weight: 700; }
.qcard {
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 6px solid var(--navy);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 16px 16px 14px;
  margin: 0 0 14px;
}
.qhead { display: flex; gap: 10px; align-items: flex-start; }
.qno {
  flex: none;
  width: 44px; height: 44px;
  border-radius: 10px;
  background: var(--navy);
  color: #f7f3ea;
  display: grid; place-items: center;
  font-weight: 800;
}
.qhead h3 { margin: 0; font-size: 1.08rem; line-height: 1.45; font-weight: 650; flex: 1; }
.marks {
  flex: none;
  color: var(--stamp);
  border: 1.5px solid var(--stamp);
  border-radius: 8px;
  min-height: 44px;
  display: grid; place-items: center;
  padding: 0 10px;
  font-weight: 800;
}
.stem { margin: 8px 0; overflow-x: auto; }
.part { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--line); }
.part-h { display: flex; justify-content: space-between; font-weight: 700; color: var(--navy); }
.step { margin-top: 10px; background: #fbf8f2; border-radius: 12px; padding: 10px; }
.step.locked { opacity: 0.55; }
.step-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.step-top h4 { margin: 0; font-size: 1rem; }
.lead { margin: 6px 0; }
.field { margin: 8px 0; }
.flab { display: block; font-weight: 650; margin-bottom: 4px; }
.ablank {
  min-height: 52px;
  border: 2px solid #d9d0bf;
  background: white;
  border-radius: 12px;
  padding: 8px 12px;
  overflow-x: auto;
  font-size: 1.15rem;
}
.ablank.hot { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(27, 58, 75, 0.15); }
.ablank[data-status="ok"] { border-color: var(--ok); background: var(--ok-bg); }
.ablank[data-status="bad"] { border-color: var(--bad); background: var(--bad-bg); }
.ph { color: #8a8172; font-size: 0.95rem; }
.cur {
  display: inline-block;
  width: 0;
  border-right: 2px solid var(--navy);
  margin-left: 1px;
  animation: blink 1.05s step-end infinite;
}
@keyframes blink { 50% { border-color: transparent; } }
@media (prefers-reduced-motion: reduce) {
  .cur { animation: none; }
}
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt {
  background: white;
  border: 2px solid #d9d0bf;
  padding: 8px 12px;
  text-align: left;
}
.opt.picked { border-color: var(--navy); background: #eef4f7; font-weight: 700; }
.opt.okpick { border-color: var(--ok); background: var(--ok-bg); }
.opt.badpick { border-color: var(--bad); background: var(--bad-bg); }
.primary {
  background: var(--navy);
  color: #f7f3ea;
  border: none;
  padding: 0 16px;
  font-weight: 700;
}
.primary:disabled, .opt:disabled, .key:disabled { opacity: 0.45; cursor: not-allowed; }
.hintbtn {
  background: var(--gold-bg);
  color: var(--gold);
  border: 1px solid #e4d2a4;
  min-height: 44px;
  border-radius: 10px;
  padding: 0 12px;
  font-weight: 700;
}
.rowbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.sir {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: var(--gold-bg);
  border-radius: 14px;
  padding: 10px;
  margin-top: 8px;
}
.sir.ok { background: var(--ok-bg); }
.sir.bad { background: var(--bad-bg); }
.sir-img, .sir-fallback {
  width: 48px; height: 48px; border-radius: 50%;
  flex: none; object-fit: cover; background: var(--navy);
}
.sir-fallback { display: grid; place-items: center; font-size: 1.4rem; }
.sir-txt { margin: 0; white-space: pre-wrap; }
.sym { font-weight: 800; margin-right: 4px; }
.note {
  font-size: 0.92rem;
  color: var(--stamp);
  background: #fbeeed;
  border-radius: 10px;
  padding: 8px 10px;
}
.solution {
  margin-top: 12px;
  border-top: 2px solid var(--navy);
  padding-top: 8px;
}
.solution h4 { margin: 0 0 6px; font-family: var(--font); }
.sline { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin: 2px 0; }
.mk {
  flex: none;
  color: var(--stamp);
  font-weight: 800;
  border: 1.5px solid var(--stamp);
  border-radius: 999px;
  padding: 0 8px;
  min-height: 28px;
  display: inline-grid;
  place-items: center;
}
.self {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.self button {
  width: 44px;
  background: var(--chip);
  border: 1px solid var(--line);
  font-size: 1.3rem;
  font-weight: 700;
}
.self b { min-width: 1.4em; text-align: center; font-size: 1.2rem; }
#score {
  position: sticky;
  bottom: calc(var(--kb-h) + env(safe-area-inset-bottom));
  z-index: 30;
  background: var(--navy);
  color: #f7f3ea;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  justify-content: center;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  font-weight: 650;
}
#score[hidden] { display: none; }
#score b { font-size: 1.15rem; }
#kb {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  background: #f7f3ea;
  border-top: 1px solid var(--line);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  box-shadow: 0 -8px 24px rgba(27, 58, 75, 0.12);
  display: none;
}
#kb.show { display: block; }
.kb-vars { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.kb-grid { display: grid; grid-template-columns: repeat(5, minmax(44px, 1fr)); gap: 6px; }
.key {
  background: white;
  border: 1px solid #d9d0bf;
  font-weight: 700;
  font-size: 1.05rem;
}
.key.go { background: var(--ok); color: white; border-color: var(--ok); grid-column: span 3; }
.key.warn { background: #f3e4e4; }
#calc-fab {
  position: fixed;
  right: 12px;
  bottom: calc(var(--kb-h) + 16px + env(safe-area-inset-bottom));
  z-index: 36;
  width: 56px; height: 56px;
  border-radius: 50%;
  border: none;
  background: var(--gold);
  color: white;
  font-size: 1.5rem;
  box-shadow: var(--shadow);
}
#calc {
  position: fixed;
  right: 12px;
  bottom: calc(var(--kb-h) + 80px + env(safe-area-inset-bottom));
  z-index: 34;
  width: min(360px, calc(100vw - 20px));
  background: #fffdf8;
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
#calc[hidden] { display: none; }
.calc-head {
  background: var(--navy);
  color: #f7f3ea;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 8px 8px 12px;
  cursor: grab;
  touch-action: none;
  user-select: none;
}
.calc-head button {
  min-width: 44px; min-height: 44px;
  background: transparent; color: #f7f3ea; border: none; font-size: 1.1rem;
}
.calc-screen { padding: 8px 12px; background: #102833; color: #f4efe4; min-height: 72px; }
.calc-expr { min-height: 1.3em; word-break: break-all; color: #d9e4ea; }
.calc-res { font-size: 1.45rem; font-weight: 700; text-align: right; word-break: break-all; }
.calc-keys { display: grid; grid-template-columns: repeat(4, minmax(44px, 1fr)); gap: 6px; padding: 8px; }
.calc-keys button { background: white; border: 1px solid var(--line); font-weight: 700; }
.calc-keys button.eq { background: var(--navy); color: white; }
#modal {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(29, 26, 22, 0.45);
  display: grid; place-items: center;
  padding: 16px;
}
#modal[hidden] { display: none; }
.dialog {
  background: var(--card);
  border-radius: 16px;
  padding: 18px;
  width: min(420px, 100%);
}
.dialog p { margin-top: 0; }
.dialog .rowbtns { justify-content: flex-end; }
.saved { color: #d9e4ea; font-size: 0.85rem; }
@media (max-width: 720px) {
  .formulas { grid-template-columns: 1fr; }
  .wrap { width: min(980px, calc(100% - 16px)); }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>2A 第3章 恆等式 模擬試卷 — 互動練習</h1>
    <p class="sub">不會做就用「分步提示」，一步一步填；會做就用「對答案」，再按評分準則自評。全卷 19 題，60 分。</p>
    <div class="toolbar">
      <div class="modes" role="group" aria-label="模式">
        <button type="button" id="mode-steps" aria-pressed="true">分步提示</button>
        <button type="button" id="mode-answers" aria-pressed="false">對答案</button>
      </div>
      <button type="button" class="ghost" id="reset">重設全部</button>
      <span class="saved">進度保存在這部裝置</span>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="qnav-wrap">
    <div class="qnav" id="qnav" aria-label="題目導航"></div>
    <p class="legend"><span><i class="sw todo"></i>未做</span><span><i class="sw done"></i>已完成</span><span><i class="sw hint"></i>用過提示</span></p>
  </div>
  <div class="formulas" aria-label="恆等式">
    <div>(▲+■)² = ▲² + 2▲■ + ■²</div>
    <div>(▲−■)² = ▲² − 2▲■ + ■²</div>
    <div>(▲+■)(▲−■) = ▲² − ■²</div>
  </div>
  <main id="main"></main>
</div>
<footer id="score" hidden></footer>
<div id="kb" aria-label="數式鍵盤">
  <div class="kb-vars" id="kb-vars"></div>
  <div class="kb-grid">
    <button type="button" class="key" data-k="7">7</button>
    <button type="button" class="key" data-k="8">8</button>
    <button type="button" class="key" data-k="9">9</button>
    <button type="button" class="key" data-k="+">+</button>
    <button type="button" class="key" data-k="(">(</button>
    <button type="button" class="key" data-k="4">4</button>
    <button type="button" class="key" data-k="5">5</button>
    <button type="button" class="key" data-k="6">6</button>
    <button type="button" class="key" data-k="-">−</button>
    <button type="button" class="key" data-k=")">)</button>
    <button type="button" class="key" data-k="1">1</button>
    <button type="button" class="key" data-k="2">2</button>
    <button type="button" class="key" data-k="3">3</button>
    <button type="button" class="key" data-k="pow">x²</button>
    <button type="button" class="key" data-k="^">^</button>
    <button type="button" class="key" data-k="0">0</button>
    <button type="button" class="key" data-k=".">.</button>
    <button type="button" class="key" data-k="/">／</button>
    <button type="button" class="key" data-k="bksp" aria-label="刪除">⌫</button>
    <button type="button" class="key warn" data-k="clear">清除</button>
    <button type="button" class="key" data-k="left" aria-label="游標向左">◀</button>
    <button type="button" class="key" data-k="right" aria-label="游標向右">▶</button>
    <button type="button" class="key go" data-k="ok">✓ 核對</button>
  </div>
</div>
<button type="button" id="calc-fab" aria-label="計算機" aria-expanded="false">🧮</button>
<div id="calc" hidden>
  <div class="calc-head" id="calc-head">
    <strong>計算機</strong>
    <span>
      <button type="button" id="calc-min" aria-label="最小化">—</button>
      <button type="button" id="calc-close" aria-label="關閉">✕</button>
    </span>
  </div>
  <div id="calc-body">
    <div class="calc-screen">
      <div class="calc-expr" id="calc-expr">0</div>
      <div class="calc-res" id="calc-res"></div>
    </div>
    <div class="calc-keys" id="calc-keys">
      <button type="button" data-c="(">(</button>
      <button type="button" data-c=")">)</button>
      <button type="button" data-c="pow">x²</button>
      <button type="button" data-c="xy">xʸ</button>
      <button type="button" data-c="sqrt">√</button>
      <button type="button" data-c="sign">±</button>
      <button type="button" data-c="bksp">⌫</button>
      <button type="button" data-c="ac">AC</button>
      <button type="button" data-c="7">7</button>
      <button type="button" data-c="8">8</button>
      <button type="button" data-c="9">9</button>
      <button type="button" data-c="/">÷</button>
      <button type="button" data-c="4">4</button>
      <button type="button" data-c="5">5</button>
      <button type="button" data-c="6">6</button>
      <button type="button" data-c="*">×</button>
      <button type="button" data-c="1">1</button>
      <button type="button" data-c="2">2</button>
      <button type="button" data-c="3">3</button>
      <button type="button" data-c="-">−</button>
      <button type="button" data-c="0">0</button>
      <button type="button" data-c=".">.</button>
      <button type="button" data-c="ans">Ans</button>
      <button type="button" data-c="+">+</button>
      <button type="button" class="eq" data-c="eq" style="grid-column: span 4">=</button>
    </div>
  </div>
</div>
<div id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <p id="modal-title">確定清走全部進度？此動作不能還原。</p>
    <div class="rowbtns">
      <button type="button" class="ghost" id="reset-no" style="color:#1b3a4b;border-color:#d9d0bf;background:#fff">取消</button>
      <button type="button" class="primary" id="reset-yes">確定重設</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.21/katex.min.js"></script>
<script>
// Rational + polynomial engine (no eval). Coefficients are reduced integer fractions.

function gcd(a, b) {
  a = Math.abs(a);
  b = Math.abs(b);
  while (b) {
    const t = b;
    b = a % b;
    a = t;
  }
  return a || 1;
}

function rat(n, d = 1) {
  if (!Number.isFinite(n) || !Number.isFinite(d) || d === 0) throw new Error("格式不正確");
  n = Math.trunc(n);
  d = Math.trunc(d);
  if (d < 0) {
    n = -n;
    d = -d;
  }
  const g = gcd(n, d);
  return { n: n / g, d: d / g };
}

function rneg(a) {
  return rat(-a.n, a.d);
}
function radd(a, b) {
  return rat(a.n * b.d + b.n * a.d, a.d * b.d);
}
function rsub(a, b) {
  return rat(a.n * b.d - b.n * a.d, a.d * b.d);
}
function rmul(a, b) {
  return rat(a.n * b.n, a.d * b.d);
}
function rdiv(a, b) {
  if (b.n === 0) throw new Error("不可以除以零");
  return rat(a.n * b.d, a.d * b.n);
}
function req(a, b) {
  return a.n === b.n && a.d === b.d;
}
function rpow(a, k) {
  if (k === 0) return rat(1, 1);
  let n = 1;
  let d = 1;
  let baseN = a.n;
  let baseD = a.d;
  let e = k;
  while (e) {
    if (e & 1) {
      n *= baseN;
      d *= baseD;
    }
    e >>= 1;
    if (e) {
      baseN *= baseN;
      baseD *= baseD;
    }
  }
  return rat(n, d);
}

function decToRat(str) {
  const [ip, fp = ""] = str.split(".");
  const d = 10 ** fp.length;
  const ipn = ip === "" || ip === "+" || ip === "-" ? 0 : Number(ip);
  const frac = fp === "" ? 0 : Number(fp);
  const sign = ip.startsWith("-") ? -1 : 1;
  const n = ipn * d + sign * frac;
  return rat(n, d);
}

function monoKey(vars) {
  return [...vars.entries()]
    .filter(([, e]) => e !== 0)
    .sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0))
    .map(([v, e]) => v + "^" + e)
    .join("*");
}

function polyConst(c) {
  const m = new Map();
  if (c.n !== 0) m.set("", c);
  return m;
}
function polyVar(name) {
  const m = new Map();
  m.set(name + "^1", rat(1, 1));
  return m;
}
function polyNeg(p) {
  const m = new Map();
  for (const [k, c] of p) {
    const nc = rneg(c);
    if (nc.n !== 0) m.set(k, nc);
  }
  return m;
}
function polyAdd(a, b) {
  const m = new Map(a);
  for (const [k, c] of b) {
    const s = radd(m.get(k) || rat(0, 1), c);
    if (s.n === 0) m.delete(k);
    else m.set(k, s);
  }
  return m;
}
function polyScale(p, c) {
  const m = new Map();
  if (c.n === 0) return m;
  for (const [k, pc] of p) {
    const s = rmul(pc, c);
    if (s.n !== 0) m.set(k, s);
  }
  return m;
}
function mulKeys(k1, k2) {
  const m = new Map();
  const add = (k) => {
    if (!k) return;
    for (const part of k.split("*")) {
      const [v, e] = part.split("^");
      m.set(v, (m.get(v) || 0) + Number(e));
    }
  };
  add(k1);
  add(k2);
  return monoKey(m);
}
function polyMul(a, b) {
  const m = new Map();
  for (const [k1, c1] of a) {
    for (const [k2, c2] of b) {
      const k = mulKeys(k1, k2);
      const s = radd(m.get(k) || rat(0, 1), rmul(c1, c2));
      if (s.n === 0) m.delete(k);
      else m.set(k, s);
    }
  }
  return m;
}
function polyPow(p, n) {
  if (!Number.isInteger(n) || n < 0 || n > 12) throw new Error("次方必須是 0 到 12 的整數");
  let r = polyConst(rat(1, 1));
  for (let i = 0; i < n; i++) r = polyMul(r, p);
  return r;
}
function polyEq(a, b) {
  if (a.size !== b.size) return false;
  for (const [k, c] of a) {
    const o = b.get(k);
    if (!o || !req(c, o)) return false;
  }
  return true;
}
function polyVars(p) {
  const s = new Set();
  for (const k of p.keys()) {
    if (!k) continue;
    for (const part of k.split("*")) s.add(part.split("^")[0]);
  }
  return [...s];
}

const NORM_MINUS = /[\u2212\u2010\u2011\u2012\u2013\u2014]/g;

function normalizeExpr(raw) {
  return String(raw)
    .replace(NORM_MINUS, "-")
    .replace(/[×·⋅]/g, "*")
    .replace(/²/g, "^2")
    .replace(/³/g, "^3")
    .replace(/⁴/g, "^4")
    .replace(/\s+/g, "");
}

function parsePoly(raw) {
  const s = normalizeExpr(raw);
  if (!s) {
    const err = new Error("請先輸入答案");
    err.code = "empty";
    throw err;
  }
  if (!/^[0-9A-Za-z+*^./()-]+$/.test(s)) {
    const err = new Error("有不能用的符號");
    err.code = "badchar";
    throw err;
  }
  let i = 0;
  const flags = { usedDecimal: false, hasParen: false, uncombined: false };
  const n = s.length;
  function peek() {
    return s[i];
  }
  function eof() {
    return i >= n;
  }
  function parseNumberToken() {
    const start = i;
    while (i < n && /[0-9]/.test(s[i])) i++;
    if (s[i] === ".") {
      flags.usedDecimal = true;
      i++;
      if (!/[0-9]/.test(s[i] || "")) throw new Error("小數點後面要有數字");
      while (i < n && /[0-9]/.test(s[i])) i++;
    }
    if (i === start) throw new Error("這裡應該是數字");
    return decToRat(s.slice(start, i));
  }
  function parseExponent() {
    if (s[i] === "(") {
      flags.hasParen = true;
      i++;
      if (s[i] === "+") i++;
      if (!/[0-9]/.test(s[i] || "")) throw new Error("次方必須是正整數");
      let num = "";
      while (i < n && /[0-9]/.test(s[i])) num += s[i++];
      if (s[i] !== ")") throw new Error("括號不完整");
      i++;
      return Number(num);
    }
    if (!/[0-9]/.test(s[i] || "")) throw new Error("次方必須是正整數");
    let num = "";
    while (i < n && /[0-9]/.test(s[i])) num += s[i++];
    return Number(num);
  }
  function parseAtom() {
    if (s[i] === "(") {
      flags.hasParen = true;
      i++;
      const inner = parseSum();
      if (s[i] !== ")") throw new Error("括號不完整");
      i++;
      return inner;
    }
    if (/[0-9.]/.test(s[i] || "")) {
      return polyConst(parseNumberToken());
    }
    if (/[A-Za-z]/.test(s[i] || "")) {
      const name = s[i++];
      return polyVar(name);
    }
    throw new Error("格式不正確");
  }
  function parseFactor() {
    const base = parseAtom();
    if (s[i] === "^") {
      i++;
      const e = parseExponent();
      return polyPow(base, e);
    }
    return base;
  }
  function parseDenom() {
    if (s[i] === "(") {
      flags.hasParen = true;
      i++;
      if (s[i] === "+") i++;
      let sign = 1;
      if (s[i] === "-") {
        sign = -1;
        i++;
      }
      if (!/[0-9.]/.test(s[i] || "")) throw new Error("不可以除以變數，／後面只可寫數字");
      const num = parseNumberToken();
      if (s[i] !== ")") throw new Error("括號不完整");
      i++;
      return sign < 0 ? rneg(num) : num;
    }
    if (!/[0-9.]/.test(s[i] || "")) throw new Error("不可以除以變數，／後面只可寫數字");
    return parseNumberToken();
  }
  function startsFactor(ch) {
    return !!ch && /[0-9.A-Za-z(]/.test(ch);
  }
  function parseTerm() {
    let node = parseFactor();
    while (!eof()) {
      if (s[i] === "*") {
        i++;
        node = polyMul(node, parseFactor());
      } else if (s[i] === "/") {
        i++;
        const d = parseDenom();
        if (d.n === 0) throw new Error("不可以除以零");
        node = polyScale(node, rdiv(rat(1, 1), d));
      } else if (startsFactor(s[i])) {
        node = polyMul(node, parseFactor());
      } else break;
    }
    return node;
  }
  function parseSum() {
    const terms = [];
    let sign = 1;
    if (s[i] === "+") i++;
    else if (s[i] === "-") {
      sign = -1;
      i++;
    }
    if (eof() || s[i] === ")") throw new Error("格式不正確");
    terms.push({ sign, poly: parseTerm() });
    while (s[i] === "+" || s[i] === "-") {
      const op = s[i++];
      if (eof() || s[i] === ")" || s[i] === "+" || s[i] === "-") throw new Error("格式不正確");
      terms.push({ sign: op === "+" ? 1 : -1, poly: parseTerm() });
    }
    const acc = new Map();
    const seen = new Map();
    for (const t of terms) {
      for (const [k, c0] of t.poly) {
        const c = t.sign < 0 ? rneg(c0) : c0;
        if (c.n === 0) continue;
        seen.set(k, (seen.get(k) || 0) + 1);
        const s2 = radd(acc.get(k) || rat(0, 1), c);
        if (s2.n === 0) acc.delete(k);
        else acc.set(k, s2);
      }
    }
    for (const v of seen.values()) if (v > 1) flags.uncombined = true;
    return acc;
  }
  const poly = parseSum();
  if (!eof()) throw new Error("格式不正確");
  return { poly, flags };
}

function checkExpr(raw, answer, format, wrongList, vars) {
  if (raw == null || normalizeExpr(raw) === "") {
    return { ok: false, kind: "empty", msg: "請先輸入答案。" };
  }
  let student;
  try {
    student = parsePoly(raw);
  } catch (e) {
    return { ok: false, kind: "parse", msg: (e && e.message) || "格式不正確，請檢查符號。" };
  }
  let correct;
  try {
    correct = parsePoly(answer);
  } catch (e) {
    return { ok: false, kind: "parse", msg: "題目答案資料有問題" };
  }
  const allowed = new Set(vars || []);
  for (const v of polyVars(student.poly)) {
    if (!allowed.has(v)) {
      const swap = v === v.toLowerCase() ? v.toUpperCase() : v.toLowerCase();
      if (allowed.has(swap)) {
        return { ok: false, kind: "case", msg: `大小寫有分別：這格要用 ${swap}，不是 ${v}。` };
      }
      if (allowed.size === 0) return { ok: false, kind: "case", msg: "這格只需要數字，不用字母。" };
      return { ok: false, kind: "case", msg: `這格不用字母 ${v}。` };
    }
  }
  const equal = polyEq(student.poly, correct.poly);
  if (equal) {
    if (format === "number") {
      const nrm = normalizeExpr(raw);
      if (/[A-Za-z^()]/.test(nrm)) {
        return { ok: false, kind: "paren", msg: "數值正確，請寫成一個數字。" };
      }
    }
    if (format === "expand") {
      if (student.flags.hasParen) return { ok: false, kind: "paren", msg: "數值正確，但仍未展開。" };
      if (student.flags.uncombined) return { ok: false, kind: "combine", msg: "還可以合併同類項。" };
    }
    let msg = "正確！";
    if (student.flags.usedDecimal) msg += "建議寫成分數。";
    return { ok: true, kind: "ok", msg };
  }
  if (Array.isArray(wrongList)) {
    for (const w of wrongList) {
      try {
        const wp = parsePoly(w.expr);
        if (polyEq(student.poly, wp.poly)) {
          return { ok: false, kind: "specific", msg: w.msg };
        }
      } catch {
        /* ignore bad distractor */
      }
    }
  }
  const generic =
    format === "number"
      ? "數字不對，再算一次。"
      : format === "expand"
        ? "和正確答案不相等，再檢查每一項的係數和符號。"
        : "還未正確。項的次序可以不同，但係數要一樣。";
  return { ok: false, kind: "wrong", msg: generic };
}

const CUR = "\\htmlClass{cur}{\\vphantom{0}}";

function linearToLatex(raw, cursor) {
  const s = normalizeExpr(raw);
  const cpos = cursor == null ? -1 : Math.max(0, Math.min(cursor, s.length));
  if (!s) return cpos === 0 ? CUR : "";
  let i = 0;
  function readDigits(allowDot) {
    let out = "";
    const re = allowDot ? /[0-9.]/ : /[0-9]/;
    while (i < s.length && re.test(s[i])) {
      if (i === cpos) out += CUR;
      out += s[i++];
    }
    return out;
  }
  function readAtom() {
    if (i >= s.length) return "";
    if (s[i] === "(") {
      let out = "";
      if (i === cpos) out += CUR;
      out += "(";
      i++;
      out += readSum();
      if (i === cpos) out += CUR;
      if (s[i] === ")") {
        out += ")";
        i++;
      }
      return out;
    }
    if (/[0-9.]/.test(s[i])) return readDigits(true);
    if (/[A-Za-z]/.test(s[i])) {
      let out = "";
      if (i === cpos) out += CUR;
      out += s[i++];
      return out;
    }
    if (i === cpos) {
      i++;
      return CUR + s[i - 1];
    }
    return s[i++];
  }
  function readFactor() {
    let base = readAtom();
    if (s[i] === "^") {
      let mark = "";
      if (i === cpos) mark = CUR;
      i++;
      let exp = "";
      if (s[i] === "(") {
        if (i === cpos) exp += CUR;
        i++;
        while (i < s.length && s[i] !== ")") {
          if (i === cpos) exp += CUR;
          exp += s[i++];
        }
        if (i === cpos) exp += CUR;
        if (s[i] === ")") i++;
      } else {
        exp = readDigits(false);
      }
      if (!exp) exp = "\\square";
      return base + mark + "^{" + exp + "}";
    }
    return base;
  }
  function readDenom() {
    if (s[i] === "(") return readAtom();
    return readDigits(true);
  }
  function readTerm() {
    let acc = readFactor();
    while (i < s.length) {
      if (s[i] === "*" || s[i] === "/") {
        const op = s[i];
        let mark = "";
        if (i === cpos) mark = CUR;
        i++;
        if (op === "/") {
          const den = readDenom() || "\\square";
          acc = mark + "\\dfrac{" + acc + "}{" + den + "}";
        } else {
          acc = acc + mark + readFactor();
        }
      } else if (/[0-9.A-Za-z(]/.test(s[i] || "")) {
        acc += readFactor();
      } else break;
    }
    return acc;
  }
  function readSum() {
    let out = "";
    if (s[i] === "+" || s[i] === "-") {
      if (i === cpos) out += CUR;
      out += s[i++];
    }
    out += readTerm();
    while (s[i] === "+" || s[i] === "-") {
      if (i === cpos) out += CUR;
      out += s[i++];
      out += readTerm();
    }
    return out;
  }
  try {
    const out = readSum();
    const tail = i === cpos ? CUR : "";
    if (i !== s.length) {
      return fallback();
    }
    return out + tail;
  } catch {
    return fallback();
  }
  function fallback() {
    let out = "";
    for (let k = 0; k < s.length; k++) {
      if (k === cpos) out += CUR;
      const ch = s[k];
      out += "\\%{}_&#".includes(ch) ? "\\" + ch : ch === "^" ? "\\^{}" : ch;
    }
    if (cpos === s.length) out += CUR;
    return out;
  }
}

function calcEval(input) {
  const s = String(input)
    .replace(NORM_MINUS, "-")
    .replace(/×/g, "*")
    .replace(/÷/g, "/")
    .replace(/\s+/g, "");
  if (!s) throw new Error("請輸入算式");
  let i = 0;
  function parseE() {
    let v = parseT();
    while (s[i] === "+" || s[i] === "-") {
      const op = s[i++];
      const r = parseT();
      v = op === "+" ? v + r : v - r;
    }
    return v;
  }
  function parseT() {
    let v = parseP();
    while (s[i] === "*" || s[i] === "/") {
      const op = s[i++];
      const r = parseP();
      if (op === "/" && r === 0) throw new Error("不可以除以零");
      v = op === "*" ? v * r : v / r;
    }
    return v;
  }
  function parseP() {
    const v = parseU();
    if (s[i] === "^") {
      i++;
      const e = parseP();
      return Math.pow(v, e);
    }
    return v;
  }
  function parseU() {
    if (s[i] === "+") {
      i++;
      return parseU();
    }
    if (s[i] === "-") {
      i++;
      return -parseU();
    }
    if (s.startsWith("sqrt(", i)) {
      i += 5;
      const inner = parseE();
      if (s[i] !== ")") throw new Error("括號不完整");
      i++;
      if (inner < 0) throw new Error("負數不可開平方");
      return Math.sqrt(inner);
    }
    if (s[i] === "(") {
      i++;
      const v = parseE();
      if (s[i] !== ")") throw new Error("括號不完整");
      i++;
      return v;
    }
    const m = /^(\d+(\.\d+)?)/.exec(s.slice(i));
    if (!m) throw new Error("算式不正確");
    i += m[0].length;
    return Number(m[0]);
  }
  const v = parseE();
  if (i !== s.length) throw new Error("算式不正確");
  if (!Number.isFinite(v)) throw new Error("算式不正確");
  return v;
}

function formatSig(n) {
  if (!Number.isFinite(n)) return "錯誤";
  if (Object.is(n, -0) || n === 0) return "0";
  const abs = Math.abs(n);
  const exp = Math.floor(Math.log10(abs));
  const p = 10 - exp - 1;
  const f = Math.pow(10, p);
  const rounded = Math.round(n * f) / f;
  let out = rounded.toPrecision(10);
  if (/e/i.test(out)) {
    if (Math.abs(exp) < 10) {
      const fixed = Math.max(0, p);
      out = rounded.toFixed(Math.min(fixed, 12));
    } else {
      return rounded.toExponential(9).replace(/\.?0+e/, "e").replace("e+", "×10^");
    }
  }
  if (out.includes(".")) out = out.replace(/0+$/, "").replace(/\.$/, "");
  return out;
}

  if (polyVars(parsed.poly).length) {

  }

  document.getElementById("reset").addEventListener("click", () => { document.getElementById("modal").hidden = false; });
  document.getElementById("reset-no").addEventListener("click", () => { document.getElementById("modal").hidden = true; });
  document.getElementById("reset-yes").addEventListener("click", () => {
    try { localStorage.removeItem(KEY); } catch (e) {}
    state = fresh();
    activeId = null;
    document.getElementById("modal").hidden = true;
    render();
  });
  const main = document.getElementById("main");
  main.addEventListener("pointerdown", (e) => {
    const blank = e.target.closest(".ablank");
    if (!blank || blank.tabIndex < 0) return;
    e.preventDefault();
    const id = blank.dataset.id;
    const cell = ensure(id);
    const rect = blank.getBoundingClientRect();
    const ratio = rect.width ? (e.clientX - rect.left) / rect.width : 1;
    const len = (cell.value || "").length;
    if (activeId !== id) cell.cursor = Math.max(0, Math.min(len, Math.round(ratio * len)));
    activeId = id;
    updateKeyboard();
    paintAll();
    blank.focus({ preventScroll: true });
  });
  main.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act],[data-choice],[data-mc]");
    if (!t) return;
    if (t.dataset.choice) { choose(t.dataset.choice, t.dataset.opt); return; }
    if (t.dataset.mc) { choose("mc-" + t.dataset.mc, t.dataset.opt); return; }
    const act = t.dataset.act;
    if (act === "check-step") checkStep(t.dataset.step);
    else if (act === "check-part") checkPart(Number(t.dataset.q), t.dataset.part);
    else if (act === "hint") {
      const step = STEP.get(t.dataset.step);
      state.hints[step.id] = Math.min(2, (state.hints[step.id] || 0) + 1);
      state.help[step.qid] = true;
      save(); render();
    } else if (act === "hint-part") {
      const q = QUESTIONS.find((x) => x.id === Number(t.dataset.q));
      const part = q.parts.find((p) => p.id === t.dataset.part);
      const step = part.steps.find((s) => (state.hints[s.id] || 0) < 2) || part.steps[part.steps.length - 1];
      state.hints[step.id] = Math.min(2, (state.hints[step.id] || 0) + 1);
      state.help[q.id] = true;
      save(); render();
    } else if (act === "hint-mc") {
      const id = "mc-" + t.dataset.q;
      state.hints[id] = Math.min(2, (state.hints[id] || 0) + 1);
      state.help[Number(t.dataset.q)] = true;
      save(); render();
    } else if (act === "reveal") {
      const block = CELL.get(t.dataset.id);
      state.revealed[block.id] = true;
      state.help[block.qid] = true;
      save(); render();
    } else if (act === "reveal-mc") {
      const qid = Number(t.dataset.q);
      state.revealed["mc-" + qid] = true;
      state.help[qid] = true;
      save(); render();
    } else if (act === "sol") {
      const qid = Number(t.dataset.q);
      state.sol[qid] = !state.sol[qid];
      if (state.sol[qid] && qState(QUESTIONS.find((q) => q.id === qid)) !== "done") state.help[qid] = true;
      save(); render();
    } else if (act === "self") bumpSelf(Number(t.dataset.q), Number(t.dataset.d));
    else if (act === "verify") {
      state.revealed["ver-" + t.dataset.q + t.dataset.part] = true;
      save(); render();
    } else if (act === "lab") runLab();
    else if (act === "check-mc") gradeMc(Number(t.dataset.q));
  });
  document.getElementById("kb").addEventListener("pointerdown", (e) => {
    const key = e.target.closest("[data-k]");
    if (!key) return;
    e.preventDefault();
    onKey(key.dataset.k);
  });
  document.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".ablank") || e.target.closest("#kb") || e.target.closest("#calc") || e.target.closest("#calc-fab") || e.target.closest("#modal")) return;
    if (activeId) { activeId = null; updateKeyboard(); paintAll(); }
  });
  document.addEventListener("keydown", (e) => {
    if (!activeId) return;
    const ae = document.activeElement;
    if (!ae || !ae.classList.contains("ablank")) return;
    const key = e.key;
    if (key === "ArrowLeft") { e.preventDefault(); moveCursor(-1); }
    else if (key === "ArrowRight") { e.preventDefault(); moveCursor(1); }
    else if (key === "Backspace") { e.preventDefault(); backspace(); }
    else if (key === "Enter") { e.preventDefault(); checkActive(); }
    else if (key === "Escape") { e.preventDefault(); activeId = null; updateKeyboard(); paintAll(); }
    else if (key === " " ) { e.preventDefault(); }
    else if (key.length === 1 && /[0-9A-Za-z+*^./()\-]/.test(key)) { e.preventDefault(); insertText(key); }
  });
  document.addEventListener("paste", (e) => {
    if (!activeId || !document.activeElement?.classList.contains("ablank")) return;
    e.preventDefault();
    insertText((e.clipboardData || window.clipboardData).getData("text") || "");
  });
  document.getElementById("calc-fab").addEventListener("click", () => { calc.open = !calc.open; calc.mini = false; drawCalc(); });
  document.getElementById("calc-close").addEventListener("click", () => { calc.open = false; drawCalc(); });
  document.getElementById("calc-min").addEventListener("click", () => { calc.mini = !calc.mini; drawCalc(); });
  document.getElementById("calc-keys").addEventListener("click", (e) => {
    const b = e.target.closest("[data-c]");
    if (!b) return;
    calcPress(b.dataset.c);
  });
  const head = document.getElementById("calc-head");
  let drag = null;
  head.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    const rect = document.getElementById("calc").getBoundingClientRect();
    drag = { dx: e.clientX - rect.left, dy: e.clientY - rect.top };
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const panel = document.getElementById("calc");
    let x = e.clientX - drag.dx;
    let y = e.clientY - drag.dy;
    x = Math.max(8, Math.min(window.innerWidth - 80, x));
    y = Math.max(8, Math.min(window.innerHeight - 80, y));
    panel.style.left = x + "px";
    panel.style.top = y + "px";
    panel.style.right = "auto";
    panel.style.bottom = "auto";
  });
  head.addEventListener("pointerup", () => { drag = null; clampCalc(); });
}
function runSpec() {
  const fails = [];
  const t = (name, cond) => { if (!cond) fails.push(name); };
  const w1 = [
    { expr: "16x^2+9y^2", msg: "漏了中間項" },
    { expr: "16x^2+12xy+9y^2", msg: "中間項要乘 2" },
  ];
  const A = "16x^2+24xy+9y^2";
  let r = checkExpr("16x^2+24xy+9y^2", A, "expand", w1, ["x", "y"]);
  t("1a ok", r.ok);
  r = checkExpr("9y^2+24xy+16x^2", A, "expand", w1, ["x", "y"]);
  t("1a order", r.ok);
  r = checkExpr("(4x+3y)^2", A, "expand", w1, ["x", "y"]);
  t("1a paren", !r.ok && r.msg.includes("仍未展開"));
  r = checkExpr("16x^2+12xy+12xy+9y^2", A, "expand", w1, ["x", "y"]);
  t("1a combine", !r.ok && r.msg.includes("合併同類項"));
  r = checkExpr("16x^2+9y^2", A, "expand", w1, ["x", "y"]);
  t("1a mid", !r.ok && r.msg.includes("漏了中間項"));
  const B = "x^2/4-4x+16";
  const w2 = [{ expr: "x^2/2-4x+16", msg: "分母也要平方" }];
  t("2b a", checkExpr("x^2/4-4x+16", B, "expand", w2, ["x"]).ok);
  t("2b b", checkExpr("1/4x^2-4x+16", B, "expand", w2, ["x"]).ok);
  r = checkExpr("x^2/2-4x+16", B, "expand", w2, ["x"]);
  t("2b c", !r.ok && r.msg.includes("分母"));
  t("9 a", checkExpr("B-6A", "-6A+B", "equiv", [], ["A", "B", "C"]).ok);
  t("9 b", checkExpr("-6A+B", "-6A+B", "equiv", [], ["A", "B", "C"]).ok);
  r = checkExpr("12-a", "12-A", "equiv", [], ["A"]);
  t("5 case", !r.ok && r.kind === "case");
  t("calc a", formatSig(calcEval("3.02^(2)")) === "9.1204");
  t("calc b", formatSig(calcEval("0.1+0.2")) === "0.3");
  t("inputs", document.querySelectorAll("input, textarea").length === 0);
  return fails;
}
function boot() {
  const loaded = loadState();
  if (loaded) state = loaded;
  indexQuestions();
  wire();
  render();
  drawCalc();
  window.HK = { checkExpr, calcEval, formatSig, parsePoly, linearToLatex, QUESTIONS, runSpec, polyEq, polyVars };
}
boot();

</script>
