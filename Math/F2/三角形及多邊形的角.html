<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第2章 與三角形及多邊形相關的角｜中二數學互動課件</title>
<meta name="description" content="中二數學第 2 章互動課件：相交線、平行線、三角形內角和與外角、等腰及等邊三角形、多邊形內角和與外角和。配合課堂工作紙 2.0 至 2.3B。">
<style>
/* ===== 顏色及基本設定 ===== */
:root{
  color-scheme: light;
  --bg:#FFF7EA; --bg2:#FFEFD6; --card:#FFFFFF; --ink:#2B2D42; --muted:#6B6F80; --line:#EADFCB;
  --pri:#FF7F50; --pri-soft:#FFE3D6; --teal:#2BA89A; --teal-soft:#D8F3EF; --sun:#FFC93C; --sun-soft:#FFF3C4;
  --sky:#4D96E0; --sky-soft:#DDEBFA; --ok:#23895B; --ok-soft:#DDF5E8; --bad:#C8384F; --bad-soft:#FBE1E5;
  --radius:18px; --fs:18px;
  --math:"Times New Roman","Times","Noto Serif",serif;
  --ui:"Noto Sans TC","Noto Sans HK","PingFang TC","PingFang HK","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.6;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
i.v,.v{font-family:var(--math);font-style:italic;font-size:1.08em;letter-spacing:.01em}
.up{font-family:var(--math);font-style:normal}
.hidden{display:none!important}

/* ===== 頁首 ===== */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#FFB38A 0%,#FFD36E 55%,#9EE0D5 100%);
  box-shadow:0 3px 0 rgba(43,45,66,.08);padding:.45rem .8rem .5rem}
.top-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:.55rem;min-width:0;flex:1 1 280px}
.brand-badge{flex:none;width:2.4rem;height:2.4rem;border-radius:14px;background:#fff;display:grid;place-items:center;
  box-shadow:0 2px 0 rgba(43,45,66,.12)}
.brand h1{margin:0;font-size:1.05rem;line-height:1.25;font-weight:800}
.brand small{display:block;font-weight:600;font-size:.72rem;color:#5b4a3a}
.tools{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.chip{border:none;background:rgba(255,255,255,.88);border-radius:999px;padding:.28rem .7rem;font-size:.78rem;font-weight:700;
  box-shadow:0 2px 0 rgba(43,45,66,.12);display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap}
.chip:hover{background:#fff}
.chip.on{background:var(--ink);color:#fff}
.prog{display:flex;align-items:center;gap:.45rem;font-size:.75rem;font-weight:700;background:rgba(255,255,255,.7);
  border-radius:999px;padding:.2rem .7rem}
.prog-bar{width:90px;height:9px;border-radius:9px;background:#fff;overflow:hidden;border:1.5px solid var(--ink)}
.prog-bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--teal) 0 5px,#56c4b6 5px 10px);width:0}

/* ===== 分頁 ===== */
.tabs{max-width:1180px;margin:.7rem auto 0;padding:0 .8rem;display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;border:2.5px solid var(--ink);background:#fff;border-radius:14px 14px 14px 14px;padding:.35rem .8rem;
  font-weight:800;font-size:.86rem;line-height:1.2;text-align:left}
.tab small{display:block;font-weight:600;font-size:.68rem;color:var(--muted)}
.tab.on{background:var(--ink);color:#fff}
.tab.on small{color:#e6e6ee}
.tab .dot{display:inline-block;min-width:1.4em;font-size:.68rem;padding:0 .3em;border-radius:9px;background:var(--sun);color:var(--ink);margin-left:.3em;text-align:center}
.tab.teacher-only{border-style:dashed}
.subtabs{max-width:1180px;margin:.55rem auto 0;padding:0 .8rem;display:flex;gap:.35rem;overflow-x:auto;scrollbar-width:thin}
.stab{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.25rem .8rem;font-weight:700;font-size:.8rem}
.stab.on{border-color:var(--pri);background:var(--pri-soft)}
.stab .ok{color:var(--ok);font-weight:900}
main{max-width:1180px;margin:0 auto;padding:.8rem .8rem 4rem}

/* ===== 知識框（仿工作紙灰框） ===== */
.sec-title{display:flex;align-items:center;gap:.6rem;margin:.4rem 0 .7rem}
.sec-num{flex:none;width:2.2rem;height:2.2rem;border:2.5px solid var(--ink);border-radius:12px;display:grid;place-items:center;
  font-weight:900;background:#fff;box-shadow:3px 3px 0 var(--ink)}
.sec-title h2{margin:0;font-size:1.12rem}
.goal{font-size:.82rem;color:var(--muted);margin:-.3rem 0 .8rem}
.notes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;background:#F3F1EC;border:2.5px solid var(--ink);
  border-radius:var(--radius);padding:1rem 1.1rem;margin-bottom:1rem;position:relative}
.notes.single{grid-template-columns:1fr}
.notes::before{content:"重點";position:absolute;top:-.75rem;left:1rem;background:var(--sun);border:2px solid var(--ink);
  border-radius:9px;font-size:.72rem;font-weight:800;padding:0 .5rem}
.note-item{margin-bottom:.7rem}
.note-item:last-child{margin-bottom:0}
.note-item h3{margin:0 0 .15rem;font-size:.95rem}
.note-item p{margin:.1rem 0}
.memo{display:inline-block;margin-top:.2rem;background:#fff;border:1.5px dashed var(--ink);border-radius:8px;padding:0 .45rem;font-size:.85rem}
.memo b{font-weight:800}

/* ===== 探索區 ===== */
.explore{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:.7rem .8rem}
.explore h4{margin:0 0 .3rem;font-size:.86rem;display:flex;align-items:center;gap:.35rem}
.explore h4::before{content:"";width:.8rem;height:.8rem;border-radius:4px;background:var(--teal);display:inline-block}
.explore .hint-s{font-size:.75rem;color:var(--muted);margin:.1rem 0 .3rem}
.ex-ctrl{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin:.3rem 0;font-size:.82rem}
.ex-ctrl label{display:inline-flex;align-items:center;gap:.3rem}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:none;background:#fff;padding:.18rem .6rem;font-size:.78rem;font-weight:700}
.seg button.on{background:var(--ink);color:#fff}
.readout{font-family:var(--math);font-size:1.05rem;background:var(--sun-soft);border-radius:10px;padding:.25rem .55rem;margin-top:.3rem}
.readout .ui{font-family:var(--ui);font-size:.8rem}
svg.fig{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
input[type=range]{accent-color:var(--pri);width:9rem}

/* ===== 題目卡 ===== */
.group{margin:1.4rem 0 .4rem}
.group-head{display:flex;gap:.5rem;align-items:baseline;margin-bottom:.5rem}
.qno{flex:none;font-weight:900;font-size:1.05rem;background:var(--ink);color:#fff;border-radius:10px;padding:0 .5rem}
.stem{font-weight:600}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--radius);padding:.8rem .9rem;margin:.6rem 0 1rem;
  box-shadow:4px 4px 0 rgba(43,45,66,.12)}
.card.done{border-color:var(--ok);box-shadow:4px 4px 0 rgba(35,137,91,.25)}
.card-head{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem}
.card-tag{font-weight:800;font-size:.8rem;background:var(--sky-soft);border:1.5px solid var(--sky);border-radius:8px;padding:0 .45rem}
.card-tag.extra{background:var(--sun-soft);border-color:#d19b00}
.status{margin-left:auto;font-size:.78rem;font-weight:800;border-radius:999px;padding:.05rem .6rem;border:2px solid var(--line);color:var(--muted)}
.status.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.card-sub{font-weight:600;margin:.1rem 0 .4rem}
.qgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:1rem;align-items:start}
.qgrid.nofig{grid-template-columns:1fr}
.figbox{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.3rem;position:relative}
.figbox .fig{max-height:330px}
.panel{border-radius:14px;padding:.55rem .7rem;margin-bottom:.6rem}
.panel h5{margin:0 0 .3rem;font-size:.82rem;display:flex;align-items:center;gap:.4rem}
.panel h5 .n{display:inline-grid;place-items:center;width:1.3rem;height:1.3rem;border-radius:50%;background:var(--ink);color:#fff;font-size:.7rem}
.try{background:var(--teal-soft)}
.steps{background:var(--sun-soft)}
.copy{background:var(--ok-soft);border:2px dashed var(--ok)}
.varrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.35rem}
.var{display:inline-flex;align-items:center;gap:.25rem;background:#fff;border-radius:12px;padding:.15rem .35rem;border:2px solid var(--ink)}
.var{max-width:100%;flex-wrap:wrap}
.qgrid>*{min-width:0}
.explore svg.fig{max-height:320px;max-width:460px;margin:0 auto}
.var .vl{font-family:var(--math);font-style:italic;font-size:1.1rem;padding:0 .2rem;white-space:nowrap}
.var input{width:4.2rem;border:none;border-bottom:2px solid var(--ink);text-align:center;font-family:var(--math);font-size:1.1rem;background:transparent;padding:0}
.var button{border:none;background:var(--bg2);border-radius:8px;padding:0 .35rem;font-weight:800;font-size:.8rem;min-width:1.9rem;line-height:1.6}
.var button:active{transform:translateY(1px)}
.var .u{font-family:var(--math)}
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.45rem}
.board{background:#fff;border-radius:12px;border:2px solid #b9e6df;padding:.3rem .4rem}
.board.fit{border-color:var(--ok)}
.board .bt{font-size:.74rem;font-weight:700;color:var(--muted);margin-bottom:.1rem}
.board .bm{font-size:.8rem;font-weight:800;margin-top:.1rem}
.board .bm.ok{color:var(--ok)} .board .bm.bad{color:var(--bad)}
.board svg{display:block;width:100%;height:auto;max-height:190px}
.found{font-weight:800;color:var(--ok);font-size:.85rem;margin-top:.3rem}

/* 步驟 */
.sl{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);column-gap:.7rem;align-items:center;margin:.15rem 0;font-size:1.02rem}
.sl.full{grid-template-columns:1fr}
.sl .eq{font-family:var(--math);white-space:normal}
.sl .eq .zh,.sl .rs .zh{font-family:var(--ui);font-size:.95rem}
.sl .rs{font-size:.92rem;color:#3a3c55}
.ind1{padding-left:1.6em}.ind2{padding-left:3.2em}.ind3{padding-left:4.8em}
.blank{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .1rem}
.blank input{width:4.3em;border:none;border-bottom:2.5px solid var(--ink);background:#fff;border-radius:6px 6px 0 0;text-align:center;
  font-family:var(--math);font-size:1.02rem;padding:.05rem .1rem}
.blank input.txt{width:3.6em;font-style:italic}
.blank select{border:2px solid var(--ink);border-radius:8px;background:#fff;font-size:.86rem;padding:.05rem .2rem;max-width:12.5em}
.blank .mk:empty{width:.15em}
.blank .mk{display:inline-block;width:1.1em;text-align:center;font-weight:900;font-family:var(--ui);font-size:.9rem}
.blank.ok input,.blank.ok select{background:var(--ok-soft);border-color:var(--ok)}
.blank.ok .mk{color:var(--ok)}
.blank.bad input,.blank.bad select{background:var(--bad-soft);border-color:var(--bad);border-bottom-style:dashed}
.blank.bad .mk{color:var(--bad)}
.blank.fin input{border-bottom:5px double var(--ink)}
.chs{display:inline-flex;gap:.25rem}
.chs button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:0 .55rem;font-size:.85rem;font-family:var(--ui)}
.chs button.on{background:var(--ink);color:#fff}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15rem}
.frac>span{padding:0 .2rem}
.frac>span:first-child{border-bottom:2px solid var(--ink)}
.btnrow{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.btn{border:2.5px solid var(--ink);background:#fff;border-radius:12px;padding:.25rem .8rem;font-weight:800;font-size:.85rem;
  box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--pri);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.ghost{box-shadow:none;border-width:2px}
.btn[disabled]{opacity:.45;cursor:default}
.msg{font-size:.85rem;font-weight:700;margin-top:.35rem}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.hintbox{margin-top:.45rem;background:#fff;border:2px solid var(--sun);border-radius:12px;padding:.35rem .6rem;font-size:.88rem}
.hintbox .hl-t{font-weight:800}
.hintbox div+div{margin-top:.25rem;border-top:1px dashed var(--line);padding-top:.25rem}

/* 抄寫版 */
.copy .sl{font-size:1.05rem}
.copy .fv{font-family:var(--math);padding:0 .2em;border-bottom:1.5px solid var(--ink)}
.copy .fv.fin{border-bottom:4px double var(--ink)}
.copy .rv{font-family:var(--ui)}
.copy .sl.hid{visibility:hidden}
.copy-head{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.copy-head .btn{padding:.1rem .6rem;font-size:.78rem}

/* 勾選題 */
.ticks{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.3rem 0}
.tk{display:inline-flex;align-items:center;gap:.35rem;font-size:1rem}
.tk .lb{font-family:var(--math);font-style:italic;font-size:1.15rem}
.tk .lb.zh{font-family:var(--math);font-style:normal}
.box{width:2.1rem;height:2.1rem;border:2.5px solid var(--ink);border-radius:8px;background:#fff;font-weight:900;font-size:1.1rem;display:grid;place-items:center;padding:0}
.tk.ok .box{background:var(--ok-soft);border-color:var(--ok)}
.tk.bad .box{background:var(--bad-soft);border-color:var(--bad);border-style:dashed}
.tk .mk{font-weight:900;width:1em}
.tk.ok .mk{color:var(--ok)} .tk.bad .mk{color:var(--bad)}
.list-ticks{display:flex;flex-direction:column;gap:.35rem}

/* 例題 */
.example{background:#fff;border:2.5px dashed var(--pri);border-radius:var(--radius);padding:.7rem .9rem;margin:0 0 1rem}
.example .card-tag{background:var(--pri-soft);border-color:var(--pri)}

/* 練習 */
.lock{background:#fff;border:2.5px dashed var(--line);border-radius:var(--radius);padding:1rem;text-align:center;color:var(--muted);font-weight:700}
.streak{font-weight:800;font-size:.85rem}

/* 圖形元素 */
.fig .ln{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.fig .ln.thin{stroke-width:1.3}
.fig .ln.dash{stroke-dasharray:5 4}
.fig .ln.gray{stroke:#8a8c99}
.fig .mark{stroke:var(--ink);stroke-width:1.6;fill:none}
.fig .arrowmk{fill:var(--ink);stroke:none}
.fig .arc{stroke:var(--ink);stroke-width:1.5;fill:none}
.fig .sector{fill:transparent;stroke:none}
.fig .sector.shade{fill:#c9c9c9}
.fig .lbl{font-family:var(--math);font-size:15px;fill:var(--ink)}
.fig .plbl{font-family:var(--math);font-style:italic;font-size:15.5px;fill:var(--ink)}
.fig .zh{font-family:var(--ui);font-size:12.5px;fill:var(--ink)}
.fig .hl .arc{stroke-width:3.2}
.fig .hl .sector{fill:url(#hatchHL)}
.fig .ln.hl{stroke-width:4.5}
.fig .hintonly{display:none}
.fig .hintonly.hl{display:inline}
.fig .pick{cursor:pointer}
.fig .pick .sector{fill:rgba(77,150,224,.08);stroke:var(--sky);stroke-width:1;stroke-dasharray:3 3}
.fig .pick:hover .sector{fill:rgba(77,150,224,.2)}
.fig .pick.sel .sector{fill:url(#hatchHL);stroke:var(--ink);stroke-dasharray:none;stroke-width:1.5}
.fig .vtx{cursor:pointer}
.fig .vtx circle.hit{fill:rgba(255,127,80,.0);stroke:none}
.fig .vtx circle.dotv{fill:#fff;stroke:var(--pri);stroke-width:2}
.fig .meas .arc{stroke:var(--pri);stroke-width:2.4}
.fig .meas text{fill:#b3431d;font-weight:700}
.fig .drag{cursor:grab;fill:var(--pri);stroke:#fff;stroke-width:2}
.fig .drag:active{cursor:grabbing}
.fig .dim{stroke:var(--ink);stroke-width:1.2;fill:none}

/* 教師模式標記 */
body.teacher .t-show{display:revert}
.t-show{display:none}
.tbadge{background:var(--ink);color:#fff;border-radius:8px;font-size:.7rem;padding:0 .4rem;font-weight:800}

/* 彈出視窗 */
.modal{position:fixed;inset:0;background:rgba(43,45,66,.45);display:grid;place-items:center;z-index:99;padding:1rem}
.modal-box{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:1rem 1.2rem;width:min(360px,100%);box-shadow:6px 6px 0 var(--ink)}
.modal-box h3{margin:0 0 .4rem}
.modal-box input{width:100%;font-size:1.3rem;text-align:center;letter-spacing:.3em;border:2.5px solid var(--ink);border-radius:12px;padding:.3rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:.4rem 1rem;
  font-weight:700;z-index:98;font-size:.9rem;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:opacity .3s}

/* 小彩紙 */
.pop{position:absolute;pointer-events:none;font-weight:900;font-size:1.3rem;animation:pop 1s ease-out forwards}
@keyframes pop{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-50px) scale(1.3)}}

/* ===== 響應式 ===== */
@media (max-width:820px){
  .top{position:static}
  .notes{grid-template-columns:1fr}
  .qgrid{grid-template-columns:1fr}
  .figbox .fig{max-height:260px}
  .brand h1{font-size:.95rem}
}
@media (max-width:480px){
  html{font-size:calc(var(--fs) - 2px)}
  main{padding:.6rem .55rem 3rem}
  .card{padding:.65rem .6rem}
  .sl{grid-template-columns:1fr;row-gap:0}
  .sl .rs{padding-left:1.6em}
  .var input{width:3.4rem}
  .prog-bar{width:60px}
}

/* ===== 列印（黑白） ===== */
@media print{
  :root{--bg:#fff}
  body{background:#fff;font-size:12pt}
  .explore,.top,.tabs,.subtabs,.btnrow,.try,.hintbox,.explore .ex-ctrl,.toast,.status,.lock,.tools{display:none!important}
  .card,.notes,.example{box-shadow:none;border:1.5px solid #000;break-inside:avoid;background:#fff}
  .notes{background:#f2f2f2}
  .steps,.copy{background:#fff;border:1px solid #000}
  .blank input,.blank select{border:none;border-bottom:1px solid #000;background:#fff}
  .blank .mk{display:none}
  .fig .ln,.fig .arc,.fig .mark{stroke:#000}
  .fig .lbl,.fig .plbl,.fig .zh{fill:#000}
  .card-tag,.qno{background:#fff;color:#000;border:1px solid #000}
  a{color:#000}
}

/* ===== 看圖列式 ===== */
.see{background:#fff;border:2px solid var(--line)}
.seerow{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem;padding:.35rem 0;border-top:1px dashed var(--line)}
.seerow:first-of-type{border-top:none}
.seeeq{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem;font-size:1.08rem}
.seeeq .op{font-family:var(--math);font-size:1.15rem;padding:0 .1rem}
.seeeq .why{font-size:.85rem;color:var(--muted);margin-left:.2rem}
.kchip{display:inline-block;border:2.5px solid var(--ink);border-radius:10px;padding:.02rem .5rem;font-family:var(--math);font-weight:700;font-size:1.08rem;line-height:1.5}
.kchip.plain{background:#fff;border-style:dashed;border-color:#8a8c99;color:var(--ink);font-weight:600}
svg.seefan{max-width:210px;flex:none}
svg.seefan text{font-size:19px!important;font-weight:700}
.seetri{display:flex;align-items:center;gap:.8rem;font-size:.9rem}
@media print{.see{border:1px solid #000}}

</style>
</head>

      const fr = el('span', { class: 'frac' }, renderTpl(fm[1], mode, blanks), renderTpl(fm[2], mode, blanks));
      frag.append(fr); continue;
    }
    pc.split(/(\{\{.*?\}\})/).forEach(seg => {
      const m = /^\{\{(.*)\}\}$/.exec(seg);
      if (!m) { if (seg) frag.append(el('span', { html: fmtMath(seg) })); return; }
      const tok = parseTok(m[1]);
      if (tok.t === 'raw') { frag.append(el('span', { html: fmtMath(tok.s) })); return; }
      if (mode === 'edit') { const b = makeBlank(tok); blanks.push(b); frag.append(b.el); }
      else {
        const txt = tokText(tok);
        frag.append(el('span', { class: (tok.t === 'rsn' ? 'rv' : 'fv') + (tok.fin ? ' fin' : ''), html: tok.t === 'rsn' || tok.t === 'ch' ? esc(txt) : fmt(txt) }));
      }
    });
  }
  return frag;
}
/* 算式文字：中文字用正常字體，其餘用數學字體 */
function fmtMath(s) {
  return fmt(s).replace(/([　-鿿＀-￯]+)/g, '<span class="zh">$1</span>');
}
/* 一行步驟：字串 = 整行；陣列 = [算式, 理由] */
function stepLine(line, mode, blanks) {
  let eq = line, rs = null, ind = 0;
  if (Array.isArray(line)) [eq, rs] = line;
  const im = /^(>+)\s?/.exec(eq); if (im) { ind = im[1].length; eq = eq.slice(im[0].length); }
  const row = el('div', { class: 'sl' + (rs == null ? ' full' : '') });
  row.append(el('div', { class: 'eq' + (ind ? ' ind' + ind : '') }, renderTpl(eq, mode, blanks)));
  if (rs != null) {
    const r = el('div', { class: 'rs' });
    if (rs) { r.append('（', renderTpl(rs, mode, blanks), '）'); }
    row.append(r);
  }
  return row;
}
/* 把範本變成提示用的「等式形式」 */
function tplSkeleton(line) {
  let eq = Array.isArray(line) ? line[0] : line, rs = Array.isArray(line) ? line[1] : '';
  const rep = s => String(s || '').replace(/^>+\s?/, '').replace(/\[\[(.*?)\|\|(.*?)\]\]/g, '($1)/($2)').replace(/\{\{(.*?)\}\}/g, (m, t) => {
    const k = parseTok(t);
    if (k.t === 'rsn') return '（理由？）';
    if (k.t === 'txt' || k.t === 'par') return '＿＿';
    if (k.t === 'raw') return k.s;
    return '（ ? ）';
  });
  return rep(eq) + (rs ? '　（' + rep(rs) + '）' : '');
}

/* =========================================================
   App 狀態：進度、教師模式
   ========================================================= */
const App = {
  teacher: false,
  cards: [],          // 所有工作紙題目卡（計算完成度）
  listeners: [],
  onChange(f) { this.listeners.push(f); },
  emit() { this.listeners.forEach(f => f()); },
  isDone(id) { return !!store.get('done:' + id, false); },
  setDone(id) { store.set('done:' + id, true); this.emit(); }
};

/* ---------- 共用：提示控制 ---------- */
function hintController(q, fig, host, steps) {
  const levels = [];
  const h1 = q.h || [];
  levels.push({ t: '想一想', s: h1[0] || '圖中有甚麼已知條件？這題要用上面「重點」框內哪一個性質？' });
  levels.push({ t: '看圖', s: (h1[1] || '留意圖中加粗、加網紋的角（或線）。') , hl: q.hl || [] });
  if (q.h3 !== false && steps && steps.length) {
    const idx = q.h3 ?? steps.findIndex(l => /\{\{/.test(Array.isArray(l) ? l.join('') : l));
    const line = steps[Math.max(0, idx)];
    levels.push({ t: '列式', s: h1[2] || ('可以這樣寫：' + tplSkeleton(line)) });
  } else if (h1[2]) levels.push({ t: '再提示', s: h1[2] });
  let lv = 0;
  const box = el('div', { class: 'hintbox hidden' });
  host.append(box);
  const btn = el('button', { class: 'btn ghost', type: 'button' }, '💡 提示');
  const upd = () => { btn.textContent = lv >= levels.length ? '💡 提示（已全部顯示）' : `💡 提示 ${lv + 1}/${levels.length}`; btn.disabled = lv >= levels.length; };
  btn.addEventListener('click', () => {
    if (lv >= levels.length) return;
    const L = levels[lv++];
    box.classList.remove('hidden');
    box.append(el('div', { html: '<span class="hl-t">' + L.t + '：</span>' + fmt(L.s) }));
    if (L.hl && fig) fig.hl(L.hl, true);
    upd();
  });
  upd();
  return { btn, reset() { lv = 0; box.innerHTML = ''; box.classList.add('hidden'); if (fig) fig.clearHL(); upd(); }, used: () => lv };
}

/* ---------- 抄寫版（可逐步顯示） ---------- */
function copyPanel(q, title = '抄寫版：把步驟抄到工作紙上') {
  const p = el('div', { class: 'panel copy' });
  const lines = el('div');
  const head = el('div', { class: 'copy-head' }, el('h5', null, '✏️ ' + title));
  let rows = [];
  const render = () => {
    lines.innerHTML = ''; rows = [];
    (q.steps || []).forEach(l => { const r = stepLine(l, 'show', []); rows.push(r); lines.append(r); });
    if (q.copyText) { const r = el('div', { class: 'sl full', html: fmt(q.copyText) }); rows.push(r); lines.append(r); }
  };
  render();
  // 逐步顯示（方便老師投影時控制節奏）
  let shown = rows.length;
  const nextB = el('button', { class: 'btn ghost', type: 'button' }, '下一步 ▶');
  const allB = el('button', { class: 'btn ghost', type: 'button' }, '全部顯示');
  const resetB = el('button', { class: 'btn ghost', type: 'button' }, '逐步顯示');
  const apply = () => { rows.forEach((r, i) => r.classList.toggle('hid', i >= shown)); nextB.disabled = shown >= rows.length; };
  nextB.onclick = () => { shown++; apply(); };
  allB.onclick = () => { shown = rows.length; apply(); };
  resetB.onclick = () => { shown = 0; apply(); };
  head.append(el('span', { class: 't-show' }, resetB, ' ', nextB, ' ', allB));
  p.append(head, lines);
  p.stepper = { start() { shown = 0; apply(); }, all() { shown = rows.length; apply(); } };
  return p;
}

/* =========================================================
   題目卡：計算題（試一試 + 寫步驟 + 抄寫版）
   ========================================================= */
function cardCalc(q, ctx) {
  const card = el('div', { class: 'card', id: 'q-' + q.id });
  const status = el('span', { class: 'status' }, '未完成');
  card.append(el('div', { class: 'card-head' }, el('span', { class: 'card-tag' + (q.extra ? ' extra' : '') }, q.extra ? '補充 ' + q.no : '工作紙第 ' + q.no + ' 題'), status));
  if (q.sub) card.append(el('div', { class: 'card-sub', html: fmt(q.sub) }));
  const grid = el('div', { class: 'qgrid' + (q.fig ? '' : ' nofig') });
  let fig = null;
  if (q.fig) { fig = drawFigure(q.fig); grid.append(el('div', { class: 'figbox' }, fig)); }
  const work = el('div');
  grid.append(work); card.append(grid);

  // 1. 看圖列式：把計算用到的角塗上顏色，並寫出同色的算式
  const see = q.boards && q.boards.length ? seePanel(q, fig) : null;
  if (see) work.append(see);

  // 2. 寫出步驟
  const sp = el('div', { class: 'panel steps' }, el('h5', null, el('span', { class: 'n' }, see ? '2' : '1'), '寫出步驟（跟工作紙一樣）'));
  const blanks = [];
  (q.steps || []).forEach(l => sp.append(stepLine(l, 'edit', blanks)));
  const msg = el('div', { class: 'msg' });
  const checkB = el('button', { class: 'btn pri', type: 'button' }, '檢查答案');
  const btnrow = el('div', { class: 'btnrow' }, checkB);
  sp.append(btnrow, msg);
  work.append(sp);
  const hints = hintController(q, fig, sp, q.steps);
  btnrow.append(hints.btn);
  const copy = copyPanel(q);
  copy.classList.add('hidden');
  work.append(copy);

  let tries = 0;
  const setDone = (fromStudent) => {
    card.classList.add('done'); status.textContent = '✓ 已完成'; status.classList.add('ok');
    blanks.forEach(b => { b.fill(); b.mark(true); b.lock(true); });
    copy.classList.remove('hidden');
    checkB.disabled = true;
    if (fromStudent) { msg.className = 'msg ok'; msg.textContent = tries === 1 ? '⭐ 一次過全對！把抄寫版抄到工作紙上吧。' : '✓ 全部正確！把抄寫版抄到工作紙上吧。'; popAt(checkB, '⭐'); }
  };
  checkB.addEventListener('click', () => {
    tries++;
    let ok = true, emp = 0;
    blanks.forEach(b => { if (b.empty()) { emp++; ok = false; b.mark(null); return; } const c = b.check(); b.mark(c); if (!c) ok = false; });
    if (ok) {
      if (tries === 1) store.set('first:' + q.id, true);
      App.setDone(q.id); setDone(true);
    } else {
      const wrong = blanks.filter(b => !b.empty() && !b.check()).length;
      msg.className = 'msg bad';
      msg.textContent = (wrong ? `有 ${wrong} 格不對（打 ✗ 的格），改一改再檢查。` : '') + (emp ? ` 還有 ${emp} 格未填。` : '') + (tries >= 2 && hints.used() === 0 ? ' 需要的話可按「提示」。' : '');
    }
  });
  // 輸入後清除該格的對錯標記
  sp.addEventListener('input', e => { const b = blanks.find(b => b.el.contains(e.target)); if (b) b.mark(null); });

  const api = {
    q, el: card, ws: ctx.ws,
    teacher(on) {
      if (on) {
        blanks.forEach(b => { b.fill(); b.mark(true); });
        copy.classList.remove('hidden');
      } else if (!App.isDone(q.id)) {
        blanks.forEach(b => { b.clear(); b.mark(null); });
        copy.classList.add('hidden');
      }
    },
    audit() { return auditFigure(q); }
  };
  if (App.isDone(q.id)) setDone(false);
  return api;
}

/* =========================================================
   看圖列式：同一個角在圖中和算式中用同一種顏色
   ========================================================= */
function seePanel(q, fig) {
  const panel = el('div', { class: 'panel see' }, el('h5', null, el('span', { class: 'n' }, '1'), '看圖列式：同一種顏色＝同一個角'));
  const vars = (q.vars || []).map(v => ({ ...v, cur: v.ans }));
  const A = fig ? fig._A : [], T = fig ? fig._T : [];
  const usedA = new Set(), usedT = new Set();
  const keyCol = {};             // 同一個未知數／名稱 → 同一種顏色
  const angCol = {};             // 角的序號 → 顏色
  let next = 0;
  const newCol = () => (next++) % KCOL.length;
  const plainNum = n => String(n).replace(/\.0+$/, '');

  // 找出算式中的一項對應圖中哪一個角（或哪一條邊）
  function locate(term, unit) {
    if (!fig) return null;
    if (unit !== '°') {
      const want = term.num ? plainNum(term.v) + ' ' + unit : term.key + ' ' + unit;
      const j = T.findIndex((o, j) => !usedT.has(j) && o.t.s === want);
      if (j >= 0) { usedT.add(j); return { side: j }; }
      return null;
    }
    let i = -1;
    if (term.id) i = A.findIndex(a => a.id === term.id);
    else if (false) {}
    else if (term.num) {
      i = A.findIndex((a, i) => !usedA.has(i) && String(a.lab) === plainNum(term.v) + '°');
      if (i < 0 && term.v === 90) i = A.findIndex((a, i) => !usedA.has(i) && a.mk === 'right');
      if (i < 0) i = A.findIndex(a => String(a.lab) === plainNum(term.v) + '°');   // 已在上一條算式用過的角
    } else if (term.key) {
      const lab = (term.coef && term.coef !== 1 ? term.coef : '') + term.key;
      i = A.findIndex((a, i) => !usedA.has(i) && String(a.lab) === lab);
      if (i < 0) {
        const k = term.key.toLowerCase(), alias = (q.cmap || {})[term.key];
        i = A.findIndex(a => a.id && (a.id === alias || a.id === k || a.id === 'a' + k));
      }
    }
    if (i >= 0) { usedA.add(i); return { ang: i }; }
    return null;
  }
  // 一項 → { lab, v, col }
  function chip(raw, unit, rep) {
    const t = typeof raw === 'object' && raw.id ? { id: raw.id, lab: raw.lab, v: raw.v, key: raw.key } : parseTerm(raw, vars);
    const u = unit === '°' ? '°' : ' ' + unit;
    let lab = t.num ? plainNum(t.v) + u : (t.lab || String(raw));
    if (!t.num && unit !== '°') lab = t.lab + u;
    const where = locate(t, unit);
    let col = null;
    if (where) {
      const ck = t.key || t.id || null;
      col = ck && keyCol[ck] != null ? keyCol[ck] : (where.ang != null && angCol[where.ang] != null ? angCol[where.ang] : newCol());
      if (ck) keyCol[ck] = col;
      if (where.ang != null) { angCol[where.ang] = col; fig.colorAngle(where.ang, col); }
      if (where.side != null) fig.colorSide(where.side, col);
    } else if (t.key && keyCol[t.key] != null) col = keyCol[t.key];
    // 同一個角重複出現（例如 x + x）：沿用同一種顏色
    if (col == null && t.key && !t.num) { col = keyCol[t.key] ?? newCol(); keyCol[t.key] = col; }
    return { lab: rep ? rep + ' × ' + lab : lab, v: t.v, col };
  }
  const chipEl = c => el('span', { class: 'kchip' + (c.col != null ? ' kc k' + c.col : ' plain'), html: fmt(c.lab) });

  // 每塊驗證板 → 一條算式
  const plain = str => String(str).replace(/\{\{(.*?)\}\}/g, (m, t) => t.replace(/^[!]|^[rtp]:/, '').replace('|', ' // ')).replace(/\[\[(.*?)\|\|(.*?)\]\]/g, '$1 / $2');
  const stepTxt = (q.steps || []).filter(Array.isArray).map(([e, r]) => ({ e: plain(e), r: plain(r || '').trim() })).filter(o => o.r);
  for (const b of q.boards) {
    const row = el('div', { class: 'seerow' });
    if (b.kind === 'tri') {
      const vd = vars.find(v => v.k === b.var);
      const svg = drawTriBoard(b, vars);
      svg.style.maxWidth = '170px';
      row.append(el('div', { class: 'seetri' }, svg, el('div', { html: fmt(`${b.n} 邊形從一個頂點畫對角線，可分成 <b>${vd.ans}</b> 個三角形，<br>即內角和 = (${b.n} − 2) × 180°`) })));
      panel.append(row); continue;
    }
    const unit = b.unit ?? '°';
    const parts = b.parts.map(p => typeof p === 'object' && p.rep ? chip(p.of, unit, p.rep) : chip(p, unit));
    let rhs;
    if (b.tid) rhs = [chip({ id: b.tid, lab: b.tlab2 }, unit)];
    else if (typeof b.target === 'object' && b.target.lab) rhs = b.target.lab.split('+').map(x => chip(x.replace('°', '').trim(), unit));
    else rhs = [chip(b.target, unit)];
    // 多邊形內角和：目標寫成 (n − 2) × 180°
    if (b.tl && /內角和/.test(b.tl) && rhs.length === 1 && rhs[0].col == null) {
      const n = rhs[0].v / 180 + 2;
      if (Number.isInteger(n) && n >= 4) rhs[0].lab = `(${n} − 2) × 180°`;
    }
    const eq = el('div', { class: 'seeeq' });
    parts.forEach((c, i) => { if (i) eq.append(el('span', { class: 'op' }, '+')); eq.append(chipEl(c)); });
    eq.append(el('span', { class: 'op' }, '='));
    rhs.forEach((c, i) => { if (i) eq.append(el('span', { class: 'op' }, '+')); eq.append(chipEl(c)); });
    // 理由：在步驟中找含有這些數字的一行
    const labs = [...parts, ...rhs].map(c => c.lab.replace(/^\d+ × /, '').replace(/\s/g, ''));
    const hit = stepTxt.find(o => { const e = o.e.replace(/\s/g, ''); return labs.every(l => e.includes(l)); });
    if (hit) eq.append(el('span', { class: 'why' }, '（' + hit.r + '）'));
    row.append(eq);
    // 角的拼圖（直線 180° 或一周 360°）
    const tv = rhs.length === 1 ? rhs[0].v : NaN;
    const ps = parts.flatMap((c, i) => { const p = b.parts[i]; const n = typeof p === 'object' && p.rep ? p.rep : 1; return Array.from({ length: n }, (_, k) => ({ v: c.v / n, lab: k ? '' : c.lab.replace(/^\d+ × /, ''), col: c.col })); });
    if (unit === '°' && (tv === 180 || tv === 360) && (!b.tl || /直線|一周|180/.test(b.tl)) && ps.every(p => p.v > 0)) {
      const f = drawFan({ parts: ps.slice().reverse(), total: tv, tv, tlab: tv === 180 ? '直線' : '一周', ok: true });
      f.classList.add('seefan');
      row.append(f);
    }
    panel.append(row);
  }
  return panel;
}

/* =========================================================
   題目卡：勾選題（✓／✗、是／否、選擇相等的角）
   q.mode: 'cx'（每項填 ✓ 或 ✗）| 'yn'（是／否）| 'chk'（勾選正確項）
   ========================================================= */
function cardTick(q, ctx) {
  const card = el('div', { class: 'card', id: 'q-' + q.id });
  const status = el('span', { class: 'status' }, '未完成');
  card.append(el('div', { class: 'card-head' }, el('span', { class: 'card-tag' }, '工作紙第 ' + q.no + ' 題'), status));
  if (q.sub) card.append(el('div', { class: 'card-sub', html: fmt(q.sub) }));
  const grid = el('div', { class: 'qgrid' + (q.fig ? '' : ' nofig') });
  let fig = null;
  if (q.fig) { fig = drawFigure(q.fig); grid.append(el('div', { class: 'figbox' }, fig)); }
  const work = el('div'); grid.append(work); card.append(grid);
  const sp = el('div', { class: 'panel steps' }, el('h5', null, el('span', { class: 'n' }, '1'), q.task || '在方格內作答'));
  if (q.tip) sp.append(el('div', { class: 'hint-s', style: 'font-size:.8rem;color:var(--muted);margin-bottom:.3rem', html: fmt(q.tip) }));
  const wrap = el('div', { class: q.mode === 'chk' ? 'list-ticks' : 'ticks' });
  const items = q.items.map(it => {
    const row = el('span', { class: 'tk' });
    const mk = el('span', { class: 'mk' });
    let val = '';
    const box = el('button', { class: 'box', type: 'button', 'aria-label': it.lab }, '');
    const setV = v => { val = v; box.textContent = v; };
    box.addEventListener('click', () => {
      if (q.mode === 'cx') setV(val === '' ? '✓' : val === '✓' ? '✗' : '');
      else if (q.mode === 'chk') setV(val ? '' : '✓');
      else { items.forEach(o => o.set('')); setV('✓'); }
      row.classList.remove('ok', 'bad'); mk.textContent = '';
    });
    if (q.mode === 'cx') row.append(el('span', { class: 'lb', html: fmt(it.lab) }), box, mk);
    else row.append(box, el('span', { class: 'lb' + (/[一-鿿]/.test(it.lab) ? ' zh' : ''), html: fmt(it.lab) }), mk);
    wrap.append(row);
    const want = q.mode === 'cx' ? it.ans : (it.ans ? '✓' : '');
    return { it, row, mk, set: setV, get: () => val, want, lock(on) { box.disabled = on; } };
  });
  sp.append(wrap);
  const msg = el('div', { class: 'msg' });
  const checkB = el('button', { class: 'btn pri', type: 'button' }, '檢查答案');
  const btnrow = el('div', { class: 'btnrow' }, checkB);
  sp.append(btnrow, msg);
  work.append(sp);
  const hints = hintController(q, fig, sp, null);
  btnrow.append(hints.btn);
  const copy = el('div', { class: 'panel copy hidden' }, el('h5', null, '✏️ 抄寫版：在工作紙方格內填上'),
    el('div', { class: 'sl full', html: q.items.map(it => fmt(it.lab) + '　<b>' + (q.mode === 'cx' ? it.ans : it.ans ? '✓' : '□') + '</b>').join(q.mode === 'chk' ? '<br>' : '　　') }));
  if (q.explain) copy.append(el('div', { class: 'sl full', style: 'font-size:.9rem', html: '<b>原因：</b>' + fmt(q.explain) }));
  work.append(copy);
  let tries = 0;
  const done = (fromStudent) => {
    card.classList.add('done'); status.textContent = '✓ 已完成'; status.classList.add('ok');
    items.forEach(o => { o.set(o.want); o.row.classList.add('ok'); o.mk.textContent = '✓'; o.lock(true); });
    copy.classList.remove('hidden'); checkB.disabled = true;
    if (fromStudent) { msg.className = 'msg ok'; msg.textContent = tries === 1 ? '⭐ 一次過全對！' : '✓ 全部正確！'; popAt(checkB, '⭐'); }
  };
  checkB.addEventListener('click', () => {
    tries++;
    let ok = true, emp = 0;
    items.forEach(o => {
      o.row.classList.remove('ok', 'bad');
      if (q.mode === 'cx' && !o.get()) { emp++; ok = false; o.mk.textContent = ''; return; }
      const c = o.get() === o.want; if (!c) ok = false;
      o.row.classList.add(c ? 'ok' : 'bad'); o.mk.textContent = c ? '✓' : '✗';
    });
    if (q.mode === 'yn' && items.every(o => !o.get())) { emp = 1; ok = false; items.forEach(o => { o.row.classList.remove('bad'); o.mk.textContent = ''; }); }
    if (ok) { if (tries === 1) store.set('first:' + q.id, true); App.setDone(q.id); done(true); }
    else { msg.className = 'msg bad'; msg.textContent = emp ? '還有方格未填。' : '有些方格不對，再想一想。'; }
  });
  const api = {
    q, el: card, ws: ctx.ws,
    teacher(on) {

/* =========================================================
   題目卡：在圖中點選（標示外角）
   ========================================================= */
function cardPick(q, ctx) {
  const card = el('div', { class: 'card', id: 'q-' + q.id });
  const status = el('span', { class: 'status' }, '未完成');
  card.append(el('div', { class: 'card-head' }, el('span', { class: 'card-tag' }, '工作紙第 ' + q.no + ' 題'), status));
  if (q.sub) card.append(el('div', { class: 'card-sub', html: fmt(q.sub) }));
  const grid = el('div', { class: 'qgrid' });
  const fig = drawFigure(q.fig);
  grid.append(el('div', { class: 'figbox' }, fig));
  const work = el('div'); grid.append(work); card.append(grid);
  const sp = el('div', { class: 'panel steps' }, el('h5', null, el('span', { class: 'n' }, '1'), q.task || '在圖中點選'));
  const msg = el('div', { class: 'msg' });
  const checkB = el('button', { class: 'btn pri', type: 'button' }, '檢查答案');
  const btnrow = el('div', { class: 'btnrow' }, checkB);
  sp.append(el('div', { style: 'font-size:.85rem', html: fmt(q.tip || '點選圖中的角，被選中的角會加上網紋。再按一下可取消。') }), btnrow, msg);
  work.append(sp);
  const hints = hintController(q, fig, sp, null);
  btnrow.append(hints.btn);
  const copy = el('div', { class: 'panel copy hidden' }, el('h5', null, '✏️ 抄寫版'), el('div', { class: 'sl full', html: fmt(q.copyText || '在工作紙的圖中，用弧線標示網紋所示的角。') }));
  work.append(copy);
  fig.addEventListener('pick', e => {
    const o = e.detail;
    msg.className = 'msg'; msg.innerHTML = o.sel && o.spec.msg ? fmt(o.spec.msg) : '';
  });
  let tries = 0;
  const done = (fromStudent) => {
    card.classList.add('done'); status.textContent = '✓ 已完成'; status.classList.add('ok');
    fig._picks.forEach(p => { p.sel = !!p.spec.ok; p.g.classList.toggle('sel', p.sel); p.g.style.pointerEvents = 'none'; });
    copy.classList.remove('hidden'); checkB.disabled = true;
    if (fromStudent) { msg.className = 'msg ok'; msg.textContent = '✓ 正確！'; popAt(checkB, '⭐'); }
  };
  checkB.addEventListener('click', () => {
    tries++;
    const sel = fig._picks.filter(p => p.sel);
    const good = fig._picks.filter(p => p.spec.ok);
    const ok = sel.length > 0 && sel.every(p => p.spec.ok) && (q.all ? sel.length === good.length : true);
    if (ok) { if (tries === 1) store.set('first:' + q.id, true); App.setDone(q.id); done(true); }
    else { msg.className = 'msg bad'; msg.innerHTML = sel.length ? fmt((sel.find(p => !p.spec.ok) || {}).spec?.msg || '還未對，再想一想。') : '請先在圖中點選一個角。'; }
  });
  const api = {
    q, el: card, ws: ctx.ws,
    teacher(on) {
      if (on) { fig._picks.forEach(p => { p.sel = !!p.spec.ok; p.g.classList.toggle('sel', p.sel); }); copy.classList.remove('hidden'); }
      else if (!App.isDone(q.id)) { fig._picks.forEach(p => { p.sel = false; p.g.classList.remove('sel'); }); copy.classList.add('hidden'); }
    },
    audit() { return auditFigure(q); }
  };
  if (App.isDone(q.id)) done(false);
  return api;
}

/* =========================================================
   例題卡／功課答案卡：按「下一步」逐步顯示
   ========================================================= */
function cardExample(q, ctx, kind = '例題') {
  const card = el('div', { class: kind === '例題' ? 'example' : 'card', id: 'q-' + q.id });
  card.append(el('div', { class: 'card-head' }, el('span', { class: 'card-tag' }, kind === '例題' ? '例題' : '第 ' + q.no + ' 題'), q.warn ? el('span', { class: 'tbadge' }, '⚠ 注意') : null));
  if (q.sub) card.append(el('div', { class: 'card-sub', html: fmt(q.sub) }));
  if (q.warn) card.append(el('div', { class: 'hintbox', html: fmt(q.warn) }));
  const grid = el('div', { class: 'qgrid' + (q.fig ? '' : ' nofig') });
  let fig = null;
  if (q.fig) { fig = drawFigure(q.fig); grid.append(el('div', { class: 'figbox' }, fig)); }
  const work = el('div');
  const lines = el('div', { class: 'panel copy', style: 'border-style:solid' });
  const rows = (q.steps || []).map(l => { const r = stepLine(l, 'show', []); lines.append(r); return r; });
  let shown = kind === '例題' ? 0 : 0;
  const nextB = el('button', { class: 'btn teal', type: 'button' }, '下一步 ▶');
  const allB = el('button', { class: 'btn ghost', type: 'button' }, '全部顯示');
  const resetB = el('button', { class: 'btn ghost', type: 'button' }, '重新開始');
  const apply = () => { rows.forEach((r, i) => r.classList.toggle('hid', i >= shown)); nextB.disabled = shown >= rows.length; };
  nextB.onclick = () => { shown++; apply(); };
  allB.onclick = () => { shown = rows.length; apply(); };
  resetB.onclick = () => { shown = 0; apply(); };
  apply();
  work.append(lines, el('div', { class: 'btnrow' }, nextB, allB, resetB));
  grid.append(work); card.append(grid);
  return { q, el: card, ws: ctx.ws, teacher() { }, audit() { return auditFigure(q); } };
}

/* =========================================================
   圖形核對（開發用）：量度圖中每個角，與標示的數值比較
   ========================================================= */
function evalLab(lab, q) {
  const s = String(lab).replace('°', '').trim();
  if (/^\d+(\.\d+)?$/.test(s)) return +s;
  const m = /^(\d*)([a-z])$/.exec(s);
  if (m && q.vars) { const v = q.vars.find(v => v.k === m[2]); if (v) return (m[1] ? +m[1] : 1) * v.ans; }
  if (m && q.ansMap && q.ansMap[m[2]] != null) return (m[1] ? +m[1] : 1) * q.ansMap[m[2]];
  return null;
}
function auditFigure(q) {
  const out = [];
  if (!q.fig) return out;
  for (const a of q.fig.A || []) {
    const want = a.mk === 'right' ? 90 : a.chk ?? evalLab(a.lab, q);
    if (want == null) continue;
    const { d } = angleSpan(q.fig.P, a);
    const got = Math.abs(d);
    if (Math.abs(got - want) > 0.6) out.push(`${q.id}: ∠(${a.a}${a.v}${a.b}) 標示 ${a.lab ?? '直角'}=${want}，實際 ${got.toFixed(1)}`);
  }
  return out;
}

const { pol, inter, tri, ext, lerp } = G;

/* 小工具：多邊形 */
function polyP(names, pts, P = {}) { names.forEach((n, i) => { P[n] = pts[i]; }); return P; }
function polyL(names) { return names.map((n, i) => [n, names[(i + 1) % names.length]]); }
/* 內角（逆時針次序的多邊形） */
function inAng(names, i, lab, extra = {}) {
  const n = names.length;
  return { v: names[i], a: names[(i + 1) % n], b: names[(i - 1 + n) % n], lab, ...extra };
}
/* 在頂點 v 加外角：延長 prev→v，外角在延長線與 v→next 之間 */
function exAng(P, L, prev, v, next, lab, extra = {}, len = 42) {
  const e = v + '_x';
  P[e] = ext(P[prev], P[v], len);
  L.push([v, e]);
  return { v, a: e, b: next, lab, ...extra };
}
/* 正多邊形 */
function regPts(n, R = 80, rot = 90) { const a = []; for (let i = 0; i < n; i++) a.push(pol([0, 0], R, rot + 180 / n - 180 + i * 360 / n)); return a; }

'use strict';

/* 通用：可拖動圖。makeSpec(state) 回傳圖形設定；move(state, 拖動點id, 座標) 更新狀態 */
function dragFig(state, makeSpec, move, after) {
  const wrap = el('div', { style: 'touch-action:none' });
  let drag = null;
  const render = () => {
    const svg = drawFigure(makeSpec(state));
    wrap.innerHTML = ''; wrap.append(svg);
    if (after) after(state);
  };
  wrap.addEventListener('pointerdown', e => {
    const h = e.target && e.target.dataset && e.target.dataset.h;
    if (!h) return;
    drag = h; wrap.setPointerCapture(e.pointerId); e.preventDefault();
  });
  wrap.addEventListener('pointermove', e => {
    if (!drag) return;
    const svg = wrap.querySelector('svg');
    const m = svg.getScreenCTM(); if (!m) return;
    const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
    move(state, drag, [pt.x, -pt.y]);
    render();
  });
  const stop = () => { drag = null; };
  wrap.addEventListener('pointerup', stop); wrap.addEventListener('pointercancel', stop);
  render();
  wrap.render = render;
  return wrap;
}

/* 多邊形各內角（按方向） */
function polyAngles(pts) {
  let area = 0; pts.forEach((p, i) => { const q = pts[(i + 1) % pts.length]; area += p[0] * q[1] - q[0] * p[1]; });
  const ccw = area > 0, n = pts.length;
  return pts.map((p, i) => {
    const nx = pts[(i + (ccw ? 1 : n - 1)) % n], pv = pts[(i + (ccw ? n - 1 : 1)) % n];
    return norm360(G.dir(p, pv) - G.dir(p, nx));
  });
}
/* 把數值四捨五入，但保持總和 */
function roundKeepSum(vals, sum) {
  const r = vals.map(Math.round); const diff = sum - r.reduce((a, b) => a + b, 0);
  if (diff) { let k = 0; vals.forEach((v, i) => { if (Math.abs(v - Math.round(v)) > Math.abs(vals[k] - Math.round(vals[k]))) k = i; }); r[k] += diff; }
  return r;
}
function randConvex(n, R = 80) {
  let angs;
  do {
    angs = []; for (let i = 0; i < n; i++) angs.push(Math.random() * 360);
    angs.sort((a, b) => a - b);
  } while (angs.some((a, i) => norm360(angs[(i + 1) % n] - a) < 360 / n * 0.45));
  return angs.map(a => pol([0, 0], R * (0.88 + Math.random() * 0.12), a));
}

          { v: 'O', a: 'D', b: 'A', lab: 'c', r: 26, fill: 'pt1' }, { v: 'O', a: 'B', b: 'C', lab: 'd', r: 26, fill: 'pt1' }],

    const move = (s, h, p) => {

  /* ---------- 2.0 ②：平行線與截線 ---------- */
  parallel() {
    const st = { th: 62, tilt: 0, mode: 'corr' };
    const out = el('div', { class: 'readout' });
    const spec = s => {
      const I1 = [0, 40], I0 = [0, -40];
      const I2 = inter(I1, s.th, I0, s.tilt);
      const P = { A: [-125, 40], B: [125, 40], C: pol(I0, 125, s.tilt + 180), D: pol(I0, 125, s.tilt), m: I1, n: I2, u: pol(I1, 48, s.th), w: pol(I2, 48, s.th + 180) };
      const par = s.tilt === 0 ? 1 : 0;
      const A = s.mode === 'corr' ? [{ v: 'm', a: 'B', b: 'u', lab: 'a' }, { v: 'n', a: 'D', b: 'm', lab: 'b' }]

      if (s.mode === 'coint') out.innerHTML = fmt(`a = ${va}°，b = ${vb}°，a + b = <b>${va + vb}°</b>` + (par ? '　（AB // CD）' : '　（AB 和 CD 不平行！）') + `<br><span class="ui">同旁內角形成${shape}形狀</span>`);
      else out.innerHTML = fmt(`a = ${va}°，b = ${vb}°` + (par ? '　<b>a = b</b>（AB // CD）' : '　a ≠ b（AB 和 CD 不平行！）') + `<br><span class="ui">${s.mode === 'corr' ? '同位角' : '內錯角'}形成${shape}形狀</span>`);
      return { vb: [-148, -110, 296, 212], P, hide: ['m', 'n'],

    const move = (s, h, p) => { const t = G.dir([0, 40], p); s.th = Math.min(140, Math.max(40, t < -90 ? 140 : t < 0 ? 40 : t)); };
    const fig = dragFig(st, spec, move);

    const ctl = el('div', { class: 'ex-ctrl' }, segCtl([['corr', '同位角'], ['alt', '內錯角'], ['coint', '同旁內角']], 'corr', k => { st.mode = k; fig.render(); }));
    const ctl2 = el('div', { class: 'ex-ctrl' }, el('label', null, '把 CD 轉斜一點：', tilt));
    return exploreBox('動手探索', '拖動橙色點轉動截線。再試試把 CD 轉斜，看看角還相等嗎？', ctl, fig, ctl2, out);

  /* ---------- 2.0 ③：三角形內角和（撕角拼直線） ---------- */

  /* ---------- 2.1：三角形的外角 ---------- */
  triExt(kind) {

      return { vb: [-122, -122, 284, 158], P, L: ['BD', 'AB', 'AC'],

    return exploreBox('動手探索', kind === 'concept' ? '外角：三角形的一條邊與相鄰邊的延長線所成的角。拖動頂點 A 看看。' : '拖動頂點 A：外角 d 和 a + b 是否永遠相等？這就是「旗」形狀。', dragFig(st, spec, move), out);

  /* ---------- 2.2A ①：等腰 △ 底角 ---------- */
  isosceles() {

  /* ---------- 2.3A ①：拖動頂點（凸、凹、正多邊形） ---------- */
  polyDrag() {
    const init = () => regPts(5, 78, 90);
    const st = { p: init() };
    const out = el('div', { class: 'readout' });
    const names = ['A', 'B', 'C', 'D', 'E'];
    const spec = s => {
      const ang = polyAngles(s.p);
      const P = polyP(names, s.p);
      const big = ang.map((a, i) => [a, names[i]]).filter(([a]) => a > 180.5);
      const sides = s.p.map((p, i) => G.dist(p, s.p[(i + 1) % 5]));
      const reg = Math.max(...sides) - Math.min(...sides) < 2 && Math.max(...ang) - Math.min(...ang) < 1.5;
      out.innerHTML = big.length ? fmt(`<b>凹多邊形</b>：∠${big[0][1]} = ${R0(big[0][0])}°，大於 180°`) : fmt('<b>凸多邊形</b>：所有內角都小於 180°' + (reg ? '<br>而且所有邊相等、所有角相等 → <b>正五邊形</b>' : ''));
      let area = 0; s.p.forEach((p, i) => { const q = s.p[(i + 1) % 5]; area += p[0] * q[1] - q[0] * p[1]; });
      const A = names.map((n, i) => area > 0 ? { ...inAng(names, i, R0(ang[i]) + '°'), big: ang[i] > 180, r: 15, fill: ang[i] > 180.5 ? 'pOver' : null } : { v: n, a: names[(i + 4) % 5], b: names[(i + 1) % 5], big: ang[i] > 180, lab: R0(ang[i]) + '°', r: 15, fill: ang[i] > 180.5 ? 'pOver' : null });
      return { vb: [-125, -110, 250, 215], P, L: polyL(names), A, hide: names, handles: names.map((n, i) => ({ id: String(i), at: s.p[i] })) };
    };
    const move = (s, h, p) => { s.p[+h] = [Math.max(-110, Math.min(110, p[0])), Math.max(-95, Math.min(95, p[1]))]; };
    const fig = dragFig(st, spec, move);
    const reset = el('button', { class: 'btn ghost', type: 'button', onclick: () => { st.p = init(); fig.render(); } }, '變回正五邊形');
    return exploreBox('動手探索', '把一個頂點拖向裏面，看看甚麼時候變成凹多邊形。', fig, out, el('div', { class: 'btnrow' }, reset));
  },

  /* ---------- 2.3A ②③：多邊形分成三角形 ---------- */
  polyInt(reg) {
    const st = { n: reg ? 6 : 7, irr: false, pts: null };
    const out = el('div', { class: 'readout' });
    const box = el('div');
    const render = () => {
      const n = st.n;
      if (!st.pts || st.pts.length !== n) st.pts = st.irr ? randConvex(n) : regPts(n, 82, 90);
      const svg = sv('svg', { class: 'fig', viewBox: '-100 -98 200 196' });
      const p = st.pts;
      for (let k = 1; k <= n - 2; k++) {
        sv('path', { d: `M${p[0][0]},${-p[0][1]} L${p[k][0]},${-p[k][1]} L${p[k + 1][0]},${-p[k + 1][1]} Z`, fill: `url(#${PAT[(k - 1) % PAT.length]})`, stroke: '#2B2D42', 'stroke-width': 1 }, svg);
        const c = [(p[0][0] + p[k][0] + p[k + 1][0]) / 3, (p[0][1] + p[k][1] + p[k + 1][1]) / 3];
        const t = svText(svg, c[0], -c[1], String(k), 'lbl'); t.setAttribute('font-weight', 700); t.setAttribute('paint-order', 'stroke'); t.setAttribute('stroke', '#fff'); t.setAttribute('stroke-width', 3);
      }
      sv('polygon', { points: p.map(q => q[0] + ',' + (-q[1])).join(' '), fill: 'none', stroke: '#2B2D42', 'stroke-width': 2.4 }, svg);
      sv('circle', { cx: p[0][0], cy: -p[0][1], r: 4, fill: '#FF7F50' }, svg);
      box.innerHTML = ''; box.append(svg);
      const S = (n - 2) * 180;
      let t = `${n} 邊形：從一個頂點可分成 <b>${n - 2}</b> 個三角形<br>內角和 = (${n} − 2) × 180° = <b>${S}°</b>`;
      if (reg && !st.irr) t += `<br>每個內角 = ${S}° ÷ ${n} = <b>${Number.isInteger(S / n) ? S / n : (S / n).toFixed(1)}°</b>`;
      out.innerHTML = fmt(t);
    };
    const nIn = el('input', { type: 'range', min: 3, max: 12, value: st.n, oninput: e => { st.n = +e.target.value; st.pts = null; lab.textContent = st.n; render(); } });
    const lab = el('b', null, String(st.n));
    const irr = el('input', { type: 'checkbox', onchange: e => { st.irr = e.target.checked; st.pts = null; render(); } });
    const again = el('button', { class: 'btn ghost', type: 'button', onclick: () => { st.pts = null; render(); } }, '換一個形狀');
    render();
    return exploreBox('動手探索', reg ? '正 n 邊形的 n 個內角都相等，所以每個內角 = 內角和 ÷ n。' : '改變邊數 n：從一個頂點（●）畫對角線，可以分成幾個三角形？',
      el('div', { class: 'ex-ctrl' }, el('label', null, '邊數 n = ', lab, nIn)), el('div', { class: 'ex-ctrl' }, el('label', null, irr, reg ? '不規則（非正多邊形）' : '不規則多邊形'), again), box, out);
  },

  /* ---------- 2.3B：外角拼成一周 ---------- */
  polyExt(reg) {
    const st = { n: reg ? 6 : 5, irr: !reg, pts: null };
    const out = el('div', { class: 'readout' });
    const box = el('div', { style: 'display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:.3rem;align-items:center' });
    const render = () => {
      const n = st.n;
      if (!st.pts || st.pts.length !== n) st.pts = st.irr ? randConvex(n, 62) : regPts(n, 62, 90);
      const names = st.pts.map((_, i) => 'v' + i), P = polyP(names, st.pts), L = polyL(names);
      const ints = polyAngles(st.pts), exts = ints.map(a => 180 - a);
      const A = names.map((v, i) => ({ ...exAng(P, L, names[(i - 1 + n) % n], v, names[(i + 1) % n], '', { r: 16, fill: PAT[i % PAT.length] }, 34) }));
      const r = roundKeepSum(exts, 360);
      box.innerHTML = '';
      box.append(drawFigure({ P, L, A, hide: names, pad: 10 }),
        drawFan({ parts: r.map(v => ({ v, lab: n <= 8 ? v + '°' : '' })), total: 360, tv: 360, tlab: '一周', ok: true }));
      let t = `${n} 個外角：${r.join('° + ')}° = <b>360°</b>`;
      if (reg && !st.irr) t = `正 ${n} 邊形：每個外角 = 360° ÷ ${n} = <b>${Number.isInteger(360 / n) ? 360 / n : (360 / n).toFixed(1)}°</b>`;
      out.innerHTML = fmt(t);
    };
    const lab = el('b', null, String(st.n));
    const nIn = el('input', { type: 'range', min: 3, max: 10, value: st.n, oninput: e => { st.n = +e.target.value; st.pts = null; lab.textContent = st.n; render(); } });
    const irr = el('input', { type: 'checkbox', checked: st.irr, onchange: e => { st.irr = e.target.checked; st.pts = null; render(); } });
    const again = el('button', { class: 'btn ghost', type: 'button', onclick: () => { st.pts = null; render(); } }, '換一個形狀');
    render();
    return exploreBox('動手探索', '左邊每個外角都有自己的網紋；右邊把所有外角拼在一起。無論多少條邊、甚麼形狀，都剛好拼成一周。',
      el('div', { class: 'ex-ctrl' }, el('label', null, '邊數 n = ', lab, nIn)), el('div', { class: 'ex-ctrl' }, el('label', null, irr, '不規則多邊形'), again), box, out);
  }
};

function randExt(n, lo = 30, hi = 110) {
  for (let k = 0; k < 400; k++) {
    const w = Array.from({ length: n }, () => 0.5 + Math.random()), s = w.reduce((a, b) => a + b);
    const e = w.map(v => Math.round(v / s * 360));
    e[n - 1] = 360 - e.slice(0, -1).reduce((a, b) => a + b, 0);
    if (e.every(v => v >= lo && v <= hi)) { const pts = G.polyFit(e.map(v => 180 - v), ri(-30, 30), 100); if (pts.ok) return { e, pts }; }
  }
  return { e: Array(n).fill(360 / n), pts: regPts(n) };
}

function practicePanel(ws) {
  const box = el('div');
  const gens = GEN[ws.id] || [];
  let streak = 0, cur = null, wrong = 0;
  const card = el('div', { class: 'card' });
  const head = el('div', { class: 'card-head' }, el('span', { class: 'card-tag extra' }, '補充練習'), el('span', { class: 'streak' }));
  const body = el('div');
  card.append(head, body);
  const next = () => {
    cur = pick(gens)(); wrong = 0;
    body.innerHTML = '';
    const grid = el('div', { class: 'qgrid' + (cur.fig ? '' : ' nofig') });
    if (cur.fig) grid.append(el('div', { class: 'figbox' }, drawFigure(cur.fig)));
    const work = el('div');
    const inp = el('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off' });
    const msg = el('div', { class: 'msg' });
    const sol = el('div', { class: 'panel copy hidden' }, el('h5', null, '✏️ 解法'));
    (cur.sol || []).forEach(l => sol.append(stepLine(l, 'show', [])));
    const hintB = el('button', { class: 'btn ghost', type: 'button', onclick: () => { msg.className = 'msg'; msg.innerHTML = '💡 ' + fmt(cur.hint); } }, '💡 提示');
    const solB = el('button', { class: 'btn ghost hidden', type: 'button', onclick: () => sol.classList.remove('hidden') }, '看解法');
    const nextB = el('button', { class: 'btn teal', type: 'button', onclick: next }, '下一題 ▶');
    const check = () => {
      const v = normNum(inp.value);
      if (!Number.isFinite(v)) { msg.className = 'msg bad'; msg.textContent = '請先輸入一個數。'; return; }
      if (Math.abs(v - cur.ans) < 1e-6) {
        streak++; msg.className = 'msg ok'; msg.textContent = '✓ 答對了！';
        sol.classList.remove('hidden'); inp.disabled = true; popAt(inp, '⭐');
      } else {
        streak = 0; wrong++; msg.className = 'msg bad'; msg.textContent = '✗ 不對，再試一次。';
        if (wrong >= 2) solB.classList.remove('hidden');
      }
      head.lastChild.textContent = streak ? `連續答對 ${streak} 題 ⭐` : '';
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    const unit = cur.unit ?? '°';
    work.append(el('div', { class: 'panel steps' },
      el('div', { class: 'card-sub', html: fmt(cur.text) }),
      el('div', { class: 'varrow' }, el('span', { class: 'var' }, el('span', { class: 'vl', html: fmt(cur.lab || 'x') }), '=', inp, el('span', { class: 'u' }, unit))),
      el('div', { class: 'btnrow' }, el('button', { class: 'btn pri', type: 'button', onclick: check }, '檢查'), hintB, solB, nextB), msg), sol);
    if (App.teacher) sol.classList.remove('hidden');
    grid.append(work); body.append(grid);
  };
  next();
  box.append(el('p', { style: 'font-size:.85rem;color:var(--muted);margin:.2rem 0 .6rem' }, '這裏的題目每次都會隨機生成，可以無限練習。答錯兩次後可以看解法。'), card);
  return box;
}

  const tools = el('div', { class: 'tools' },
    el('span', { class: 'prog', title: '工作紙題目完成度' }, '進度', el('span', { class: 'prog-bar' }, progBar), progTxt),
    el('button', { class: 'chip', type: 'button', onclick: () => setFs(-1), 'aria-label': '縮小字體' }, 'A−'),
    el('button', { class: 'chip', type: 'button', onclick: () => setFs(1), 'aria-label': '放大字體' }, 'A+'),
    el('button', { class: 'chip', type: 'button', onclick: goFull }, '⛶ 全螢幕'),
    el('button', { class: 'chip', type: 'button', onclick: () => window.print() }, '🖨 列印'),
    tBtn,
    el('button', { class: 'chip t-show', type: 'button', onclick: resetProgress }, '↺ 清除進度'));
  const top = el('header', { class: 'top' }, el('div', { class: 'top-row' },
    el('div', { class: 'brand' }, el('div', { class: 'brand-badge', html: logo }), el('div', null, el('h1', null, CH2.title), el('small', null, '中二數學・互動課件　配合課堂工作紙 2.0 – 2.3B 使用'))), tools));
  const tabs = el('nav', { class: 'tabs', 'aria-label': '工作紙' });
  const subtabs = el('nav', { class: 'subtabs', 'aria-label': '小節' });
  const main = el('main');
  document.body.append(top, tabs, subtabs, main);
  App.ui = { tabs, subtabs, main, progBar, progTxt, tBtn };
  App.onChange(updateProgress);
  readHash();
  render();
  window.addEventListener('hashchange', () => { readHash(); render(); });
}
function setFs(d) {
  const fs = Math.max(14, Math.min(28, store.get('fs', 18) + d * 2));
  store.set('fs', fs);
  document.documentElement.style.setProperty('--fs', fs + 'px');
}
function goFull() {
  const d = document;
  if (d.fullscreenElement) { d.exitFullscreen && d.exitFullscreen(); return; }
  const r = d.documentElement.requestFullscreen ? d.documentElement.requestFullscreen() : null;
  if (r && r.catch) r.catch(() => window.open(location.href, '_blank'));
  else if (!r) window.open(location.href, '_blank');
}
function readHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return;
  const [w, s] = h.split('/');
  if (w === 'hw' && App.teacher) { View.ws = 'hw'; View.sec = s || CH2.hw[0].id; return; }
  const i = CH2.ws.findIndex(x => x.id === w);
  if (i >= 0) { View.ws = i; View.sec = s || 's1'; }
}
function setHash() {
  const w = View.ws === 'hw' ? 'hw' : CH2.ws[View.ws].id;
  try { history.replaceState(null, '', '#' + w + '/' + View.sec); } catch (e) { /* iframe 內可能不容許 */ }
}

/* ---------- 教師模式 ---------- */
function toggleTeacher() {
  if (App.teacher) { setTeacher(false); return; }
  const inp = el('input', { type: 'password', inputmode: 'numeric', maxlength: 8, autocomplete: 'off' });
  const msg = el('div', { class: 'msg' });
  const close = () => m.remove();
  const ok = () => { if (inp.value === TEACHER_PIN) { close(); setTeacher(true); } else { msg.className = 'msg bad'; msg.textContent = '密碼不正確。'; inp.select(); } };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') close(); });
  const m = el('div', { class: 'modal', onclick: e => { if (e.target === m) close(); } },
    el('div', { class: 'modal-box' }, el('h3', null, '🔒 教師模式'), el('p', { style: 'margin:.2rem 0 .6rem;font-size:.85rem' }, '教師模式會顯示所有答案及功課答案。請輸入密碼：'),
      inp, msg, el('div', { class: 'btnrow' }, el('button', { class: 'btn pri', type: 'button', onclick: ok }, '進入'), el('button', { class: 'btn ghost', type: 'button', onclick: close }, '取消'))));
  document.body.append(m); inp.focus();
}
function setTeacher(on) {
  App.teacher = on;
  document.body.classList.toggle('teacher', on);
  App.ui.tBtn.classList.toggle('on', on);
  App.ui.tBtn.textContent = on ? '🔓 教師模式：開' : '🔒 教師模式';
  if (!on && View.ws === 'hw') { View.ws = 0; View.sec = 's1'; }
  render();
  toast(on ? '已開啟教師模式：顯示所有答案' : '已關閉教師模式');
}
function resetProgress() {
  const close = () => m.remove();
  const m = el('div', { class: 'modal', onclick: e => { if (e.target === m) close(); } },
    el('div', { class: 'modal-box' }, el('h3', null, '清除進度？'), el('p', { style: 'font-size:.9rem' }, '會清除這部裝置上所有已完成的記錄（例如借給學生的平板）。'),
      el('div', { class: 'btnrow' }, el('button', { class: 'btn pri', type: 'button', onclick: () => {
        CH2.ws.forEach(ws => allQIds(ws).forEach(id => { store.del('done:' + id); store.del('first:' + id); }));
        close(); render(); App.emit(); toast('已清除進度');
      } }, '清除'), el('button', { class: 'btn ghost', type: 'button', onclick: close }, '取消'))));
  document.body.append(m);
}

/* ---------- 進度 ---------- */
function updateProgress() {
  let d = 0, t = 0;
  CH2.ws.forEach(ws => { const p = wsProgress(ws); d += p.done; t += p.total; });
  App.ui.progBar.style.width = (t ? d / t * 100 : 0) + '%';
  App.ui.progTxt.textContent = `${d}/${t}`;
  renderTabs();
}

/* ---------- 分頁 ---------- */
function renderTabs() {
  const { tabs, subtabs } = App.ui;
  tabs.innerHTML = '';
  CH2.ws.forEach((ws, i) => {
    const p = wsProgress(ws);
    const b = el('button', { class: 'tab' + (View.ws === i ? ' on' : ''), type: 'button', onclick: () => { View.ws = i; View.sec = 's1'; render(); scrollTo(0, 0); } },
      ws.tab, el('span', { class: 'dot' }, p.done === p.total ? '✓' : `${p.done}/${p.total}`), el('small', null, ws.small));
    tabs.append(b);
  });
  if (App.teacher) tabs.append(el('button', { class: 'tab teacher-only' + (View.ws === 'hw' ? ' on' : ''), type: 'button', onclick: () => { View.ws = 'hw'; View.sec = CH2.hw[0].id; render(); scrollTo(0, 0); } },
    '📘 功課對答', el('small', null, 'EX2.1 – EX2.3（教師）')));
  subtabs.innerHTML = '';
  if (View.ws === 'hw') {
    CH2.hw.forEach(h => subtabs.append(el('button', { class: 'stab' + (View.sec === h.id ? ' on' : ''), type: 'button', onclick: () => { View.sec = h.id; render(); } }, h.tab)));
    return;
  }
  const ws = CH2.ws[View.ws];
  ws.secs.forEach(s => {
    const ids = s.groups.flatMap(g => g.qs.map(q => q.id));
    const all = ids.every(id => App.isDone(id));
    subtabs.append(el('button', { class: 'stab' + (View.sec === s.key ? ' on' : ''), type: 'button', onclick: () => { View.sec = s.key; render(); } },
      s.tab, all ? el('span', { class: 'ok' }, ' ✓') : null));
  });
  subtabs.append(el('button', { class: 'stab' + (View.sec === 'px' ? ' on' : ''), type: 'button', onclick: () => { View.sec = 'px'; render(); } }, '★ 額外練習'));
}

/* ---------- 內容 ---------- */
function render() {
  const { main } = App.ui;
  main.innerHTML = ''; View.cards = [];
  if (View.ws === 'hw' && !App.teacher) View.ws = 0;
  renderTabs();
  setHash();
  if (View.ws === 'hw') return renderHW(main);
  const ws = CH2.ws[View.ws];
  REASONS = ws.reasons;
  if (View.sec === 'px') return renderPractice(main, ws);
  const sec = ws.secs.find(s => s.key === View.sec) || ws.secs[0];
  const secIdx = ws.secs.indexOf(sec);
  main.append(el('div', { class: 'sec-title' }, el('span', { class: 'sec-num' }, sec.num), el('h2', null, `課堂工作紙 ${ws.id}　${sec.title}`)));
  if (ws.goals[secIdx]) main.append(el('div', { class: 'goal', html: '學習目標：' + fmt(ws.goals[secIdx]) }));
  // 重點框
  const left = el('div');
  sec.notes.forEach(n => {
    const it = el('div', { class: 'note-item' }, el('h3', { html: fmt(n.h) }));
    n.p.forEach(p => it.append(el('p', null, renderTpl(p, 'show', []))));
    if (n.memo) it.append(el('span', { class: 'memo', html: '﹝簡記：<b>' + esc(n.memo).replace(/([A-Z]+)/g, '<i class="v">$1</i>') + '</b>﹞' }));
    left.append(it);
  });
  const notes = el('div', { class: 'notes' }, left);
  if (sec.widget && WIDGETS[sec.widget]) notes.append(WIDGETS[sec.widget]());
  else notes.classList.add('single');
  main.append(notes);
  (sec.examples || []).forEach(q => { const c = cardExample(q, { ws }); main.append(c.el); View.cards.push(c); });
  // 題目
  sec.groups.forEach(g => {
    const grp = el('section', { class: 'group' });
    if (g.stem) grp.append(el('div', { class: 'group-head' }, el('span', { class: 'qno' }, g.no), el('span', { class: 'stem', html: fmt(g.stem) })));
    g.qs.forEach(q => {
      const f = q.type === 'tick' ? cardTick : q.type === 'pick' ? cardPick : cardCalc;
      const c = f(q, { ws });
      grp.append(c.el); View.cards.push(c);
    });
    main.append(grp);
  });
  // 下一節
  const nx = ws.secs[secIdx + 1];
  main.append(el('div', { class: 'btnrow', style: 'justify-content:flex-end' },
    el('button', { class: 'btn teal', type: 'button', onclick: () => { View.sec = nx ? nx.key : 'px'; render(); scrollTo(0, 0); } }, nx ? `下一節：${nx.tab} ▶` : '★ 額外練習 ▶')));
  if (App.teacher) View.cards.forEach(c => c.teacher(true));
}
function renderPractice(main, ws) {
  const p = wsProgress(ws);
  main.append(el('div', { class: 'sec-title' }, el('span', { class: 'sec-num' }, '★'), el('h2', null, `課堂工作紙 ${ws.id}　額外練習`)));
  if (p.done < p.total && !App.teacher) {
    main.append(el('div', { class: 'lock' }, `🔒 先完成這份工作紙的所有題目（${p.done}/${p.total}），這裏就會解鎖。`));
    return;
  }
  main.append(practicePanel(ws));
}
function renderHW(main) {
  REASONS = CH2.ws[CH2.ws.length - 1].reasons;
  const hw = CH2.hw.find(h => h.id === View.sec) || CH2.hw[0];
  main.append(el('div', { class: 'sec-title' }, el('span', { class: 'sec-num' }, '📘'), el('h2', null, hw.title)),
    el('div', { class: 'goal' }, '只在教師模式顯示。按「下一步」逐行顯示答案，方便在課堂上對功課。'));
  hw.qs.forEach(q => { const c = cardExample(q, { ws: null }, '功課'); main.append(c.el); View.cards.push(c); });
}

/* ---------- 開發用：核對全部圖形（在瀏覽器 console 輸入 __audit()） ---------- */
window.__audit = function () {
  const out = [];
  const chk = q => out.push(...auditFigure(q));
  CH2.ws.forEach(ws => ws.secs.forEach(s => { (s.examples || []).forEach(chk); s.groups.forEach(g => g.qs.forEach(chk)); }));
  CH2.hw.forEach(h => h.qs.forEach(chk));
  return out;
};

document.addEventListener('DOMContentLoaded', buildShell);

</script>
