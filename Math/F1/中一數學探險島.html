<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中一數學探險島</title>
<!--
  ================================================================
  中一數學探險島（第一階段：框架 + 有向數島）
  ----------------------------------------------------------------
  檔案結構（請用「搜尋」找以下標記）：
    [A] CSS 樣式
    [B] 嚮導圖像 GUIDE（要換成自己的卡通圖片，只改這裏）
    [C] CONFIG 設定物件（所有題目數值、發現卡文字）
    [D] 工具函數（SVG、格式、動畫）
    [E] 儲存（localStorage，全部 try/catch）
    [F] 音效（Web Audio API 合成）
    [G] 拖放（Pointer Events，滑鼠 + 手指 + 電子白板）
    [H] 關卡 API（嚮導說話、三層提示、提問、記錄表、過關）
    [I] 畫面：首頁地圖、島嶼、收藏冊、證書
    [J] 有向數島 4 關（levelD1 至 levelD4）
    [K1] 坐標島 4 關（levelC1 至 levelC4）
    [K2] 面積體積島 4 關（levelA1 至 levelA4）
    [L] 啟動
  ================================================================
-->
<style>
/* ======================== [A] CSS 樣式 ======================== */
:root{
  --sea:#bfe8ff; --sea2:#8fd3f7; --ink:#1d2b3a; --ink2:#46566a;
  --card:#ffffff; --line:#c9d6e3;
  --pri:#ff7a2f; --pri-d:#d65a12;
  --ok:#1f9d55; --bad:#c2410c; --hl:#ffe066;
  --pos:#e8590c; --neg:#1c7ed6;
  --r:18px;
  --font:"PingFang HK","PingFang TC","Microsoft JhengHei","微軟正黑體","Noto Sans TC","Heiti TC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--font);font-size:clamp(17px,1.45vw,24px);
  line-height:1.45;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;font-size:1em;min-height:48px;min-width:48px;border:3px solid var(--ink);
  border-radius:14px;background:#fff;color:var(--ink);padding:.3em .9em;cursor:pointer;font-weight:700;
  box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--ink)}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri-d);box-shadow:0 4px 0 var(--pri-d)}
button.small{font-size:.85em;min-height:48px;padding:.2em .7em}
button.on{background:var(--hl)}
.screen{display:none;min-height:100%;flex-direction:column}
.screen.show{display:flex}
.topbar{display:flex;align-items:center;gap:.5em;flex-wrap:wrap;padding:.5em .8em;background:#fff;
  border-bottom:4px solid var(--ink)}
.topbar h1{font-size:1.35em;margin:0 auto 0 .2em;letter-spacing:.05em}
.topbar h2{font-size:1.15em;margin:0 auto 0 .2em}
.pill{display:inline-flex;align-items:center;gap:.25em;border:2px solid var(--ink);border-radius:99px;
  padding:.05em .7em;background:#fff;font-weight:700}

/* ---------- 首頁地圖 ---------- */
#mapWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:.5em}
#mapSvg{width:100%;max-width:1200px;max-height:calc(100vh - 150px);height:auto}
.island{cursor:pointer}
.island:focus{outline:none}
.island:focus .isl-shape{stroke-width:8}
.map-guide{display:flex;align-items:center;gap:.6em;padding:0 1em .6em;max-width:1100px;margin:0 auto;width:100%}

/* ---------- 嚮導 ---------- */
.guide-avatar{width:clamp(64px,7vw,104px);height:clamp(64px,7vw,104px);flex:0 0 auto}
.guide-avatar svg,.guide-avatar img{width:100%;height:100%;display:block;border-radius:50%}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:var(--r);padding:.45em .8em;flex:1;min-height:2.6em}
.bubble:before{content:"";position:absolute;left:-14px;top:22px;border:10px solid transparent;border-right-color:var(--ink)}
.bubble .say{font-size:1.08em;font-weight:600}
.bubble .say b{color:var(--pri-d)}
.bubble.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.opts{display:flex;flex-wrap:wrap;gap:.5em;margin-top:.4em}
.opts:empty{display:none}
.opts button{font-size:1.05em;min-width:4em}
.opts button.right{background:#d3f9d8;border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opts button.right:after{content:" ✔"}
.opts button.wrong{background:#eee;text-decoration:line-through}
.opts button.wrong:after{content:" ✖"}
.opts button.demo{outline:5px dashed var(--ink);outline-offset:3px;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ---------- 島嶼畫面 ---------- */
.lvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1em;padding:1em;max-width:1100px;margin:0 auto;width:100%}
.lvcard{background:#fff;border:3px solid var(--ink);border-radius:var(--r);padding:1em;display:flex;flex-direction:column;gap:.4em;
  box-shadow:0 6px 0 var(--ink);cursor:pointer;min-height:180px;text-align:left}
.lvcard .no{font-size:.9em;font-weight:700;color:var(--ink2)}
.lvcard .t{font-size:1.3em;font-weight:800}
.lvcard .d{color:var(--ink2);font-size:.95em;flex:1}
.lvcard .st{font-size:1.4em;letter-spacing:.1em}
.lvcard.done{background:#fff9db}

/* ---------- 關卡畫面 ---------- */
.phases{display:flex;gap:.3em;flex-wrap:wrap}
.phase{border:2px solid var(--ink);border-radius:99px;padding:0 .6em;font-size:.85em;font-weight:700;background:#fff;opacity:.45}
.phase.cur{opacity:1;background:var(--hl);border-width:3px}
.phase.cur:before{content:"▶ "}
.lv-guide{display:flex;gap:.8em;align-items:flex-start;padding:.6em .8em .2em}
.lv-body{flex:1;display:flex;gap:.8em;padding:.4em .8em .8em;align-items:stretch;min-height:0}
.stage{flex:1 1 600px;background:#fff;border:3px solid var(--ink);border-radius:var(--r);display:flex;align-items:center;justify-content:center;
  padding:.4em;min-width:0;position:relative;overflow:hidden}
.stage svg.stage-svg{width:100%;height:auto;max-height:calc(100vh - 260px);display:block;touch-action:none}
.side{flex:0 1 360px;display:flex;flex-direction:column;gap:.6em;min-width:0}
.panel{background:#fff;border:3px solid var(--ink);border-radius:var(--r);padding:.5em .7em}
.panel h3{margin:0 0 .3em;font-size:1em}
.ctrls{display:flex;flex-wrap:wrap;gap:.5em}
.ctrls button{flex:1 1 auto}
@media (min-width:861px){.side{max-height:calc(100vh - 200px);overflow:auto;padding-bottom:6px}}
@media (max-width:860px){.lv-body{flex-direction:column}.side{flex:0 0 auto}.stage svg.stage-svg{max-height:56vh}}

/* 自動記錄表 */
.rec{width:100%;border-collapse:collapse;font-size:.95em}
.rec th,.rec td{border:2px solid var(--ink);padding:.15em .35em;text-align:center}
.rec th{background:#eef4fa}
.rec tr.new td{animation:newrow 1.6s}
@keyframes newrow{0%{background:var(--hl)}100%{background:transparent}}
.rec-wrap{max-height:38vh;overflow:auto}
.rec td.chg{font-weight:900;text-decoration:underline;text-decoration-thickness:3px}

/* 可拖放卡 */
.cards{display:flex;flex-wrap:wrap;gap:.5em}
.dcard{touch-action:none;cursor:grab;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:.35em .7em;
  font-weight:800;font-size:1.05em;min-height:52px;min-width:56px;display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 var(--ink);white-space:nowrap}
.dcard.used{visibility:hidden}
.dcard.src-drag{opacity:.3}
.dcard.ghost{position:fixed;z-index:999;pointer-events:none;cursor:grabbing;transform:rotate(-3deg) scale(1.08);box-shadow:0 10px 18px rgba(0,0,0,.25)}
.dcard.demo{outline:5px dashed var(--ink);outline-offset:3px;animation:pulse 1s infinite}
.basket{border:4px dashed var(--ink);border-radius:var(--r);padding:.5em;min-height:120px;flex:1;background:#fbfdff}
.basket.over{background:var(--hl)}
.basket h4{margin:0 0 .3em;text-align:center}
.basket .cards{justify-content:center}

.hl{font-weight:900;text-decoration:underline;text-decoration-thickness:3px}
input.big-range{width:100%;height:48px;accent-color:var(--pri);cursor:pointer;touch-action:none}
input.big-range::-webkit-slider-thumb{width:36px;height:36px}
/* 觀察提示框 */
.note{background:#fff9db;border:3px dashed var(--ink);border-radius:14px;padding:.4em .7em;font-weight:700}
.eq{font-size:1.15em;font-weight:800;letter-spacing:.02em}
.checklist{list-style:none;margin:0;padding:0}
.checklist li:before{content:"☐ ";font-size:1.1em}
.checklist li.ok:before{content:"☑ "}
.checklist li.ok{font-weight:800}

/* ---------- 彈出視窗 ---------- */
.modal{position:fixed;inset:0;background:rgba(20,30,45,.55);display:none;align-items:center;justify-content:center;z-index:500;padding:1em}
.modal.show{display:flex}
.mbox{background:#fff;border:4px solid var(--ink);border-radius:24px;padding:1.2em 1.4em;max-width:720px;width:100%;max-height:92vh;overflow:auto;
  box-shadow:0 10px 0 var(--ink);animation:pop .4s}
.mbox h2{margin:.1em 0 .4em}
.mbtns{display:flex;gap:.6em;justify-content:flex-end;flex-wrap:wrap;margin-top:1em}

/* 發現卡 */
.dcardbig{border:4px solid var(--ink);border-radius:20px;overflow:hidden}
.dcardbig .hd{background:repeating-linear-gradient(45deg,#ffe8a3 0 12px,#fff3c4 12px 24px);padding:.5em .9em;font-weight:900;
  border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;gap:.5em;flex-wrap:wrap}
.dcardbig .bd{padding:.7em .9em}
.dcardbig .lab{font-weight:900;margin-top:.3em}
.dcardbig .lab:before{content:"◆ "}
.dcardbig .named{background:#f1f8ff;border-left:8px solid var(--ink);padding:.4em .7em;margin-top:.2em;border-radius:6px}
.dcardbig .named b,.dcardbig .found b{text-decoration:underline;text-decoration-thickness:2px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1em;padding:1em;max-width:1200px;margin:0 auto;width:100%}
.aslot{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:.7em;min-height:140px;cursor:pointer;text-align:left;box-shadow:0 5px 0 var(--ink)}
.aslot.locked{background:repeating-linear-gradient(-45deg,#eef2f6 0 10px,#fff 10px 20px);cursor:default;color:var(--ink2)}
.aslot .t{font-weight:900;font-size:1.1em}

/* 星星飛出 */
.fx-star{position:fixed;font-size:64px;z-index:800;pointer-events:none;animation:starfly 1.2s forwards}
@keyframes starfly{0%{transform:scale(.2) rotate(0);opacity:0}30%{transform:scale(1.4) rotate(40deg);opacity:1}100%{transform:scale(1) rotate(360deg) translateY(-60px);opacity:0}}

/* ---------- 證書 ---------- */
#certArea{display:flex;flex-direction:column;align-items:center;gap:1em;padding:1em}
.cert{background:#fff;width:min(960px,100%);aspect-ratio:1.414;border:10px double #000;outline:3px solid #000;outline-offset:6px;padding:4% 6%;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;color:#000;position:relative;
  font-size:clamp(12px,1.6vw,22px)}
.cert .ct{font-size:2.6em;font-weight:900;letter-spacing:.25em;margin:0}
.cert .cn{font-size:2.2em;font-weight:900;border-bottom:3px solid #000;min-width:50%;padding:0 .5em;min-height:1.4em}
.cert .badges{display:flex;gap:2em;justify-content:center}
.cert .badges svg{width:5.5em;height:5.5em}
.cert .sig{display:flex;justify-content:space-between;width:100%;gap:2em}
.cert .sig div{border-top:2px solid #000;padding-top:.2em;min-width:30%}
.cert .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8em;font-weight:900;color:rgba(0,0,0,.08);transform:rotate(-20deg);pointer-events:none}
.namein{font-size:1.3em;padding:.3em .6em;border:3px solid var(--ink);border-radius:12px;min-height:52px;width:min(420px,90vw);font-family:inherit}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff}
  body *{visibility:hidden}
  #certPrint,#certPrint *{visibility:visible}
  #certPrint{position:fixed;left:0;top:0;width:100%;border-color:#000}
  .cert{width:100%;font-size:15pt}
}
</style>
</head>
<body>

<!-- =================== 畫面：首頁地圖 =================== -->
<section id="scrMap" class="screen">
  <div class="topbar">
    <h1>中一數學探險島</h1>
    <span class="pill" id="mapStars">★ 0 / 12</span>
    <button class="small" id="btnAlbum">發現卡收藏冊</button>
    <button class="small" id="btnCert">證書</button>
    <button class="small" data-sound>音效：開</button>
    <button class="small" id="btnReset">重設進度</button>
  </div>
  <div id="mapWrap"></div>
  <div class="map-guide">
    <div class="guide-avatar" data-guide></div>
    <div class="bubble"><div class="say" id="mapSay"></div></div>
  </div>
</section>

<!-- =================== 畫面：島嶼（四關） =================== -->
<section id="scrIsland" class="screen">
  <div class="topbar">
    <button class="small" data-go="map">◀ 地圖</button>
    <h2 id="islTitle"></h2>
    <span class="pill" id="islStars"></span>
    <button class="small" data-sound>音效：開</button>
  </div>
  <div class="lv-guide">
    <div class="guide-avatar" data-guide></div>
    <div class="bubble"><div class="say" id="islSay"></div></div>
  </div>
  <div class="lvgrid" id="islGrid"></div>
</section>

<!-- =================== 畫面：關卡 =================== -->
<section id="scrLevel" class="screen">
  <div class="topbar">
    <button class="small" id="lvBack">◀ 返回</button>
    <h2 id="lvTitle"></h2>
    <div class="phases" id="lvPhases"></div>
    <button class="small" data-sound>音效：開</button>
  </div>
  <div class="lv-guide">
    <div class="guide-avatar" data-guide></div>
    <div class="bubble" id="lvBubble"><div class="say" id="lvSay"></div><div class="opts" id="lvOpts"></div></div>
  </div>
  <div class="lv-body">
    <div class="stage" id="lvStage"></div>
    <div class="side" id="lvSide"></div>
  </div>
</section>

<!-- =================== 畫面：發現卡收藏冊 =================== -->
<section id="scrAlbum" class="screen">
  <div class="topbar">
    <button class="small" data-go="map">◀ 地圖</button>
    <h2>發現卡收藏冊</h2>
    <span class="pill" id="albCount"></span>
  </div>
  <div class="album" id="albGrid"></div>
</section>

<!-- =================== 畫面：證書 =================== -->
<section id="scrCert" class="screen">
  <div class="topbar">
    <button class="small" data-go="map">◀ 地圖</button>
    <h2>中一數學預習證書</h2>
  </div>
  <div id="certArea"></div>
</section>

<!-- 彈出視窗 -->
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<script>
'use strict';
/* =================================================================
   [B] 嚮導圖像 GUIDE
   -----------------------------------------------------------------
   想換成自己的卡通圖片：把 GUIDE_IMAGE 設為圖片網址或 data URI，
   例如 const GUIDE_IMAGE = 'lusir.png';（圖片與 html 放同一資料夾）
   或   const GUIDE_IMAGE = 'data:image/png;base64,....';（完全離線）
   留空 '' 就會用下面的 SVG 呂Sir。
   ================================================================= */
const GUIDE_IMAGE = '';
const GUIDE_NAME = '呂Sir';
const GUIDE_SVG = `
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="呂Sir">
  <circle cx="60" cy="60" r="58" fill="#d8f0ff" stroke="#1d2b3a" stroke-width="3"/>
  <path d="M18 112 Q22 84 60 82 Q98 84 102 112 Z" fill="#3b82c4" stroke="#1d2b3a" stroke-width="3"/>
  <path d="M48 83 L60 98 L72 83 Z" fill="#fff" stroke="#1d2b3a" stroke-width="2.5"/>
  <path d="M57 90 L63 90 L65 108 L60 113 L55 108 Z" fill="#e8590c" stroke="#1d2b3a" stroke-width="2"/>
  <rect x="52" y="70" width="16" height="14" fill="#f6cfa8"/>
  <ellipse cx="30" cy="52" rx="6" ry="9" fill="#f6cfa8" stroke="#1d2b3a" stroke-width="2.5"/>
  <ellipse cx="90" cy="52" rx="6" ry="9" fill="#f6cfa8" stroke="#1d2b3a" stroke-width="2.5"/>
  <ellipse cx="60" cy="50" rx="30" ry="32" fill="#f6cfa8" stroke="#1d2b3a" stroke-width="3"/>
  <path d="M29 46 Q28 16 60 16 Q92 16 91 46 Q86 30 74 28 Q66 36 44 32 Q34 34 29 46 Z" fill="#1d2b3a"/>
  <g fill="none" stroke="#1d2b3a" stroke-width="3">
    <rect x="35" y="44" width="20" height="15" rx="6" fill="#fff" fill-opacity=".5"/>
    <rect x="65" y="44" width="20" height="15" rx="6" fill="#fff" fill-opacity=".5"/>
    <path d="M55 50 L65 50"/>
  </g>
  <circle cx="45" cy="52" r="3.2" fill="#1d2b3a"/><circle cx="75" cy="52" r="3.2" fill="#1d2b3a"/>
  <path d="M46 67 Q60 78 74 67" fill="none" stroke="#1d2b3a" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="38" cy="65" rx="5" ry="3" fill="#ff9f9f" opacity=".6"/><ellipse cx="82" cy="65" rx="5" ry="3" fill="#ff9f9f" opacity=".6"/>
</svg>`;

/* =================================================================
   [C] CONFIG 設定物件 —— 所有題目數值、發現卡文字都在這裏修改
   ================================================================= */
const CONFIG = {
  storageKey: 'm1-math-explorer-v1',
  islands: [
    { id:'directed', name:'有向數島', badge:'正負勇士徽章', ready:true,  levels:['d1','d2','d3','d4'] },
    { id:'coord',    name:'坐標島',   badge:'坐標領航員徽章', ready:true, levels:['c1','c2','c3','c4'] },
    { id:'area',     name:'面積體積島', badge:'空間建築師徽章', ready:true, levels:['a1','a2','a3','a4'] }
  ],
  levels: {
    /* ---------------- 有向數島 ---------------- */
    d1: { title:'升降機大廈', desc:'把升降機送到地面以上和地庫的樓層。',
      data:{
        topFloor:5, bottomFloor:-3, liftStart:1,
        passengers:[ {name:'陳婆婆',floor:3}, {name:'小明',floor:-2}, {name:'送貨員',floor:0}, {name:'保安叔叔',floor:-1} ],
        predictTargets:[-3, 4, -1],               // 第二階段：只說有向數
        sea:{ objects:[ {id:'kite',name:'風箏',h:30}, {id:'boat',name:'小船',h:0}, {id:'sub',name:'潛艇',h:-20} ],
              extraCards:[-30, 20] }               // 干擾卡
      },
      card:{
        found:'用「<b>+</b>」和「<b>−</b>」可以表示<b>相反</b>的位置或方向：地面以上用 +，地庫用 −；海平面以上用 +，海平面以下用 −。<b>0</b> 是兩者的分界。',
        named:'像 +3、−2 這樣帶有正負號的數，叫做<b>有向數</b>。+3 是<b>正數</b>（+3 通常寫成 3），−2 是<b>負數</b>。0 既不是正數，也不是負數。'
      }},
    d2: { title:'溫度排隊', desc:'把城市溫度放到溫度計和數線上，找出相反數。',
      data:{
        cities:[ {name:'哈爾濱',t:-8}, {name:'首爾',t:-2}, {name:'北京',t:0}, {name:'東京',t:3} ],
        compare:[ [-6,-1], [-4,-9] ],              // 預測：哪個較大？
        oppCards:[4,-4,6,-6,-2],                   // 相反數配對卡
        oppPredict:[2,-5]                          // 預測位置：−2 的伙伴、5 的相反數
      },
      card:{
        found:'在溫度計上，愈上面的數愈大；在水平數線上，<b>愈右邊的數愈大</b>。負數離 0 愈遠，數值反而<b>愈小</b>，例如 −8 &lt; −2。在 0 兩邊、離 0 距離相同的兩個數，例如 4 和 −4，會一起發光。',

/* =================================================================
   [D] 工具函數
   ================================================================= */
const $ = s => document.querySelector(s);
const SVGNS = 'http://www.w3.org/2000/svg';
/** 建立 SVG 元素 */
function S(tag, attrs = {}, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) {
    if (k === 'text') e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  if (parent) parent.appendChild(e);
  return e;
}
/** 建立 HTML 元素 */
function H(tag, attrs = {}, parent) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'text') e.textContent = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  if (parent) parent.appendChild(e);
  return e;
}
const MINUS = '−';
/** 有向數格式：+3、−2、0 */
function fmt(n) { return n > 0 ? '+' + n : n < 0 ? MINUS + (-n) : '0'; }
/** 一般格式：3、−2、0（數線刻度用） */
function fmtU(n) { return n < 0 ? MINUS + (-n) : String(n); }
/** 帶括號：(+3)、(−2) */
function par(n) { return '(' + fmt(n) + ')'; }
/** 樓層名稱：3/F、G/F、B2 */
function floorName(f) { return f > 0 ? f + '/F' : f === 0 ? 'G/F' : 'B' + (-f); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
/** 螢幕座標 → SVG 座標 */
function svgPoint(svg, cx, cy) {
  const p = svg.createSVGPoint(); p.x = cx; p.y = cy;
  const m = svg.getScreenCTM(); return m ? p.matrixTransform(m.inverse()) : { x: 0, y: 0 };
}
/** 點是否在元素的螢幕範圍內（pad 為額外範圍） */
function hitEl(el, cx, cy, pad = 0) {
  const r = el.getBoundingClientRect();
  return cx >= r.left - pad && cx <= r.right + pad && cy >= r.top - pad && cy <= r.bottom + pad;
}
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

/* =================================================================
   [E] 儲存：所有讀寫都用 try/catch 包好；失敗時遊戲照常（只是不保存）
   ================================================================= */
const Store = {
  data: { done:{}, sound:true, name:'' },
  load() {
    try {
      const raw = window.localStorage.getItem(CONFIG.storageKey);
      if (raw) { const d = JSON.parse(raw); if (d && typeof d === 'object') Object.assign(this.data, d); }
      if (!this.data.done || typeof this.data.done !== 'object') this.data.done = {};
    } catch (e) { /* 讀取失敗：用預設值 */ }
  },
  save() {
    try { window.localStorage.setItem(CONFIG.storageKey, JSON.stringify(this.data)); } catch (e) { /* 忽略 */ }
  },
  reset() {
    this.data = { done:{}, sound:this.data.sound, name:'' };
    try { window.localStorage.removeItem(CONFIG.storageKey); } catch (e) { /* 忽略 */ }
    this.save();
  },
  isDone(id) { return !!this.data.done[id]; },
  setDone(id) { this.data.done[id] = true; this.save(); },
  countDone() { return Object.keys(CONFIG.levels).filter(id => this.data.done[id]).length; },
  islandDone(isl) { return isl.levels.every(id => this.data.done[id]); }
};

/* =================================================================
   [F] 音效：Web Audio API 即時合成，不用音檔
   ================================================================= */
const Sfx = {
  ctx: null,
  ensure() {
    if (!Store.data.sound) return null;
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; this.ctx = new AC(); }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch (e) { return null; }
  },
  tone(freq, dur = .12, type = 'sine', vol = .18, delay = 0) {
    const c = this.ensure(); if (!c) return;
    try {
      const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  },
  play(name) {
    switch (name) {
      case 'tap':   this.tone(660, .06, 'triangle', .12); break;
      case 'move':  this.tone(440, .07, 'sine', .1); break;
      case 'drop':  this.tone(520, .08, 'triangle', .14); break;
      case 'good':  this.tone(660, .12, 'triangle'); this.tone(880, .12, 'triangle', .18, .1); this.tone(1175, .2, 'triangle', .18, .2); break;
      case 'soft':  this.tone(330, .14, 'sine', .12); this.tone(294, .18, 'sine', .1, .12); break; // 溫和的「再想想」
      case 'glow':  [523, 659, 784, 1046].forEach((f, i) => this.tone(f, .25, 'sine', .12, i * .07)); break;
      case 'star':  [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, .3, 'triangle', .16, i * .1)); break;
      case 'whoosh': { const c = this.ensure(); if (!c) return; try { const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
          o.type = 'sawtooth'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(900, t + .3);
          g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.0001, t + .32); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + .35); } catch (e) {} break; }
    }
  }
};

/* =================================================================
   [G] 拖放：Pointer Events（滑鼠、手指、觸控筆、電子白板都適用）
   -----------------------------------------------------------------
   makeDraggable(el, {
     enabled: () => true/false,         // 可否拖動
     onMove: (cx, cy) => {},            // 拖動中（螢幕座標），可用作預覽
     onDrop: (cx, cy) => true/false     // 放下；回傳 true = 接受，false = 彈回原位
     onEnd:  () => {}                   // 結束（清除預覽）
   })
   ================================================================= */
function makeDraggable(el, opt) {
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button > 0) return;
    if (opt.enabled && !opt.enabled()) return;
    if (el.classList.contains('used')) return;
    e.preventDefault();
    Sfx.play('tap');
    const r = el.getBoundingClientRect();
    const ghost = el.cloneNode(true);
    ghost.classList.add('ghost'); ghost.classList.remove('demo');
    Object.assign(ghost.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', margin: 0 });
    document.body.appendChild(ghost);
    const dx = e.clientX - r.left, dy = e.clientY - r.top;
    el.classList.add('src-drag');
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    const move = ev => {
      ghost.style.left = (ev.clientX - dx) + 'px';
      ghost.style.top = (ev.clientY - dy) + 'px';
      if (opt.onMove) opt.onMove(ev.clientX, ev.clientY);
    };
    const finish = (ev, cancelled) => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', cancel);
      el.classList.remove('src-drag');
      let ok = false;
      if (!cancelled) ok = !!opt.onDrop(ev.clientX, ev.clientY);
      if (opt.onEnd) opt.onEnd();
      if (ok) { ghost.remove(); return; }
      // 彈回原位
      ghost.style.transition = 'left .25s, top .25s';
      ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
      setTimeout(() => ghost.remove(), 260);
    };
    const up = ev => finish(ev, false);
    const cancel = ev => finish(ev, true);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', cancel);
  });
}
/** 示範用：把一張卡「飛」到目標元素（第三次提示） */
function flyCard(cardEl, targetEl, ms = 700) {
  return new Promise(res => {
    const a = cardEl.getBoundingClientRect(), b = targetEl.getBoundingClientRect();
    const g = cardEl.cloneNode(true); g.classList.add('ghost'); g.classList.remove('demo');
    Object.assign(g.style, { left: a.left + 'px', top: a.top + 'px', width: a.width + 'px', height: a.height + 'px', margin: 0, transition: `left ${ms}ms ease-in-out, top ${ms}ms ease-in-out` });
    document.body.appendChild(g);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      g.style.left = (b.left + b.width / 2 - a.width / 2) + 'px';
      g.style.top = (b.top + b.height / 2 - a.height / 2) + 'px';
    }));
    setTimeout(() => { g.remove(); res(); }, ms + 60);
  });
}
/** 讓 SVG 內的標記可拖動或點擊數線放置；toValue(svgPt) 回傳數值；onSet(v) */
function svgPicker(svg, hitRect, toValue, onSet, enabled) {
  let dragging = false;
  const handle = (ev) => { const p = svgPoint(svg, ev.clientX, ev.clientY); const v = toValue(p); if (v !== null && v !== undefined) onSet(v); };
  hitRect.style.cursor = 'pointer';
  hitRect.addEventListener('pointerdown', ev => {
    if (enabled && !enabled()) return;
    ev.preventDefault(); dragging = true;
    try { hitRect.setPointerCapture(ev.pointerId); } catch (e) {}
    handle(ev);
  });
  hitRect.addEventListener('pointermove', ev => { if (dragging) handle(ev); });
  const stop = () => { dragging = false; };
  hitRect.addEventListener('pointerup', stop);
  hitRect.addEventListener('pointercancel', stop);
}

/* =================================================================
   [H] 關卡 API —— 每關都經這個 api 物件與介面溝通
   ================================================================= */
const PHASES = { play:'玩', observe:'觀察', predict:'預測', verify:'驗證' };
let CUR = null;  // 目前關卡的 api

function makeApi(levelId) {
  const token = { alive: true };
  const stage = $('#lvStage'), side = $('#lvSide'), sayEl = $('#lvSay'), opts = $('#lvOpts'), bubble = $('#lvBubble');
  stage.innerHTML = ''; side.innerHTML = ''; opts.innerHTML = '';
  const valOf = (h, ctx) => typeof h === 'function' ? h(ctx) : (h || '');

  const api = {
    id: levelId, stage, side, token,
    alive: () => token.alive,
    /** 呂Sir 說話（可用 HTML，<b> 會突出） */
    say(html) {
      sayEl.innerHTML = html;
      bubble.classList.remove('pop'); void bubble.offsetWidth; bubble.classList.add('pop');
    },
    /** 顯示目前步驟：play / observe / predict / verify */
    phase(p) {
      $('#lvPhases').querySelectorAll('.phase').forEach(x => x.classList.toggle('cur', x.dataset.p === p));
    },
    /** 只在關卡仍然開着時才 resolve 的 Promise（離開關卡後流程自動停止） */
    p(fn) { return new Promise(res => fn(v => { if (token.alive) res(v); })); },
    wait(ms) { return api.p(res => setTimeout(res, ms)); },
    /** 動畫：fn(t) t 由 0 到 1 */
    tween(ms, fn) {
      return api.p(res => {
        const t0 = performance.now();
        const step = now => {
          if (!token.alive) return;
          const t = Math.min(1, (now - t0) / ms); fn(ease(t));
          if (t < 1) requestAnimationFrame(step); else res();
        };
        requestAnimationFrame(step);
      });
    },
    praise(extra = '') { Sfx.play('good'); api.say(pick(CONFIG.praise) + (extra ? ' ' + extra : '')); },
    /**
     * 三層提示：hints = [第一次（引導觀察）, 第二次（指出要看哪裏）]，demo = 第三次示範
     * hints 可以是文字或 function(ctx)。回傳 { wrong(ctx), reset() }
     */
    hinter(hints, demo) {
      let n = 0;
      return {
        wrong(ctx) {
          n++; Sfx.play('soft');
          if (n === 1) api.say('<span aria-hidden="true">？</span> 再仔細看看：' + valOf(hints[0], ctx));
          else if (n === 2) api.say('<b>提示：</b>' + valOf(hints[1], ctx));
          else { n = 0; api.say('不要緊！我示範一次給你看。' + valOf(hints[2], ctx)); if (demo) demo(ctx); }
        },
        reset() { n = 0; },
        get count() { return n; }
      };
    },
    /**
     * 提問（揀選項）：回傳 Promise，答對才繼續
     * explain：答對後補充的一句（會出現「繼續」按鈕）
     */
    ask(q, options, correct, hints = [], explain = '') {
      return api.p(res => {
        api.say(q); opts.innerHTML = '';
        let n = 0;
        const btns = options.map((o, i) => {
          const b = H('button', { html: o }, opts);
          b.addEventListener('click', () => {
            if (b.disabled || !token.alive) return;
            if (i === correct) {
              btns.forEach(x => x.disabled = true); b.disabled = false; b.classList.remove('demo'); b.classList.add('right');
              Sfx.play('good');
              api.say(pick(CONFIG.praise) + (explain ? ' ' + explain : ''));
              setTimeout(() => { if (token.alive) { opts.innerHTML = ''; res(i); } }, explain ? 2200 : 1100);
            } else {
              n++; b.classList.add('wrong'); b.disabled = true; Sfx.play('soft');
              if (n === 1) api.say(q + '<br>再仔細看看：' + valOf(hints[0]));
              else if (n === 2) api.say(q + '<br><b>提示：</b>' + valOf(hints[1]));
              else { api.say('我示範一次：答案是「' + options[correct] + '」。' + explain + ' 按一下它繼續。'); btns[correct].classList.add('demo'); }
            }
          });
          return b;
        });
      });
    },
    /** 在嚮導對話框下顯示一個按鈕，按下才繼續 */
    next(label = '繼續 ▶') {
      return api.p(res => {
        opts.innerHTML = '';
        const b = H('button', { class: 'pri', html: label }, opts);
        b.addEventListener('click', () => { Sfx.play('tap'); opts.innerHTML = ''; res(); });
      });
    },
    clearOpts() { opts.innerHTML = ''; },
    /** 右邊加一個面板 */
    panel(title, parent = side) {
      const p = H('div', { class: 'panel' }, parent);
      if (title) H('h3', { html: title }, p);
      return p;
    },
    /** 自動記錄表：add(cells, chgIdx[]) 加一行；chgIdx 欄位會用粗體+底線突出 */
    table(headers, parent) {
      const wrap = H('div', { class: 'rec-wrap' }, parent);
      const t = H('table', { class: 'rec' }, wrap);
      const tr = H('tr', {}, H('thead', {}, t));
      headers.forEach(h => H('th', { html: h }, tr));
      const tb = H('tbody', {}, t);
      return {
        el: t, tbody: tb,
        add(cells, chg = []) {
          tb.querySelectorAll('tr.new').forEach(r => r.classList.remove('new'));
          const r = H('tr', { class: 'new' }, tb);
          cells.forEach((c, i) => H('td', { html: c, class: chg.includes(i) ? 'chg' : '' }, r));
          wrap.scrollTop = wrap.scrollHeight;
          return r;
        },
        clear() { tb.innerHTML = ''; }
      };
    },
    button(label, fn, cls = '', parent) {
      const b = H('button', { html: label, class: cls }, parent);
      b.addEventListener('click', () => { if (!b.disabled && token.alive) { Sfx.play('tap'); fn(b); } });
      return b;
    },
    /** 過關：保存星星 → 發現卡 → （如完成全島）徽章 */
    complete() {
      if (!token.alive) return;
      const isl = islandOf(levelId);
      const islWasDone = Store.islandDone(isl);
      Store.setDone(levelId);
      Sfx.play('star'); starFx();
      setTimeout(() => {
        if (!token.alive) return;
        showDiscovery(levelId, true, () => {
          if (!islWasDone && Store.islandDone(isl)) showBadge(isl, () => goIsland(isl.id));
          else goIsland(isl.id);
        });
      }, 900);
    }
  };
  return api;
}

function islandOf(levelId) { return CONFIG.islands.find(i => i.levels.includes(levelId)); }

/** 開始一關 */
function startLevel(id) {
  if (CUR) CUR.token.alive = false;

  show('scrLevel');
  $('#lvTitle').textContent = `${isl.name}・第 ${isl.levels.indexOf(id) + 1} 關：${L.title}`;
  const ph = $('#lvPhases'); ph.innerHTML = '';
  Object.entries(PHASES).forEach(([k, v]) => H('span', { class: 'phase', 'data-p': k, text: v }, ph));
  $('#lvBack').onclick = () => { Sfx.play('tap'); if (CUR) CUR.token.alive = false; CUR = null; goIsland(isl.id); };
  const api = makeApi(id); CUR = api;
  const fn = LEVEL_FUNCS[id];
  if (fn) fn(api, L.data);
  else api.say('這一關正在建設中，很快開放！');

/** 徽章：黑白也能分辨（不同外形 + 花紋 + 符號） */

    sym = `<path d="M34 60H86M60 34V86" stroke="${ink}" stroke-width="4"/><path d="M86 60l-7-5v10zM60 34l-5 7h10z" fill="${ink}"/><circle cx="74" cy="48" r="5" fill="${ink}"/>`;
  } else {
    shape = `<path d="M60 6 L108 22 Q108 86 60 114 Q12 86 12 22 Z" fill="${fill}" stroke="${ink}" stroke-width="5"/><path d="M60 6 L108 22 Q108 86 60 114 Q12 86 12 22 Z" fill="${pid}" opacity=".35"/><circle cx="60" cy="58" r="34" fill="#fff" stroke="${ink}" stroke-width="3"/>`;

const LEVEL_FUNCS = {};
const INK = '#1d2b3a';

/* ---------- 共用：水平數線 ---------- */
function hNumberLine(parent, { min, max, x0, x1, y, label = fmtU, fs = 22 }) {
  const unit = (x1 - x0) / (max - min);
  const xOf = v => x0 + (v - min) * unit;
  const g = S('g', {}, parent);
  S('line', { x1: x0 - 22, y1: y, x2: x1 + 22, y2: y, stroke: INK, 'stroke-width': 4 }, g);
  S('path', { d: `M${x1 + 34} ${y} l-14 -8 v16 z M${x0 - 34} ${y} l14 -8 v16 z`, fill: INK }, g);
  for (let v = min; v <= max; v++) {
    S('line', { x1: xOf(v), y1: y - (v === 0 ? 14 : 9), x2: xOf(v), y2: y + (v === 0 ? 14 : 9), stroke: INK, 'stroke-width': v === 0 ? 4 : 2.5 }, g);
    S('text', { x: xOf(v), y: y + 36, 'text-anchor': 'middle', 'font-size': fs, 'font-weight': v === 0 ? 900 : 600, fill: INK, text: label(v) }, g);
  }
  return { g, xOf, unit, vOf: x => Math.round((x - x0) / unit + min), min, max };
}
/* ---------- 共用：鉛垂數線 ---------- */
function vNumberLine(parent, { min, max, x, y0, y1, label = fmtU, side = 'right', fs = 20, arrows = true }) {
  const unit = (y1 - y0) / (max - min);
  const yOf = v => y0 + (max - v) * unit;
  const g = S('g', {}, parent);
  if (arrows) {
    S('line', { x1: x, y1: y0 - 20, x2: x, y2: y1 + 20, stroke: INK, 'stroke-width': 4 }, g);
    S('path', { d: `M${x} ${y0 - 32} l-8 14 h16 z M${x} ${y1 + 32} l-8 -14 h16 z`, fill: INK }, g);
  }
  const labels = {};
  for (let v = min; v <= max; v++) {
    S('line', { x1: x - (v === 0 ? 14 : 8), y1: yOf(v), x2: x + (v === 0 ? 14 : 8), y2: yOf(v), stroke: INK, 'stroke-width': v === 0 ? 4 : 2.5 }, g);
    labels[v] = S('text', { x: side === 'right' ? x + 20 : x - 20, y: yOf(v) + fs * .35, 'text-anchor': side === 'right' ? 'start' : 'end', 'font-size': fs, 'font-weight': v === 0 ? 900 : 600, fill: INK, text: label(v) }, g);
  }
  return { g, yOf, unit, vOf: y => Math.round(max - (y - y0) / unit), labels, min, max };
}
/* ---------- 共用：預測旗子（點擊或拖動放置，再按「確定」） ---------- */
function makeFlag(parent, vertical) {
  const g = S('g', { style: 'pointer-events:none', opacity: 0 }, parent);
  if (vertical) {
    S('path', { d: 'M0 0 h46', stroke: INK, 'stroke-width': 4 }, g);
    S('path', { d: 'M46 0 v-30 l34 12 l-34 12', fill: '#ffe066', stroke: INK, 'stroke-width': 3 }, g);
    S('text', { x: 58, y: -11, 'font-size': 18, 'font-weight': 900, 'text-anchor': 'middle', fill: INK, text: '?' }, g);
  } else {
    S('path', { d: 'M0 0 v-58', stroke: INK, 'stroke-width': 4 }, g);
    S('path', { d: 'M0 -58 l30 10 l-30 10 z', fill: '#ffe066', stroke: INK, 'stroke-width': 3 }, g);
    S('text', { x: 10, y: -42, 'font-size': 16, 'font-weight': 900, fill: INK, text: '?' }, g);
  }
  return {
    g, value: null,
    set(v, x, y) { this.value = v; g.setAttribute('transform', `translate(${x} ${y})`); g.setAttribute('opacity', 1); },
    hide() { this.value = null; g.setAttribute('opacity', 0); }
  };
}

      const sx = o.id === 'kite' ? x + 36 : o.id === 'boat' ? x - 190 : x + 70, sy = o.id === 'boat' ? y - 70 : y - 22;
      const slot = S('g', { 'data-slot': o.id }, s);
      const r = S('rect', { x: sx, y: sy, width: 104, height: 44, rx: 10, fill: '#fff', stroke: INK, 'stroke-width': 3, 'stroke-dasharray': '8 5' }, slot);
      const t = S('text', { x: sx + 52, y: sy + 30, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 900, fill: INK, text: '?' }, slot);
      objs[o.id] = { o, slot, r, t, filled: false };
    });
    api.say('海平面就像大廈的地面。把正確的<b>有向數</b>卡拖到每件物件旁邊的「?」。');
    const pc = api.panel('有向數卡（拖到「?」）');
    const cards = H('div', { class: 'cards' }, pc);
    H('div', { class: 'note', style: 'margin-top:.5em', html: '海平面以上 20 m 記作 <b>+20 m</b>' }, pc);
    const vals = shuffle(D.sea.objects.map(o => o.h).concat(D.sea.extraCards));
    let left = D.sea.objects.length;
    return api.p(res => {
      const fill = (ob, cardEl) => {
        ob.filled = true; ob.t.textContent = (ob.o.h === 0 ? '0' : fmt(ob.o.h)) + ' m';
        ob.r.setAttribute('stroke-dasharray', ''); ob.r.setAttribute('stroke-width', 4); ob.r.setAttribute('fill', '#fff9db');
        cardEl.classList.add('used'); Sfx.play('drop');
        left--;
        if (left === 0) { api.praise('海平面以上用 +，海平面以下用 ' + MINUS + '，海平面是 0！'); setTimeout(res, 1800); }
        else api.praise(`${ob.o.name}的位置是 <b>${ob.t.textContent}</b>。`);
      };
      const h = api.hinter([
        ctx => `${ctx.ob.o.name}在海平面的<b>上面</b>還是<b>下面</b>？`,
        ctx => ctx.ob.o.h === 0 ? `${ctx.ob.o.name}剛好在海平面上，即是 0 m。` :
          `${ctx.ob.o.name}在海平面${ctx.ob.o.h > 0 ? '以上' : '以下'} ${Math.abs(ctx.ob.o.h)} m。海平面${ctx.ob.o.h > 0 ? '以上用「+」' : '以下用「' + MINUS + '」'}。`
      ], async ctx => {
        const right = [...cards.children].find(c => +c.dataset.v === ctx.ob.o.h && !c.classList.contains('used'));
        if (!right) return;
        right.classList.add('demo'); await api.wait(600); right.classList.remove('demo');
        await flyCard(right, ctx.ob.r); fill(ctx.ob, right);
      });
      vals.forEach(v => {
        const c = H('div', { class: 'dcard', 'data-v': v, text: (v === 0 ? '0' : fmt(v)) + ' m' }, cards);
        makeDraggable(c, {
          onDrop: (cx, cy) => {
            const ob = Object.values(objs).find(q => !q.filled && hitEl(q.r, cx, cy, 24));
            if (!ob) return false;
            if (v === ob.o.h) { h.reset(); fill(ob, c); return true; }
            h.wrong({ ob }); return false;
          }
        });
      });
    });
  }
  run();
};

/* =================================================================
   第 2 關：溫度排隊
   玩：溫度卡放上溫度計（鉛垂數線）→ 觀察 → 放上水平數線 → 預測大小 → 驗證
   相反數配對：0 兩邊、距離相同的兩張卡一起發光
   ================================================================= */
LEVEL_FUNCS.d2 = function (api, D) {
  const cityTxt = c => `${c.name} ${fmtU(c.t)}°C`;
  const hints = (c, vert) => [
    `${c.name}是 ${fmtU(c.t)}°C。找${vert ? '溫度計' : '數線'}上寫着 ${fmtU(c.t)} 的刻度。`,
    c.t < 0 ? `負數在 0 的<b>${vert ? '下面' : '左邊'}</b>。由 0 向${vert ? '下' : '左'}數 ${-c.t} 格。` :
      c.t === 0 ? '找中間的 0。' : `正數在 0 的<b>${vert ? '上面' : '右邊'}</b>。由 0 向${vert ? '上' : '右'}數 ${c.t} 格。`
  ];

  /** 通用：把卡拖到數線上；getVal(cx,cy) 回傳數值或 null；place(card, el) 放好後畫圖 */
  function dragToLine({ items, cardsBox, label, getVal, preview, clearPreview, place, hintsOf, targetEl }) {
    let left = items.length;
    return api.p(res => {
      items.forEach(it => {
        const c = H('div', { class: 'dcard', html: label(it) }, cardsBox);
        const hn = api.hinter(hintsOf(it), async () => {
          c.classList.add('demo'); await api.wait(500); c.classList.remove('demo');
          await flyCard(c, targetEl(it)); done();
        });
        const done = () => { c.classList.add('used'); Sfx.play('drop'); place(it); left--; if (left === 0) setTimeout(res, 900); };
        makeDraggable(c, {
          onMove: (cx, cy) => { const v = getVal(cx, cy); if (v === null) clearPreview(); else preview(v); },
          onEnd: clearPreview,
          onDrop: (cx, cy) => {
            const v = getVal(cx, cy);
            if (v === null) return false;
            if (v === it.v) { hn.reset(); api.praise(); done(); return true; }
            hn.wrong(); return false;
          }
        });
      });
    });
  }

  async function run() {
    /* ---------- 1. 溫度計（鉛垂數線） ---------- */
    api.phase('play');
    let svg = S('svg', { viewBox: '0 0 560 640', class: 'stage-svg', role: 'img', 'aria-label': '溫度計' }, api.stage);
    S('text', { x: 200, y: 26, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 900, fill: INK, text: '°C' }, svg);
    S('rect', { x: 184, y: 36, width: 32, height: 540, rx: 16, fill: '#fff', stroke: INK, 'stroke-width': 4 }, svg);
    S('circle', { cx: 200, cy: 594, r: 30, fill: '#ff6b6b', stroke: INK, 'stroke-width': 4 }, svg);
    S('rect', { x: 193, y: 540, width: 14, height: 40, fill: '#ff6b6b' }, svg);
    const vl = vNumberLine(svg, { min: -10, max: 10, x: 200, y0: 60, y1: 540, label: v => v % 2 === 0 ? fmtU(v) : '', side: 'left', fs: 20, arrows: false });
    const pv = S('g', { opacity: 0 }, svg);
    S('path', { d: 'M222 0 l26 -12 v24 z', fill: '#ffe066', stroke: INK, 'stroke-width': 2.5 }, pv);
    const pvT = S('text', { x: 254, y: 8, 'font-size': 22, 'font-weight': 900, fill: INK }, pv);
    const flags = S('g', {}, svg);
    const panel = api.panel('城市溫度卡（拖到溫度計上）');
    const box = H('div', { class: 'cards' }, panel);
    const items = D.cities.map(c => ({ ...c, v: c.t }));
    api.say('今天各城市的氣溫不同。把溫度卡<b>拖到溫度計</b>上正確的位置。');
    const placedV = [];
    await dragToLine({
      items, cardsBox: box, label: cityTxt,
      getVal: (cx, cy) => { const p = svgPoint(svg, cx, cy); if (p.x < 90 || p.x > 560 || p.y < 40 || p.y > 560) return null; const v = vl.vOf(p.y); return v < -10 || v > 10 ? null : v; },
      preview: v => { pv.setAttribute('transform', `translate(0 ${vl.yOf(v)})`); pv.setAttribute('opacity', 1); pvT.textContent = fmtU(v) + '°C'; },
      clearPreview: () => pv.setAttribute('opacity', 0),
      place: it => {
        const y = vl.yOf(it.v);
        // 避免標籤重疊：向右錯開
        const off = placedV.filter(v => Math.abs(v - it.v) < 2).length * 150; placedV.push(it.v);
        S('line', { x1: 216, y1: y, x2: 290 + off, y2: y, stroke: INK, 'stroke-width': 3 }, flags);
        S('circle', { cx: 216, cy: y, r: 6, fill: INK }, flags);
        S('rect', { x: 290 + off, y: y - 18, width: 142, height: 36, rx: 8, fill: '#fff9db', stroke: INK, 'stroke-width': 2.5 }, flags);
        S('text', { x: 361 + off, y: y + 8, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 800, fill: INK, text: cityTxt(it) }, flags);
      },
      hintsOf: it => hints(it, true),
      targetEl: it => S('rect', { x: 200, y: vl.yOf(it.v) - 2, width: 4, height: 4, opacity: 0 }, svg)
    });
    api.phase('observe');
    const coldest = D.cities.reduce((a, b) => b.t < a.t ? b : a);
    await api.ask('哪個城市<b>最冷</b>？', D.cities.map(c => c.name), D.cities.indexOf(coldest),
      ['看看哪張卡在溫度計<b>最下面</b>。', '溫度計愈下面，溫度愈低。'], `${coldest.name} ${fmtU(coldest.t)}°C 在最下面。`);
    await api.ask('在溫度計上，愈<b>上面</b>的數……', ['愈大', '愈小'], 0, ['比較 ' + fmtU(3) + '°C 和 ' + fmtU(-8) + '°C，哪個較暖？', '暖的溫度數值較大，在上面。']);

    /* ---------- 2. 水平數線 ---------- */
    api.phase('play');
    api.stage.innerHTML = ''; panel.remove();
    svg = S('svg', { viewBox: '0 0 720 330', class: 'stage-svg', role: 'img', 'aria-label': '水平數線' }, api.stage);
    let hl = hNumberLine(svg, { min: -10, max: 10, x0: 40, x1: 680, y: 220, fs: 20 });
    const pv2 = S('g', { opacity: 0 }, svg);
    S('path', { d: 'M0 -14 l-12 -24 h24 z', fill: '#ffe066', stroke: INK, 'stroke-width': 2.5 }, pv2);
    const pv2T = S('text', { x: 0, y: -46, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 900, fill: INK }, pv2);
    const marks = S('g', {}, svg);
    const panel2 = api.panel('把同一組卡放到<b>水平數線</b>上');
    const box2 = H('div', { class: 'cards' }, panel2);
    api.say('溫度計「打橫」放，就變成<b>水平數線</b>。把卡拖到數線上。');
    let row = 0;
    await dragToLine({
      items, cardsBox: box2, label: cityTxt,
      getVal: (cx, cy) => { const p = svgPoint(svg, cx, cy); if (p.y < 40 || p.y > 300 || p.x < 20 || p.x > 700) return null; const v = hl.vOf(p.x); return v < -10 || v > 10 ? null : v; },
      preview: v => { pv2.setAttribute('transform', `translate(${hl.xOf(v)} 220)`); pv2.setAttribute('opacity', 1); pv2T.textContent = fmtU(v); },
      clearPreview: () => pv2.setAttribute('opacity', 0),
      place: it => {
        const x = hl.xOf(it.v), ly = 150 - (row++ % 2) * 52;
        S('circle', { cx: x, cy: 220, r: 9, fill: INK }, marks);
        S('line', { x1: x, y1: 211, x2: x, y2: ly + 14, stroke: INK, 'stroke-width': 2 }, marks);
        S('rect', { x: x - 58, y: ly - 22, width: 116, height: 36, rx: 8, fill: '#fff9db', stroke: INK, 'stroke-width': 2.5 }, marks);
        S('text', { x: x, y: ly + 4, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 800, fill: INK, text: cityTxt(it) }, marks);
      },
      hintsOf: it => hints(it, false),
      targetEl: it => S('rect', { x: hl.xOf(it.v) - 2, y: 216, width: 4, height: 4, opacity: 0 }, svg)
    });
    api.phase('observe');
    await api.ask('在水平數線上，愈<b>右邊</b>的數……', ['愈大', '愈小'], 0, ['溫度計愈上面愈大，打橫後「上面」變成哪一邊？', '最暖的東京在最右邊。']);
    /* 預測：哪個較大？ */
    for (const [a, b] of D.compare) {
      api.phase('predict');
      const big = Math.max(a, b), small = Math.min(a, b);
      await api.ask(`預測一下：<b>${fmtU(a)}</b> 和 <b>${fmtU(b)}</b>，哪個<b>較大</b>？`, [fmtU(a), fmtU(b)], a > b ? 0 : 1,
        [`想想溫度：${fmtU(a)}°C 和 ${fmtU(b)}°C，哪個較暖？`, '在數線上，較大的數在<b>較右邊</b>。']);
      api.phase('verify');
      const v = S('g', {}, svg);
      const mk = (n, shape) => {
        const x = hl.xOf(n);
        if (shape === 'tri') S('path', { d: `M${x} 232 l-12 24 h24 z`, fill: '#74c0fc', stroke: INK, 'stroke-width': 2.5 }, v);
        else S('rect', { x: x - 11, y: 234, width: 22, height: 22, fill: '#ffa8a8', stroke: INK, 'stroke-width': 2.5 }, v);
      };
      mk(a, 'tri'); mk(b, 'sq');
      S('path', { d: `M${hl.xOf(small)} 290 H${hl.xOf(big) - 6}`, stroke: INK, 'stroke-width': 4 }, v);
      S('path', { d: `M${hl.xOf(big)} 290 l-14 -8 v16 z`, fill: INK }, v);
      S('text', { x: (hl.xOf(small) + hl.xOf(big)) / 2, y: 320, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 900, fill: INK, text: '向右 → 較大' }, v);
      api.say(`看數線：${fmtU(big)} 在 ${fmtU(small)} 的<b>右邊</b>，所以 <b>${fmtU(big)} &gt; ${fmtU(small)}</b>。` +
        (big < 0 ? `${fmtU(small)} 離 0 較遠，數值反而較小！` : ''));
      await api.next();
      v.remove();
    }

    /* ---------- 3. 相反數配對 ---------- */
    api.phase('play');
    api.stage.innerHTML = ''; panel2.remove();
    svg = S('svg', { viewBox: '0 0 720 340', class: 'stage-svg', role: 'img', 'aria-label': '相反數配對' }, api.stage);
    hl = hNumberLine(svg, { min: -8, max: 8, x0: 40, x1: 680, y: 250, fs: 22 });
    const pv3 = S('g', { opacity: 0 }, svg);
    S('path', { d: 'M0 -14 l-12 -24 h24 z', fill: '#ffe066', stroke: INK, 'stroke-width': 2.5 }, pv3);
    const brackets = S('g', {}, svg), boxes = S('g', {}, svg);
    const placed = {}; let pairs = 0;
    const drawBox = (v) => {
      const x = hl.xOf(v);
      const g = S('g', {}, boxes);
      S('circle', { cx: x, cy: 250, r: 8, fill: INK }, g);
      const r = S('rect', { x: x - 24, y: 196, width: 48, height: 36, rx: 8, fill: '#fff', stroke: INK, 'stroke-width': 2.5 }, g);
      S('text', { x, y: 222, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 900, fill: INK, text: fmtU(v) }, g);
      placed[v] = { g, r };
    };
    /** 兩數離 0 一樣遠 → 一起發光 + 括號 + ★ */
    const glow = async (v) => {
      const a = Math.abs(v), lvl = pairs++;
      const yb = 176 - lvl * 40;
      [a, -a].forEach(n => {
        placed[n].r.setAttribute('stroke-width', 5); placed[n].r.setAttribute('fill', '#ffe066');
        S('text', { x: hl.xOf(n), y: 190, 'text-anchor': 'middle', 'font-size': 18, fill: INK, text: '★' }, placed[n].g);
      });
      const x0 = hl.xOf(0);
      [[-a, 1], [a, -1]].forEach(([n]) => {
        const x = hl.xOf(n);
        S('path', { d: `M${x} ${yb + 10} V${yb} H${x0} V${yb + 10}`, fill: 'none', stroke: INK, 'stroke-width': 3 }, brackets);
        S('text', { x: (x + x0) / 2, y: yb - 6, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 800, fill: INK, text: `${a} 格` }, brackets);
      });
      S('text', { x: x0, y: yb - 6, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 900, fill: INK, text: '⇔' }, brackets);
      Sfx.play('glow');
      api.say(`<b>${fmtU(-a)}</b> 和 <b>${fmtU(a)}</b> 在 0 的兩邊，離 0 都是 ${a} 格，它們一起發光了！★`);
    };
    const panel3 = api.panel('數字卡（拖到數線上）');
    const box3 = H('div', { class: 'cards' }, panel3);
    api.say('把數字卡拖到數線上，看看會發生什麼事！');
    await dragToLine({
      items: D.oppCards.map(v => ({ v, t: v, name: '' })), cardsBox: box3, label: it => fmtU(it.v),
      getVal: (cx, cy) => { const p = svgPoint(svg, cx, cy); if (p.y < 40 || p.y > 320 || p.x < 20 || p.x > 700) return null; const v = hl.vOf(p.x); return v < -8 || v > 8 ? null : v; },
      preview: v => { pv3.setAttribute('transform', `translate(${hl.xOf(v)} 250)`); pv3.setAttribute('opacity', 1); },
      clearPreview: () => pv3.setAttribute('opacity', 0),
      place: it => { drawBox(it.v); if (it.v !== 0 && placed[-it.v]) glow(it.v); },
      hintsOf: it => [`找數線上寫着 ${fmtU(it.v)} 的刻度。`, it.v < 0 ? `負數在 0 的左邊，由 0 向左數 ${-it.v} 格。` : `正數在 0 的右邊，由 0 向右數 ${it.v} 格。`],
      targetEl: it => S('rect', { x: hl.xOf(it.v) - 2, y: 246, width: 4, height: 4, opacity: 0 }, svg)
    });
    /* 預測伙伴的位置 */
    const flag = makeFlag(svg, false);
    const hit = S('rect', { x: 10, y: 60, width: 700, height: 270, fill: 'transparent' }, svg);
    let picking = false;
    svgPicker(svg, hit, p => { const v = hl.vOf(p.x); return Math.max(-8, Math.min(8, v)); }, v => { flag.set(v, hl.xOf(v), 250); Sfx.play('move'); }, () => picking);
    for (const w of D.oppPredict) {
      const s0 = -w;
      api.phase('predict');
      if (!placed[s0]) drawBox(s0);
      api.say(`<b>${fmtU(s0)}</b> 還沒有伙伴。它的伙伴應該在哪裏？在數線上<b>點一下</b>（可拖動旗子），再按「確定」。`);
      picking = true; flag.hide();
      const hn = api.hinter([`伙伴要在 0 的<b>另一邊</b>。`, `${fmtU(s0)} 離 0 有 ${Math.abs(s0)} 格。伙伴在 0 的另一邊，也離 0 ${Math.abs(s0)} 格。`]);
      await api.p(res => {
        const ask = () => {
          api.clearOpts();
          const b = api.button('確定 ✔', () => {
            if (flag.value === null) { api.say('先在數線上點一下，放好旗子。'); return; }
            if (flag.value === w) { res(); return; }
            if (hn.count >= 2) { hn.wrong(); flag.set(w, hl.xOf(w), 250); setTimeout(res, 1400); return; }
            hn.wrong();
          }, 'pri', $('#lvOpts'));
        };
        ask();
      });
      picking = false; api.clearOpts();
      api.phase('verify');
      // 驗證動畫：由 s0 經 0 跳到 w
      const dot = S('circle', { r: 10, fill: '#ffe066', stroke: INK, 'stroke-width': 3 }, svg);
      const xa = hl.xOf(s0), xb = hl.xOf(w);
      await api.tween(1000, t => { dot.setAttribute('cx', xa + (xb - xa) * t); dot.setAttribute('cy', 250 - Math.sin(Math.PI * t) * 120); });
      dot.remove(); flag.hide();
      drawBox(w); await glow(w);
      await api.wait(1800);
    }
    api.say('你找到了所有伙伴！');
    await api.wait(900);
    api.complete();
  }
  run();
};

/* =================================================================
   第 3 關：熱氣球加減
   熱氣 = +1（令熱氣球上升），沙包 = −1（令熱氣球下降）
   玩 → 觀察 → 比較「拿走沙包」與「加入熱氣」→ 預測 → 驗證
   ================================================================= */
LEVEL_FUNCS.d3 = function (api, D) {
  const MAXH = D.maxH, MAXB = 12;
  const VW = 640, VH = 760, X = 110, Y0 = 180, Y1 = 660;
  let svg, vl, bal, hotG, sandG, ptr, ptrT, flag;
  let hot = D.start.hot, sand = D.start.sand, n = 1, busy = false;
  let actBtns = {}, countBtns = [], table, info, required = null, onAct = null, tried = new Set();
  const h = () => hot - sand;
  const ACT = {
    addHot:  { label: k => `加入 ${k} 個熱氣`, op: '+', b: k => k,  dh: k => k,  dhot: k => k,  dsand: () => 0 },
    addSand: { label: k => `加入 ${k} 個沙包`, op: '+', b: k => -k, dh: k => -k, dhot: () => 0, dsand: k => k },
    remHot:  { label: k => `拿走 ${k} 個熱氣`, op: MINUS, b: k => k,  dh: k => -k, dhot: k => -k, dsand: () => 0 },
    remSand: { label: k => `拿走 ${k} 個沙包`, op: MINUS, b: k => -k, dh: k => k,  dhot: () => 0, dsand: k => -k }
  };
  const expr = (h0, act, k) => `${par(h0)} ${ACT[act].op} ${par(ACT[act].b(k))}`;

  function build() {
    svg = S('svg', { viewBox: `0 0 ${VW} ${VH}`, class: 'stage-svg', role: 'img', 'aria-label': '熱氣球' }, api.stage);
    S('rect', { x: 0, y: 0, width: VW, height: VH, fill: '#e7f5ff' }, svg);
    [[420, 120], [560, 300], [300, 520]].forEach(([x, y]) => S('path', { d: `M${x} ${y} q20 -26 46 -6 q26 -16 40 8 q24 4 10 24 h-90 q-24 -8 -6 -26z`, fill: '#fff', stroke: '#a5d8ff', 'stroke-width': 3 }, svg));
    S('text', { x: X, y: 30, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 800, fill: INK, text: '高度' }, svg);
    vl = vNumberLine(svg, { min: -MAXH, max: MAXH, x: X, y0: Y0, y1: Y1, label: fmt, side: 'left', fs: 20 });
    ptr = S('line', { x1: X + 10, x2: 320, stroke: INK, 'stroke-width': 3, 'stroke-dasharray': '8 6' }, svg);
    bal = S('g', {}, svg);
    S('path', { d: 'M310 -100 L340 -10 M410 -100 L380 -10', stroke: INK, 'stroke-width': 3 }, bal);
    S('circle', { cx: 360, cy: -150, r: 70, fill: '#ffc9c9', stroke: INK, 'stroke-width': 4 }, bal);
    S('path', { d: 'M360 -220 Q330 -150 360 -80 M360 -220 Q390 -150 360 -80', fill: 'none', stroke: INK, 'stroke-width': 2, opacity: .5 }, bal);
    S('rect', { x: 330, y: -14, width: 60, height: 28, rx: 4, fill: '#d9a066', stroke: INK, 'stroke-width': 3 }, bal);
    hotG = S('g', {}, bal); sandG = S('g', {}, bal);
    ptrT = S('text', { x: 400, y: 8, 'font-size': 24, 'font-weight': 900, fill: INK }, bal);
    flag = makeFlag(svg, true);
    drawBlocks(); place(h());
  }
  /** 畫熱氣（方形 ▲+1）和沙包（圓角袋 ▼−1）；形狀和符號都不同，不只靠顏色 */
  function drawBlocks() {
    hotG.innerHTML = ''; sandG.innerHTML = '';
    for (let i = 0; i < hot; i++) {
      const x = 322 + (i % 4) * 20, y = -192 + Math.floor(i / 4) * 22;
      S('rect', { x, y, width: 18, height: 18, fill: '#ff922b', stroke: INK, 'stroke-width': 2 }, hotG);
      S('text', { x: x + 9, y: y + 15, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 900, fill: INK, text: '+' }, hotG);
    }
    for (let i = 0; i < sand; i++) {
      const x = 322 + (i % 4) * 20, y = 20 + Math.floor(i / 4) * 24;
      S('path', { d: `M${x + 9} ${y} v4`, stroke: INK, 'stroke-width': 2 }, sandG);
      S('rect', { x, y: y + 4, width: 18, height: 18, rx: 7, fill: '#a9805c', stroke: INK, 'stroke-width': 2 }, sandG);
      S('text', { x: x + 9, y: y + 19, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 900, fill: '#fff', text: MINUS }, sandG);
    }
  }
  function place(hh) {
    const y = vl.yOf(hh);
    bal.setAttribute('transform', `translate(0 ${y})`);
    ptr.setAttribute('y1', y); ptr.setAttribute('y2', y);
    ptrT.textContent = '';
    updInfo();
  }
  function updInfo() {
    if (info) info.innerHTML = `熱氣（▲ +1）：<b>${hot}</b> 個　沙包（▼ ${MINUS}1）：<b>${sand}</b> 個<br><span class="eq">高度：${fmt(h())}</span>`;
  }
  async function animateTo(h0, h1) {
    const a = vl.yOf(h0), b = vl.yOf(h1);
    Sfx.play('whoosh');
    await api.tween(700, t => { const y = a + (b - a) * t; bal.setAttribute('transform', `translate(0 ${y})`); ptr.setAttribute('y1', y); ptr.setAttribute('y2', y); });
  }
  /** 執行動作：更新方塊 → 熱氣球升降 → 寫入記錄表 */
  async function doAct(act, k) {
    const A = ACT[act], h0 = h();
    const nh = hot + A.dhot(k), ns = sand + A.dsand(k);
    if (nh < 0) { Sfx.play('soft'); api.say('籃裏沒有那麼多熱氣可以拿走呀！'); return false; }
    if (ns < 0) { Sfx.play('soft'); api.say('沒有那麼多沙包可以拿走呀！'); return false; }
    if (nh > MAXB || ns > MAXB) { Sfx.play('soft'); api.say('放不下那麼多了！試試拿走一些。'); return false; }
    if (Math.abs(nh - ns) > MAXH) { Sfx.play('soft'); api.say('太' + (nh - ns > 0 ? '高' : '低') + '了，數線不夠長！試試別的動作。'); return false; }
    busy = true; setBtns();
    hot = nh; sand = ns; drawBlocks(); Sfx.play(A.dh(k) > 0 ? 'tap' : 'drop');
    await animateTo(h0, h());
    updInfo();
    table.add([fmt(h0), A.label(k), expr(h0, act, k), fmt(h())], [3]);
    busy = false; setBtns();
    return true;
  }
  function setBtns(off) {
    Object.values(actBtns).forEach(b => b.disabled = !!off || busy || actLock);
    countBtns.forEach(b => b.disabled = !!off || busy || actLock);
  }
  let actLock = false;
  /** 依指定數量重新組合熱氣和沙包（不寫入記錄表） */
  async function resetTo(target, need = {}) {
    let s = Math.max(2, need.sand || 0), ho = target + s;
    if (ho < (need.hot || 0)) { const d = need.hot - ho; ho += d; s += d; }
    if (ho < 0) { s -= ho; ho = 0; }
    const h0 = h(); hot = ho; sand = s; drawBlocks();
    await animateTo(h0, h()); updInfo();
  }

  async function run() {
    build();
    const pc = api.panel('熱氣球');
    info = H('div', {}, pc);
    const cnt = H('div', { class: 'ctrls', style: 'align-items:center;margin:.3em 0' }, pc);
    H('span', { text: '數量：', style: 'font-weight:800' }, cnt);
    countBtns = [1, 2, 3, 4].map(k => {
      const b = api.button(String(k), () => { n = k; countBtns.forEach((x, i) => x.classList.toggle('on', i === k - 1)); }, k === 1 ? 'on' : '', cnt);
      return b;
    });
    const ctl = H('div', { class: 'ctrls' }, pc);
    const lab = { addHot: '加入熱氣 ▲', addSand: '加入沙包 ▼', remHot: '拿走熱氣', remSand: '拿走沙包' };
    Object.keys(ACT).forEach(a => {
      actBtns[a] = api.button(lab[a], async () => {
        if (busy) return;
        if (required && (required.act !== a || required.n !== n)) { onAct && onAct(false, a); return; }
        const ok = await doAct(a, n);
        if (ok) { tried.add(a); onAct && onAct(true, a); }
      }, '', ctl);
    });
    const rp = api.panel('自動記錄表');
    table = api.table(['原高度', '動作', '數式', '新高度'], rp);
    updInfo();

    /* --- 玩：四個按鈕都試一次 --- */
    api.phase('play');
    api.say('<b>熱氣</b>（▲ 方塊，+1）令熱氣球上升，<b>沙包</b>（▼ 圓袋，' + MINUS + '1）令它下降。四個按鈕都試一次吧！');
    const ckPanel = api.panel('試一試', pc);
    const ck = H('ul', { class: 'checklist' }, ckPanel);
    const li = {}; Object.keys(ACT).forEach(a => li[a] = H('li', { text: lab[a] }, ck));
    await api.p(res => {
      onAct = (ok, a) => { if (ok) { li[a].classList.add('ok'); if (tried.size === 4) { onAct = null; setTimeout(res, 600); } } };
    });
    ckPanel.remove();
    /* --- 觀察 --- */
    api.phase('observe');
    actLock = true; setBtns();
    await api.ask('看看記錄表。<b>加入</b>沙包，熱氣球會……', ['上升', '下降'], 1, ['找記錄表中「加入…沙包」那一行，新高度變大還是變小？', '沙包很重，是 ' + MINUS + '1。']);
    await api.ask('<b>拿走</b>沙包，熱氣球會……', ['上升', '下降'], 0, ['找記錄表中「拿走…沙包」那一行。', '少了重的沙包，熱氣球變輕了。']);

    /* --- 比較：拿走沙包 vs 加入熱氣 --- */
    const S0 = D.compareStart, K = D.compareN;
    const note = api.panel('比較');
    note.style.display = 'none';
    const pairsOf = [['remSand', 'addHot'], ['addSand', 'remHot']];
    for (let pi = 0; pi < pairsOf.length; pi++) {
      const results = [];
      for (const act of pairsOf[pi]) {
        api.phase('play');
        await resetTo(S0, { sand: K + 1, hot: K + 1 });
        required = { act, n: K };
        actLock = false; setBtns();
        api.say(`熱氣球回到 <b>${fmt(S0)}</b>。這次請你<b>${ACT[act].label(K)}</b>。（先揀「數量：${K}」）`);
        const hn = api.hinter([
          `先揀「數量：${K}」，再按「${lab[act]}」。`,
          `要按的是「${lab[act]}」，數量是 ${K}。`
        ], async () => { n = K; countBtns.forEach((x, i) => x.classList.toggle('on', i === K - 1)); actBtns[act].classList.add('on'); await api.wait(600); actBtns[act].classList.remove('on'); actBtns[act].click(); });
        await api.p(res => { onAct = (ok) => { if (ok) { onAct = null; res(); } else hn.wrong(); }; });
        required = null; actLock = true; setBtns();
        results.push({ act, end: h() });
        await api.wait(900);
      }
      api.phase('observe');
      const [r1, r2] = results;
      await api.ask(`比較記錄表最後兩行：「${ACT[r1.act].label(K)}」和「${ACT[r2.act].label(K)}」的新高度……`,
        ['結果一樣', '第一個較高', '第二個較高'], 0, ['看看記錄表最後兩行的「新高度」。', `兩次的新高度都是 ${fmt(r1.end)}。`]);
      note.style.display = '';
      H('div', { class: 'note', style: 'margin-bottom:.4em', html:
        `<div class="eq">${expr(S0, r1.act, K)} = ${fmt(r1.end)}</div><div style="text-align:center">⇕ 一樣</div><div class="eq">${expr(S0, r2.act, K)} = ${fmt(r2.end)}</div>
         <div>${pi === 0 ? '拿走沙包 ＝ 加入熱氣' : '加入沙包 ＝ 拿走熱氣'}</div>` }, note);
      api.say(pi === 0 ? `「拿走 ${K} 個沙包」和「加入 ${K} 個熱氣」效果一樣！看看「比較」框裏的數式。` : `「加入 ${K} 個沙包」和「拿走 ${K} 個熱氣」也一樣！`);
      await api.next();
    }

    /* --- 預測 → 驗證 --- */
    const hit = S('rect', { x: 0, y: Y0 - 30, width: 300, height: Y1 - Y0 + 60, fill: 'transparent' }, svg);
    let picking = false;
    svgPicker(svg, hit, p => Math.max(-MAXH, Math.min(MAXH, vl.vOf(p.y))), v => { flag.set(v, X + 10, vl.yOf(v)); Sfx.play('move'); }, () => picking);
    for (const pr of D.predictions) {
      api.phase('predict');
      const need = pr.act === 'remSand' ? { sand: pr.n } : pr.act === 'remHot' ? { hot: pr.n } : {};
      await resetTo(pr.start, need);
      const ans = pr.start + ACT[pr.act].dh(pr.n);
      flag.hide(); picking = true;
      api.say(`熱氣球在 <b>${fmt(pr.start)}</b>。如果<b>${ACT[pr.act].label(pr.n)}</b>，即是 <span class="eq">${expr(pr.start, pr.act, pr.n)}</span>，熱氣球會停在哪裏？在<b>數線上點一下</b>放旗子，再按「確定」。`);
      const up = ACT[pr.act].dh(1) > 0;
      const hn = api.hinter([
        `想想：${pr.act === 'remSand' ? '拿走沙包' : pr.act === 'addSand' ? '加入沙包' : pr.act === 'remHot' ? '拿走熱氣' : '加入熱氣'}，熱氣球會上升還是下降？`,
        pr.act === 'remSand' ? `拿走 ${pr.n} 個沙包，和加入 ${pr.n} 個熱氣一樣：由 ${fmt(pr.start)} 向<b>上</b>數 ${pr.n} 格。` :
          pr.act === 'addSand' ? `加入 ${pr.n} 個沙包，和拿走 ${pr.n} 個熱氣一樣：由 ${fmt(pr.start)} 向<b>下</b>數 ${pr.n} 格。` :
          `由 ${fmt(pr.start)} 向${up ? '上' : '下'}數 ${pr.n} 格。`
      ]);
      await api.p(res => {
        api.button('確定 ✔', () => {
          if (flag.value === null) { api.say('先在數線上點一下，放好旗子。'); return; }
          if (flag.value === ans) { res(); return; }
          if (hn.count >= 2) { hn.wrong(); flag.set(ans, X + 10, vl.yOf(ans)); setTimeout(res, 1500); return; }
          hn.wrong();
        }, 'pri', $('#lvOpts'));
      });
      picking = false; api.clearOpts();
      api.phase('verify');
      api.say('看看熱氣球會不會飛到你的旗子那裏……');
      await api.wait(500);
      await doAct(pr.act, pr.n);
      api.praise(`<span class="eq">${expr(pr.start, pr.act, pr.n)} = ${fmt(ans)}</span>`);
      await api.wait(2200);
    }
    flag.hide();
    api.complete();
  }
  run();
};

/* =================================================================
   第 4 關：乘法規律階梯
   3 × 3、3 × 2…… 看出「每次少 3」→ 預測 3 × (−1)……
   (−3) × 3…… 看出「每次多 3」→ 預測 (−3) × (−1)……
   最後：把算式卡分到「積是正數」或「積是負數」籃子
   ================================================================= */
LEVEL_FUNCS.d4 = function (api, D) {
  const VW = 780, VH = 400, LY = 230;
  let svg, hl, jumps, dots, pat, flag;
  const nm = n => n < 0 ? `(${fmtU(n)})` : String(n);

  /** 畫一個跳躍弧形箭頭 */
  function arc(g, xa, xb, y, up = true, label = '') {
    const hgt = Math.min(70, Math.abs(xb - xa) * .55 + 18) * (up ? -1 : 1);
    S('path', { d: `M${xa} ${y} Q${(xa + xb) / 2} ${y + hgt * 2} ${xb} ${y}`, fill: 'none', stroke: INK, 'stroke-width': 3.5 }, g);
    const dir = xb > xa ? -1 : 1;
    S('path', { d: `M${xb} ${y} l${dir * 12} ${up ? -10 : 10} l${dir * 2} ${up ? 6 : -6} z`, fill: INK, stroke: INK, 'stroke-width': 3, 'stroke-linejoin': 'round' }, g);
    if (label) S('text', { x: (xa + xb) / 2, y: y + hgt + (up ? -6 : 22), 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 800, fill: INK, text: label }, g);
  }
  function build() {
    api.stage.innerHTML = '';
    svg = S('svg', { viewBox: `0 0 ${VW} ${VH}`, class: 'stage-svg', role: 'img', 'aria-label': '數線上的跳躍' }, api.stage);
    hl = hNumberLine(svg, { min: -10, max: 10, x0: 40, x1: 740, y: LY, fs: 20 });
    pat = S('g', {}, svg); jumps = S('g', {}, svg); dots = S('g', {}, svg);
    flag = makeFlag(svg, false);
  }
  function dot(v, label, strong) {
    const x = hl.xOf(v);
    S('circle', { cx: x, cy: LY, r: strong ? 10 : 7, fill: strong ? '#ffe066' : '#fff', stroke: INK, 'stroke-width': 3 }, dots);
    if (label) S('text', { x, y: LY - 18, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 800, fill: INK, text: label }, dots);
  }
  /** a × k：k 次跳躍，每次 a */
  async function showJumps(a, k) {
    jumps.innerHTML = '';
    if (k === 0) { S('text', { x: hl.xOf(0), y: LY - 30, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 800, fill: INK, text: '跳 0 次，留在 0' }, jumps); return; }
    for (let i = 0; i < k; i++) {
      arc(jumps, hl.xOf(a * i), hl.xOf(a * (i + 1)), LY, true, i === 0 ? `每次 ${fmtU(a)}` : '');
      Sfx.play('move');
      await api.wait(380);
    }
  }

  async function ladder(L, idx) {
    const A = nm(L.a), step = Math.abs(L.a), down = L.a > 0;
    build();
    const rp = api.panel(`階梯 ${idx + 1}：${A} × □`);
    const t = api.table(['算式', '積', '變化'], rp);
    api.phase('play');
    api.say(`這是 <b>${A} × □</b> 的階梯。按「下一級 ▶」，看看積在數線上跳到哪裏。`);
    let prev = null; const rows = [];
    for (const k of L.shown) {
      await api.next('下一級 ▶');
      const prod = L.a * k;
      await showJumps(L.a, k);
      dot(prod, `${A}×${k}`, true);
      rows.push(t.add([`${A} × ${k}`, fmtU(prod), '']));
      api.say(k === 0 ? `${A} × 0 = <b>0</b>` : `${A} × ${k}：跳 ${k} 次，每次 ${fmtU(L.a)}，到達 <b>${fmtU(prod)}</b>。`);
      prev = prod;
    }
    await api.wait(800);
    jumps.innerHTML = '';
    api.phase('observe');
    await api.ask('看看記錄表的「積」：每往下一級，積怎樣變？', ['每次少 3', '每次多 3', '每次少 1'], down ? 0 : 1,
      [`比較 ${fmtU(L.a * L.shown[0])} 和 ${fmtU(L.a * L.shown[1])}。`, `由 ${fmtU(L.a * L.shown[0])} 到 ${fmtU(L.a * L.shown[1])}，在數線上向${down ? '左' : '右'}走了幾格？`]);
    // 補上「變化」欄 + 數線下方的規律箭頭
    rows.forEach((r, i) => { if (i > 0) { r.cells[2].textContent = down ? '少 3' : '多 3'; r.cells[2].classList.add('chg'); } });
    for (let i = 1; i < L.shown.length; i++) arc(pat, hl.xOf(L.a * L.shown[i - 1]), hl.xOf(L.a * L.shown[i]), LY + 50, false, down ? '少 3' : '多 3');
    api.say(`對！每往下一級，積${down ? '少' : '多'} 3。那麼過了 0 之後呢？`);
    await api.next('繼續往下 ▶');
    /* 預測 */
    let picking = false;
    const hit = S('rect', { x: 0, y: 40, width: VW, height: VH - 40, fill: 'transparent' }, svg);
    svgPicker(svg, hit, p => Math.max(-10, Math.min(10, hl.vOf(p.x))), v => { flag.set(v, hl.xOf(v), LY); Sfx.play('move'); }, () => picking);
    for (const k of L.predict) {
      api.phase('predict');
      const ans = L.a * k;
      flag.hide(); picking = true;
      api.say(`下一級是 <b>${A} × ${nm(k)}</b>。照着規律，積在哪裏？在數線上<b>點一下</b>（可拖動旗子），再按「確定」。`);
      const hn = api.hinter([
        `看看記錄表：每往下一級，積${down ? '少' : '多'} 3。`,
        `上一級的積是 ${fmtU(prev)}。在數線上由 ${fmtU(prev)} 向<b>${down ? '左' : '右'}</b>數 3 格。`
      ]);
      await api.p(res => {
        api.button('確定 ✔', () => {
          if (flag.value === null) { api.say('先在數線上點一下，放好旗子。'); return; }
          if (flag.value === ans) { res(); return; }
          if (hn.count >= 2) { hn.wrong(); flag.set(ans, hl.xOf(ans), LY); setTimeout(res, 1500); return; }
          hn.wrong();
        }, 'pri', $('#lvOpts'));
      });
      picking = false; api.clearOpts();
      api.phase('verify');
      arc(pat, hl.xOf(prev), hl.xOf(ans), LY + 50, false, down ? '少 3' : '多 3');
      Sfx.play('move');
      await api.wait(400);
      flag.hide();
      dot(ans, `${A}×${nm(k)}`, true);
      t.add([`${A} × ${nm(k)}`, fmtU(ans), down ? '少 3' : '多 3'], [1]);
      api.praise(`${A} × ${nm(k)} = <b>${fmtU(ans)}</b>`);
      prev = ans;
      await api.wait(1700);
    }
    api.phase('observe');
    await api.ask(`看看記錄表最後三行：${A} 乘以<b>負數</b>，積是……`, ['正數', '負數', '0'], down ? 1 : 0,
      ['看看最後三行的「積」有沒有「' + MINUS + '」號。', `例如 ${A} × (${MINUS}1) = ${fmtU(-L.a)}。`]);
    rp.querySelector('.rec-wrap').style.maxHeight = '22vh';
  }

  async function sortStage() {
    api.phase('predict');
    api.stage.innerHTML = '';
    const wrap = H('div', { style: 'width:100%;display:flex;flex-direction:column;gap:.8em;padding:.4em' }, api.stage);
    const deck = H('div', { class: 'cards', style: 'justify-content:center;min-height:60px' }, wrap);
    const row = H('div', { style: 'display:flex;gap:.8em;flex-wrap:wrap' }, wrap);
    const bPos = H('div', { class: 'basket', 'data-sign': '+' }, row);
    H('h4', { html: '<span style="font-size:1.6em">⊕</span><br>積是正數' }, bPos);
    const inPos = H('div', { class: 'cards' }, bPos);
    const bNeg = H('div', { class: 'basket', 'data-sign': '-', style: 'border-style:dotted' }, row);
    H('h4', { html: '<span style="font-size:1.6em">⊖</span><br>積是負數' }, bNeg);
    const inNeg = H('div', { class: 'cards' }, bNeg);
    api.say('最後挑戰！<b>不用計算</b>，只看正負號：把每張算式卡拖到正確的籃子。');
    let left = D.sortCards.length;
    await api.p(res => {
      D.sortCards.forEach(([a, b]) => {
        const pos = a * b > 0;
        const txt = `${par(a)} × ${par(b)}`;
        const c = H('div', { class: 'dcard', text: txt }, deck);
        const put = () => {
          c.classList.add('used');
          H('div', { class: 'dcard', text: `${txt} = ${fmt(a * b)}`, style: 'cursor:default;font-size:.9em' }, pos ? inPos : inNeg);
          Sfx.play('drop'); left--;
          if (left === 0) setTimeout(res, 1200);
        };
        const hn = api.hinter([
          '看看兩個數的正負號，是<b>相同</b>還是<b>不同</b>？',
          `${txt}：兩個數的正負號${(a > 0) === (b > 0) ? '相同' : '不同'}。回看階梯：3 × (${MINUS}2) 是負數，(${MINUS}3) × (${MINUS}2) 是正數。`
        ], async () => { c.classList.add('demo'); await api.wait(500); c.classList.remove('demo'); await flyCard(c, pos ? bPos : bNeg); put(); });
        makeDraggable(c, {
          onMove: (cx, cy) => { bPos.classList.toggle('over', hitEl(bPos, cx, cy)); bNeg.classList.toggle('over', hitEl(bNeg, cx, cy)); },
          onEnd: () => { bPos.classList.remove('over'); bNeg.classList.remove('over'); },
          onDrop: (cx, cy) => {
            const tgt = hitEl(bPos, cx, cy) ? '+' : hitEl(bNeg, cx, cy) ? '-' : null;
            if (!tgt) return false;
            if ((tgt === '+') === pos) { hn.reset(); api.praise(); put(); return true; }
            hn.wrong(); return false;
          }
        });
      });
    });
    api.phase('verify');
    api.say('看看兩個籃子：正負號<b>相同</b>的都在「積是正數」；正負號<b>不同</b>的都在「積是負數」！');
    await api.next('完成 ★');
  }

  async function run() {
    for (let i = 0; i < D.ladders.length; i++) {
      await ladder(D.ladders[i], i);
      if (i < D.ladders.length - 1) {
        api.say('換一條階梯：這次是 <b>(' + MINUS + '3) × □</b>。');
        await api.next('下一條階梯 ▶');
      }
    }
    await sortStage();
    api.complete();
  }
  run();
};


/* =================================================================
   [K1] 坐標島 4 關
   ================================================================= */
/** 坐標寫法：(3, −2) */
function co(x, y) { return `(${fmtU(x)}, ${fmtU(y)})`; }
/** 坐標寫法，把有改變的數字用粗體 + 底線突出（chx / chy 為 true 時） */
function coHL(x, y, chx, chy) {
  const w = (v, c) => c ? `<span class="hl">${fmtU(v)}</span>` : fmtU(v);
  return `(${w(x, chx)}, ${w(y, chy)})`;
}
const sgn = v => v > 0 ? '+' : v < 0 ? MINUS : '0';
const sgnWord = v => v > 0 ? '正數' : v < 0 ? '負數' : '0';

/* ---------- 共用：直角坐標平面 ---------- */
function coordPlane(svg, { R, u, cx, cy, fs = 18, parent }) {
  const X = x => cx + x * u, Y = y => cy - y * u;
  const g = S('g', {}, parent || svg);
  for (let i = -R; i <= R; i++) {
    S('line', { x1: X(i), y1: Y(R), x2: X(i), y2: Y(-R), stroke: '#b9c7d6', 'stroke-width': 1.5 }, g);
    S('line', { x1: X(-R), y1: Y(i), x2: X(R), y2: Y(i), stroke: '#b9c7d6', 'stroke-width': 1.5 }, g);
  }
  S('line', { x1: X(-R) - 14, y1: Y(0), x2: X(R) + 16, y2: Y(0), stroke: INK, 'stroke-width': 3.5 }, g);
  S('path', { d: `M${X(R) + 28} ${Y(0)} l-14 -7 v14 z`, fill: INK }, g);
  S('line', { x1: X(0), y1: Y(-R) + 14, x2: X(0), y2: Y(R) - 16, stroke: INK, 'stroke-width': 3.5 }, g);
  S('path', { d: `M${X(0)} ${Y(R) - 28} l-7 14 h14 z`, fill: INK }, g);
  S('text', { x: X(R) + 22, y: Y(0) + 26, 'font-size': fs + 6, 'font-style': 'italic', 'font-weight': 800, fill: INK, text: 'x' }, g);
  S('text', { x: X(0) + 12, y: Y(R) - 14, 'font-size': fs + 6, 'font-style': 'italic', 'font-weight': 800, fill: INK, text: 'y' }, g);
  for (let i = -R; i <= R; i++) {
    if (i === 0) continue;
    S('text', { x: X(i), y: Y(0) + fs + 4, 'text-anchor': 'middle', 'font-size': fs, 'font-weight': 600, fill: INK, text: fmtU(i) }, g);
    S('text', { x: X(0) - 7, y: Y(i) + fs * .35, 'text-anchor': 'end', 'font-size': fs, 'font-weight': 600, fill: INK, text: fmtU(i) }, g);
  }
  S('text', { x: X(0) - 7, y: Y(0) + fs + 4, 'text-anchor': 'end', 'font-size': fs, 'font-weight': 800, 'font-style': 'italic', fill: INK, text: 'O' }, g);
  return {
    X, Y, R, u, g,
    /** 螢幕座標 → 最近的交點 {x, y, d(離交點距離，單位格), ok(在範圍內)} */
    snap(clx, cly) {
      const p = svgPoint(svg, clx, cly);
      const fx = (p.x - cx) / u, fy = (cy - p.y) / u, x = Math.round(fx), y = Math.round(fy);
      return { x, y, d: Math.hypot(fx - x, fy - y), ok: Math.abs(x) <= R && Math.abs(y) <= R };
    }
  };
}
/** 在 SVG 上加一層透明的點擊區 */
function tapLayer(svg, w, h, fn) {
  const r = S('rect', { x: 0, y: 0, width: w, height: h, fill: 'transparent', style: 'cursor:pointer' }, svg);
  r.addEventListener('pointerdown', e => { e.preventDefault(); fn(e); });
  return r;
}
/** 預測後按「確定」：答對 resolve(true)；第三次錯會示範並 resolve(false) */
function confirmLoop(api, hn, getVal, ans, showAns, emptyMsg = '先在圖上點一下，放好你的預測。') {
  const same = (a, b) => Array.isArray(a) ? a.every((v, i) => v === b[i]) : a === b;
  return api.p(res => {
    api.clearOpts();
    api.button('確定 ✔', () => {
      const v = getVal();
      if (v === null || v === undefined) { api.say(emptyMsg); return; }
      if (same(v, ans)) { api.clearOpts(); res(true); return; }
      if (hn.count >= 2) { hn.wrong(); showAns(); api.clearOpts(); setTimeout(() => res(false), 1600); return; }
      hn.wrong();
    }, 'pri', $('#lvOpts'));
  });
}
/** 小寶箱 / 標記 */
function drawChest(g, x, y, label) {
  const c = S('g', { transform: `translate(${x} ${y})` }, g);
  S('rect', { x: -16, y: -12, width: 32, height: 22, rx: 3, fill: '#ffd43b', stroke: INK, 'stroke-width': 3 }, c);
  S('path', { d: 'M-16 -12 q16 -14 32 0', fill: '#fab005', stroke: INK, 'stroke-width': 3 }, c);
  S('rect', { x: -4, y: -6, width: 8, height: 8, fill: INK }, c);
  if (label) {
    S('rect', { x: -38, y: -48, width: 76, height: 26, rx: 6, fill: '#fff', stroke: INK, 'stroke-width': 2 }, c);
    S('text', { x: 0, y: -29, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 900, fill: INK, text: label }, c);
  }
  return c;
}

/* =================================================================
   坐標島 第 1 關：尋寶遊戲
   玩：點交點猜寶藏，回饋「再向右／左／上／下」→ 觀察兩個數的意思
   → 預測：給坐標，點出寶藏（要點在交點上）→ 驗證：由 O 走過去
   ================================================================= */
LEVEL_FUNCS.c1 = function (api, D) {
  const R = 5, u = 46, C = 285, VW = 570;
  let svg, cp, marks, found, walkG, tapFn = null;
  function build() {
    svg = S('svg', { viewBox: `0 0 ${VW} ${VW}`, class: 'stage-svg', role: 'img', 'aria-label': '尋寶方格' }, api.stage);
    S('rect', { x: 0, y: 0, width: VW, height: VW, fill: '#fffdf3' }, svg);
    cp = coordPlane(svg, { R, u, cx: C, cy: C });
    walkG = S('g', {}, svg); marks = S('g', {}, svg); found = S('g', {}, svg);
    tapLayer(svg, VW, VW, e => { if (tapFn) tapFn(cp.snap(e.clientX, e.clientY)); });
  }
  function guessMark(x, y) {
    const g = S('g', { transform: `translate(${cp.X(x)} ${cp.Y(y)})` }, marks);
    S('path', { d: 'M-9 -9 L9 9 M9 -9 L-9 9', stroke: INK, 'stroke-width': 4, 'stroke-linecap': 'round' }, g);
    S('text', { x: 12, y: -10, 'font-size': 15, 'font-weight': 800, fill: INK, text: co(x, y) }, g);
  }
  /** 驗證動畫：由原點先左右、後上下走到 (x, y) */
  async function walk(x, y) {
    walkG.innerHTML = '';
    const p = S('path', { d: `M${cp.X(0)} ${cp.Y(0)}`, fill: 'none', stroke: '#e8590c', 'stroke-width': 5, 'stroke-dasharray': '10 6' }, walkG);
    const dot = S('circle', { r: 11, fill: '#ffe066', stroke: INK, 'stroke-width': 3, cx: cp.X(0), cy: cp.Y(0) }, walkG);
    await api.tween(Math.max(300, Math.abs(x) * 220), t => { const cx = cp.X(x * t); dot.setAttribute('cx', cx); p.setAttribute('d', `M${cp.X(0)} ${cp.Y(0)} H${cx}`); });
    if (x !== 0) S('text', { x: cp.X(x / 2), y: cp.Y(0) + (y >= 0 ? 44 : -30), 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 900, fill: INK, text: `向${x > 0 ? '右' : '左'} ${Math.abs(x)} 格` }, walkG);
    await api.tween(Math.max(300, Math.abs(y) * 220), t => { const cy = cp.Y(y * t); dot.setAttribute('cy', cy); p.setAttribute('d', `M${cp.X(0)} ${cp.Y(0)} H${cp.X(x)} V${cy}`); });
    if (y !== 0) S('text', { x: cp.X(x) + (x >= 0 ? 12 : -12), y: cp.Y(y / 2) + 6, 'text-anchor': x >= 0 ? 'start' : 'end', 'font-size': 18, 'font-weight': 900, fill: INK, text: `向${y > 0 ? '上' : '下'} ${Math.abs(y)} 格` }, walkG);
    Sfx.play('drop');
  }

  async function run() {
    build();
    const table = api.table(['你點的位置', '回饋'], api.panel('自動記錄表'));
    /* --- 玩：猜寶藏 --- */
    api.phase('play');
    for (let ti = 0; ti < D.treasures.length; ti++) {
      const [tx, ty] = D.treasures[ti];
      api.say(ti === 0 ? '寶藏藏在方格紙上某個<b>線與線的交點</b>。點一下交點去找！我會告訴你方向。' : `再找第 ${ti + 1} 個寶藏！`);
      let tries = 0;
      await api.p(res => {
        tapFn = s => {
          if (!s.ok) return;
          tries++;
          if (s.x === tx && s.y === ty) {
            tapFn = null; marks.innerHTML = '';
            drawChest(found, cp.X(tx), cp.Y(ty), co(tx, ty));
            table.add([co(tx, ty), '<b>找到了！★</b>']);
            api.praise(`寶藏在 <b>${co(tx, ty)}</b>！`);
            setTimeout(res, 1500); return;
          }
          const d = [];
          if (s.x < tx) d.push('再向右'); if (s.x > tx) d.push('再向左');
          if (s.y < ty) d.push('再向上'); if (s.y > ty) d.push('再向下');
          guessMark(s.x, s.y); Sfx.play('tap');
          table.add([co(s.x, s.y), d.join('、')]);
          api.say(`你點了 <b>${co(s.x, s.y)}</b>。寶藏要<b>${d.join('、')}</b>。` + (tries >= 4 ? '<br>小技巧：先把左右找對，再找上下。' : ''));
        };
      });
    }
    /* --- 觀察 --- */
    api.phase('observe');
    const [ax, ay] = D.treasures[0], [bx, by] = D.treasures[1];
    const lr = v => `向${v > 0 ? '右' : '左'} ${Math.abs(v)} 格`, ud = v => `向${v > 0 ? '上' : '下'} ${Math.abs(v)} 格`;
    await api.ask(`第一個寶藏在 <b>${co(ax, ay)}</b>。由中間的 <b>O</b> 點出發，第一個數 <b>${fmtU(ax)}</b> 表示……`, [lr(ax), ud(ax)], 0,
      ['看看寶箱在 O 的右邊還是上面。', `沿着橫線數一數：寶箱在 O 的${ax > 0 ? '右' : '左'}邊幾格？`]);
    await api.ask(`第二個數 <b>${fmtU(ay)}</b> 呢？`, [lr(ay), ud(ay)], 1, ['第一個數已經是左右了。', `寶箱在橫線的${ay > 0 ? '上面' : '下面'}幾格？`]);
    await walk(ax, ay);
    await api.ask(`第二個寶藏在 <b>${co(bx, by)}</b>。第一個數 <b>${fmtU(bx)}</b> 表示……`, [lr(bx), ud(bx)], 0,
      ['第一個數是左右還是上下？', `${MINUS} 號表示相反方向：不是向右，而是……`]);
    await walk(bx, by);
    api.say('原來：<b>第一個數管左右，第二個數管上下</b>！「' + MINUS + '」表示向左或向下。');
    await api.next();
    walkG.innerHTML = '';
    /* --- 預測 → 驗證：給坐標，點出位置 --- */
    for (const [tx, ty] of D.targets) {
      api.phase('predict');
