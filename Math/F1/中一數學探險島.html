      api.phase('verify');
      await walk(tx, ty);
      drawChest(found, cp.X(tx), cp.Y(ty), co(tx, ty));
      table.add([co(tx, ty), '<b>找到了！★</b>']);
      api.praise(`由 O 出發，先左右，後上下，就到 <b>${co(tx, ty)}</b>。`);
      await api.wait(1800);
      walkG.innerHTML = '';
    }
    api.complete();
  }
  run();
};

/* =================================================================
   坐標島 第 2 關：四間房（象限）
   玩：拖動點走遍四間房和軸上 → 觀察正負號 → 預測：點卡拖入籃子 → 驗證
   ================================================================= */
LEVEL_FUNCS.c2 = function (api, D) {
  const R = 5, u = 46, C = 285, VW = 570;
  const ROMAN = ['', 'I', 'II', 'III', 'IV'];
  const SIGN = ['', '(+, +)', `(${MINUS}, +)`, `(${MINUS}, ${MINUS})`, `(+, ${MINUS})`];
  const quad = (x, y) => x > 0 && y > 0 ? 1 : x < 0 && y > 0 ? 2 : x < 0 && y < 0 ? 3 : x > 0 && y < 0 ? 4 : 0;
  let svg, cp, rooms = {}, P, PT, pts, showSigns = true;

  function build() {
    svg = S('svg', { viewBox: `0 0 ${VW} ${VW}`, class: 'stage-svg', role: 'img', 'aria-label': '四個象限' }, api.stage);
    const defs = S('defs', {}, svg);
    const pats = [null,
      '<circle cx="5" cy="5" r="1.6" fill="#1d2b3a"/>',
      '<path d="M0 10 L10 0" stroke="#1d2b3a" stroke-width="1.3"/>',
      '<path d="M0 5 H10" stroke="#1d2b3a" stroke-width="1.3"/>',
      '<path d="M0 5 H10 M5 0 V10" stroke="#1d2b3a" stroke-width="1"/>'];
    for (let q = 1; q <= 4; q++) { const p = S('pattern', { id: 'qp' + q, width: 10, height: 10, patternUnits: 'userSpaceOnUse' }, defs); p.innerHTML = pats[q]; }
    const fills = ['', '#ffe8cc', '#d0ebff', '#d3f9d8', '#f3d9fa'];
    const X = x => C + x * u, Y = y => C - y * u;
    const box = { 1: [X(0), Y(R), R * u], 2: [X(-R), Y(R), R * u], 3: [X(-R), Y(0), R * u], 4: [X(0), Y(0), R * u] };
    for (let q = 1; q <= 4; q++) {
      const [x, y, s] = box[q];
      const g = S('g', {}, svg);
      const bg = S('rect', { x, y, width: s, height: s, fill: fills[q], opacity: .45 }, g);
      const pt = S('rect', { x, y, width: s, height: s, fill: `url(#qp${q})`, opacity: .12 }, g);
      const fr = S('rect', { x: x + 3, y: y + 3, width: s - 6, height: s - 6, fill: 'none', stroke: INK, 'stroke-width': 0 }, g);
      const tx = q === 1 || q === 4 ? x + s - 10 : x + 10, anc = q === 1 || q === 4 ? 'end' : 'start';
      const ty = q <= 2 ? y + 28 : y + s - 14;
      S('text', { x: tx, y: ty, 'text-anchor': anc, 'font-size': 22, 'font-weight': 900, fill: INK, text: '象限 ' + ROMAN[q] }, g);
      const sg = S('text', { x: x + s / 2, y: y + s * (q <= 2 ? .72 : .4) + 12, 'text-anchor': 'middle', 'font-size': 34, 'font-weight': 900, fill: INK, opacity: .9, text: '?' }, g);
      rooms[q] = { bg, pt, fr, sg, seen: false };
    }
    cp = coordPlane(svg, { R, u, cx: C, cy: C });
    pts = S('g', {}, svg);
    P = S('g', { opacity: 0 }, svg);
    S('circle', { r: 13, fill: '#ff6b6b', stroke: INK, 'stroke-width': 3 }, P);
    S('text', { x: 0, y: 6, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 900, fill: '#fff', text: 'P' }, P);
    PT = S('text', { 'font-size': 20, 'font-weight': 900, fill: INK, stroke: '#fff', 'stroke-width': 5, 'paint-order': 'stroke' }, svg);
  }
  function light(q) {
    for (let k = 1; k <= 4; k++) {
      const on = k === q;
      rooms[k].bg.setAttribute('opacity', on ? .95 : .45);
      rooms[k].pt.setAttribute('opacity', on ? .35 : .12);
      rooms[k].fr.setAttribute('stroke-width', on ? 6 : 0);
    }
    if (q && showSigns) { rooms[q].sg.textContent = SIGN[q]; rooms[q].seen = true; }
  }
  function placeP(x, y) {
    P.setAttribute('transform', `translate(${cp.X(x)} ${cp.Y(y)})`); P.setAttribute('opacity', 1);
    PT.setAttribute('x', cp.X(x) + 16); PT.setAttribute('y', cp.Y(y) - 14); PT.textContent = 'P' + co(x, y);
    light(quad(x, y));
  }

  async function run() {
    build();
    /* --- 玩：拖動 P 走遍四間房 --- */
    api.phase('play');
    const ck = H('ul', { class: 'checklist' }, api.panel('走一走'));
    const li = {}; [1, 2, 3, 4, 0].forEach(q => li[q] = H('li', { text: q ? '象限 ' + ROMAN[q] : '放在軸上' }, ck));
    const table = api.table(['P 的位置', '房間', '正負號'], api.panel('自動記錄表'));
    let px = D.start[0], py = D.start[1], last = null, dragging = false, moveOn = true;
    placeP(px, py);
    api.say('方格被 x 軸和 y 軸分成<b>四間房</b>。按住紅點 <b>P</b> 拖到不同的房間，也試試放在<b>軸上</b>！');
    const visited = new Set();
    let onCommit = null;
    const commit = async () => {
      const k = px + ',' + py; if (k === last) return; last = k;
      const q = quad(px, py);
      table.add([co(px, py), q ? '象限 ' + ROMAN[q] : '軸上', q ? `(${sgn(px)}, ${sgn(py)})` : '有一個是 0']);
      if (!q) {
        Sfx.play('soft');
        api.say('彈！P 在<b>軸上</b>，不在任何一間房裏面！');
        await api.tween(500, t => P.setAttribute('transform', `translate(${cp.X(px)} ${cp.Y(py) - Math.sin(Math.PI * t * 2) * 18}) scale(${1 + .3 * Math.sin(Math.PI * t)})`));
        placeP(px, py);
      } else { Sfx.play('glow'); api.say(`P 在<b>象限 ${ROMAN[q]}</b>，x 坐標是${sgnWord(px)}，y 坐標是${sgnWord(py)}。`); }
      visited.add(q); li[q].classList.add('ok');
      if (onCommit) onCommit();
    };
    const hit = tapLayer(svg, VW, VW, e => {
      if (!moveOn) return;
      dragging = true; try { hit.setPointerCapture(e.pointerId); } catch (err) {}
      mv(e);
    });
    const mv = e => { const s = cp.snap(e.clientX, e.clientY); if (!s.ok) return; if (s.x !== px || s.y !== py) { px = s.x; py = s.y; placeP(px, py); Sfx.play('move'); } };
    hit.addEventListener('pointermove', e => { if (dragging) mv(e); });
    const up = () => { if (dragging) { dragging = false; commit(); } };
    hit.addEventListener('pointerup', up); hit.addEventListener('pointercancel', up);
    await api.p(res => { onCommit = () => { if (visited.size >= 5) { onCommit = null; setTimeout(res, 1200); } }; });
    moveOn = false;
    /* --- 觀察 --- */
    api.phase('observe');
    await api.ask('看看記錄表。<b>象限 II</b> 裏的點，坐標的正負號是……', SIGN.slice(1), 1,
      ['找記錄表中「象限 II」那一行。', '象限 II 在 O 的左上方：向左是 ' + MINUS + '，向上是 +。']);
    await api.ask('<b>象限 IV</b> 呢？', SIGN.slice(1), 3, ['找記錄表中「象限 IV」那一行。', '象限 IV 在 O 的右下方。']);
    await api.ask(`點 <b>${co(0, 3)}</b> 在哪一間房？`, ['象限 I', '象限 II', '不屬於任何象限'], 2,
      ['x 坐標是 0，即是不用左右走……', '它剛好在 y 軸上，被「彈出」了。']);
    /* --- 預測：點卡入籃 --- */
    api.phase('predict');
    P.setAttribute('opacity', 0); PT.textContent = ''; light(0);
    showSigns = false; for (let q = 1; q <= 4; q++) rooms[q].sg.textContent = '?';
    api.side.innerHTML = '';
    const deckP = api.panel('點卡（拖到籃子）');
    const deck = H('div', { class: 'cards' }, deckP);
    const bp = api.panel('籃子');
    const grid = H('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:.4em' }, bp);
    const baskets = {};
    [2, 1, 3, 4, 0].forEach(q => {
      const b = H('div', { class: 'basket', style: `min-height:84px;padding:.3em;${q === 0 ? 'grid-column:1 / span 2;border-style:dotted' : ''}` }, grid);
      H('h4', { html: q ? '象限 ' + ROMAN[q] : '軸上（不屬於任何象限）' }, b);
      baskets[q] = { b, box: H('div', { class: 'cards', style: 'font-size:.8em' }, b) };
    });
    api.say('不用看方格，只看坐標的<b>正負號</b>：把每張點卡拖到正確的籃子！');
    let left = D.cards.length;
    await api.p(res => {
      D.cards.forEach(([x, y], i) => {
        const q = quad(x, y), name = String.fromCharCode(65 + i);
        const c = H('div', { class: 'dcard', text: `${name}${co(x, y)}` }, deck);
        const put = () => {
          c.classList.add('used'); Sfx.play('drop');
          H('div', { class: 'dcard', text: `${name}${co(x, y)}`, style: 'cursor:default;min-height:40px' }, baskets[q].box);
          // 驗證：點出現在方格上
          const g = S('g', {}, pts);
          S('circle', { cx: cp.X(x), cy: cp.Y(y), r: 9, fill: INK }, g);
          S('text', { x: cp.X(x) + 12, y: cp.Y(y) - 10, 'font-size': 18, 'font-weight': 900, fill: INK, stroke: '#fff', 'stroke-width': 4, 'paint-order': 'stroke', text: `${name}${co(x, y)}` }, g);
          light(q);
          left--; if (left === 0) setTimeout(res, 1300);
        };
        const hn = api.hinter([
          '看看 x 坐標和 y 坐標：是正數、負數，還是 0？',
          `${co(x, y)}：x 坐標是${sgnWord(x)}，y 坐標是${sgnWord(y)}。回看記錄表的正負號。`
        ], async () => { c.classList.add('demo'); await api.wait(500); c.classList.remove('demo'); await flyCard(c, baskets[q].b); put(); });
        makeDraggable(c, {
          onMove: (cx, cy) => Object.values(baskets).forEach(k => k.b.classList.toggle('over', hitEl(k.b, cx, cy))),
          onEnd: () => Object.values(baskets).forEach(k => k.b.classList.remove('over')),
          onDrop: (cx, cy) => {
            const tq = Object.keys(baskets).find(k => hitEl(baskets[k].b, cx, cy));
            if (tq === undefined) return false;
            if (+tq === q) { hn.reset(); api.praise(q ? `${name} 在象限 ${ROMAN[q]}。` : `${name} 在軸上。`); put(); return true; }
            hn.wrong(); return false;
          }
        });
      });
    });
    api.phase('verify');
    showSigns = true; for (let q = 1; q <= 4; q++) rooms[q].sg.textContent = SIGN[q];
    light(0);
    api.say('看看方格：每一點都落在你揀的房間，軸上的點不在任何房間裏！');
    await api.next('完成 ★');
    api.complete();
  }
  run();
};

/* =================================================================
   坐標島 第 3 關：機械人搬家（平移）
   玩：方向按鈕移動，收集電池 → 觀察哪個坐標改變 → 預測終點 → 驗證
   ================================================================= */
LEVEL_FUNCS.c3 = function (api, D) {
  const R = 5, u = 46, C = 285, VW = 570;
  const DIR = { 左: [-1, 0], 右: [1, 0], 上: [0, 1], 下: [0, -1] };
  let svg, cp, robot, bats, mk, rx = D.start[0], ry = D.start[1], busy = false, table, btns = [], onMove = null;

  function build() {
    svg = S('svg', { viewBox: `0 0 ${VW} ${VW}`, class: 'stage-svg', role: 'img', 'aria-label': '機械人方格' }, api.stage);
    S('rect', { x: 0, y: 0, width: VW, height: VW, fill: '#f8f9fa' }, svg);
    cp = coordPlane(svg, { R, u, cx: C, cy: C });
    bats = S('g', {}, svg); mk = S('g', {}, svg);
    robot = S('g', {}, svg);
    S('path', { d: 'M0 -26 V-34', stroke: INK, 'stroke-width': 3 }, robot);
    S('circle', { cx: 0, cy: -36, r: 4, fill: '#ff6b6b', stroke: INK, 'stroke-width': 2 }, robot);
    S('rect', { x: -18, y: -26, width: 36, height: 30, rx: 8, fill: '#74c0fc', stroke: INK, 'stroke-width': 3 }, robot);
    S('circle', { cx: -7, cy: -12, r: 4, fill: INK }, robot); S('circle', { cx: 7, cy: -12, r: 4, fill: INK }, robot);
    S('circle', { cx: 0, cy: 0, r: 6, fill: '#ffe066', stroke: INK, 'stroke-width': 2.5 }, robot);
    setRobot(rx, ry);
  }
  function setRobot(x, y) { robot.setAttribute('transform', `translate(${cp.X(x)} ${cp.Y(y)})`); }
  function drawBat(x, y) {
    const g = S('g', { transform: `translate(${cp.X(x)} ${cp.Y(y)})` }, bats);
    S('rect', { x: -10, y: -16, width: 20, height: 30, rx: 3, fill: '#8ce99a', stroke: INK, 'stroke-width': 2.5 }, g);
    S('rect', { x: -4, y: -20, width: 8, height: 4, fill: INK }, g);
    S('path', { d: 'M2 -10 L-4 0 H2 L-2 9', fill: 'none', stroke: INK, 'stroke-width': 2.5 }, g);
    return g;
  }
  async function step(dx, dy) {
    const x0 = rx, y0 = ry;
    if (Math.abs(rx + dx) > R || Math.abs(ry + dy) > R) { Sfx.play('soft'); api.say('到邊界了，不能再走！'); return false; }
    busy = true; Sfx.play('move');
    await api.tween(230, t => setRobot(x0 + dx * t, y0 + dy * t));
    rx += dx; ry += dy; busy = false;
    return true;
  }
  const dispEl = {};
  function upd() { dispEl.el.innerHTML = `機械人在 <span class="eq">${co(rx, ry)}</span>`; }

  async function run() {
    build();
    const pc = api.panel('控制台');
    dispEl.el = H('div', { style: 'text-align:center;margin-bottom:.3em' }, pc);
    const ctl = H('div', { style: 'display:grid;grid-template-columns:repeat(3,1fr);gap:.4em' }, pc);
    const mkBtn = (lab, d, area) => { const b = api.button(lab, async () => {
      if (busy) return; const x0 = rx, y0 = ry;
      if (await step(...DIR[d])) { upd(); table.add([`向${d}平移 1 格`, co(x0, y0), coHL(rx, ry, rx !== x0, ry !== y0)]); if (onMove) onMove(); }
    }, '', ctl); b.style.gridArea = area; btns.push(b); return b; };
    ctl.style.gridTemplateAreas = '". u ." "l . r" ". d ."';
    mkBtn('▲ 上', '上', 'u'); mkBtn('◀ 左', '左', 'l'); mkBtn('右 ▶', '右', 'r'); mkBtn('▼ 下', '下', 'd');
    table = api.table(['動作', '原來的位置', '新的位置'], api.panel('自動記錄表'));
    upd();
    /* --- 玩：收集電池 --- */
    api.phase('play');
    for (const [bx, by] of D.batteries) {
      const g = drawBat(bx, by);
      api.say(`機械人沒電了！用按鈕把它移到電池 <b>${co(bx, by)}</b> 那裏。看看記錄表怎樣變。`);
      await api.p(res => { onMove = () => { if (rx === bx && ry === by) { onMove = null; res(); } }; });
      g.remove(); Sfx.play('good'); api.praise('充電完成！');
      await api.wait(1000);
    }
    btns.forEach(b => b.disabled = true);
    /* --- 觀察 --- */
    api.phase('observe');
    await api.ask('看看記錄表的粗體數字。<b>向左或向右</b>移動時，哪個坐標改變了？', ['x 坐標（第一個數）', 'y 坐標（第二個數）', '兩個都變'], 0,
      ['找「向左」或「向右」那幾行，看看粗體字在第幾個數。', '向右走 1 格，第一個數加 1，第二個數不變。']);
    await api.ask('<b>向上或向下</b>移動時呢？', ['x 坐標（第一個數）', 'y 坐標（第二個數）', '兩個都變'], 1,
      ['找「向上」或「向下」那幾行。', '向上走 1 格，第二個數加 1。']);
    /* --- 預測 → 驗證 --- */
    let pick = null, picking = false;
    const ghost = S('g', { opacity: 0 }, mk);
    S('circle', { r: 20, fill: 'none', stroke: INK, 'stroke-width': 3, 'stroke-dasharray': '6 4' }, ghost);
    S('text', { y: 7, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 900, fill: INK, text: '?' }, ghost);
    tapLayer(svg, VW, VW, e => {
      if (!picking) return; const s = cp.snap(e.clientX, e.clientY); if (!s.ok) return;
      pick = [s.x, s.y]; ghost.setAttribute('transform', `translate(${cp.X(s.x)} ${cp.Y(s.y)})`); ghost.setAttribute('opacity', 1); Sfx.play('tap');
    });
    for (const ch of D.challenges) {
      api.phase('predict');
      // 機械人先去起點
      const [fx, fy] = ch.from;
      await api.tween(500, t => setRobot(rx + (fx - rx) * t, ry + (fy - ry) * t)); rx = fx; ry = fy; upd();
      const words = ch.moves.map(([d, n]) => `向${d} ${n}`).join('、');
      let ex = rx, ey = ry; ch.moves.forEach(([d, n]) => { ex += DIR[d][0] * n; ey += DIR[d][1] * n; });
      pick = null; ghost.setAttribute('opacity', 0); picking = true;
      api.say(`機械人在 <b>${co(rx, ry)}</b>。指令：<b>${words}</b>。先在方格上<b>點出</b>它會停在哪裏，再按「確定」。`);
      const hn = api.hinter([
        '向左右平移只改變 x 坐標；向上下平移只改變 y 坐標。',
        `由 ${co(rx, ry)} 開始，${ch.moves.map(([d, n]) => `${d === '左' || d === '右' ? 'x' : 'y'} 坐標${d === '右' || d === '上' ? '加' : '減'} ${n}`).join('，')}。`
      ]);
      await confirmLoop(api, hn, () => pick, [ex, ey], () => { pick = [ex, ey]; ghost.setAttribute('transform', `translate(${cp.X(ex)} ${cp.Y(ey)})`); ghost.setAttribute('opacity', 1); });
      picking = false;
      api.phase('verify');
      api.say('看看機械人會不會走到你的預測……');
      const x0 = rx, y0 = ry;
      for (const [d, n] of ch.moves) for (let i = 0; i < n; i++) await step(...DIR[d]);
      upd();
      table.add([words, co(x0, y0), coHL(rx, ry, rx !== x0, ry !== y0)]);
      ghost.setAttribute('opacity', 0);
      api.praise(`機械人由 ${co(x0, y0)} 平移到 <b>${co(rx, ry)}</b>。`);
      await api.wait(1800);
    }
    api.complete();
  }
  run();
};

/* =================================================================
   坐標島 第 4 關：魔鏡與轉盤（反射與旋轉）
   ================================================================= */
LEVEL_FUNCS.c4 = function (api, D) {
  const R = 6, u = 38, C = 270, VW = 540;
  const TF = {
    ry:  { name: '沿 y 軸反射', f: (x, y) => [-x, y], anim: (x, y, t) => [x * (1 - 2 * t), y] },
    rx:  { name: '沿 x 軸反射', f: (x, y) => [x, -y], anim: (x, y, t) => [x, y * (1 - 2 * t)] },
    r180:{ name: '繞原點旋轉 180°', f: (x, y) => [-x, -y], anim: (x, y, t) => rot(x, y, Math.PI * t) },
    r90: { name: '繞原點逆時針旋轉 90°', f: (x, y) => [-y, x], anim: (x, y, t) => rot(x, y, Math.PI / 2 * t) }
  };
  function rot(x, y, a) { return [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)]; }
  let svg, cp, img, extra, btns = {}, table, tPanel, busy = false;
  const pts = D.shape; // [['A',1,1], ...]

  function poly(g, P, style) {
    S('polygon', { points: P.map(([x, y]) => `${cp.X(x)},${cp.Y(y)}`).join(' '), ...style }, g);
  }
  function build() {
    svg = S('svg', { viewBox: `0 0 ${VW} ${VW}`, class: 'stage-svg', role: 'img', 'aria-label': '反射與旋轉' }, api.stage);
    const defs = S('defs', {}, svg);
    const p = S('pattern', { id: 'imgHatch', width: 8, height: 8, patternUnits: 'userSpaceOnUse' }, defs);
    S('path', { d: 'M0 8 L8 0', stroke: '#1c7ed6', 'stroke-width': 2 }, p);
    S('rect', { x: 0, y: 0, width: VW, height: VW, fill: '#fff' }, svg);
    cp = coordPlane(svg, { R, u, cx: C, cy: C, fs: 15 });
    const org = S('g', {}, svg);
    poly(org, pts.map(q => [q[1], q[2]]), { fill: '#ffd8a8', stroke: INK, 'stroke-width': 3.5 });
    pts.forEach(([n, x, y]) => {
      S('circle', { cx: cp.X(x), cy: cp.Y(y), r: 5, fill: INK }, org);
      S('text', { x: cp.X(x) + 7, y: cp.Y(y) - 7, 'font-size': 17, 'font-weight': 900, fill: INK, text: n }, org);
    });
    img = S('g', {}, svg); extra = S('g', {}, svg);
  }
  /** 動畫：圖案變成影像（虛線 + 斜線花紋，與原圖分辨不只靠顏色） */
  async function play(key) {
    busy = true; setBtns(); img.innerHTML = '';
    const g = S('g', {}, img);
    const pg = S('polygon', { fill: 'url(#imgHatch)', stroke: '#1c7ed6', 'stroke-width': 3.5, 'stroke-dasharray': '9 5' }, g);
    Sfx.play('whoosh');
    await api.tween(1300, t => {
      pg.setAttribute('points', pts.map(([, x, y]) => { const [a, b] = TF[key].anim(x, y, t); return `${cp.X(a)},${cp.Y(b)}`; }).join(' '));
    });
    pts.forEach(([n, x, y]) => {
      const [a, b] = TF[key].f(x, y);
      S('circle', { cx: cp.X(a), cy: cp.Y(b), r: 5, fill: '#1c7ed6', stroke: INK, 'stroke-width': 1.5 }, g);
      S('text', { x: cp.X(a) + 7, y: cp.Y(b) - 7, 'font-size': 17, 'font-weight': 900, fill: INK, stroke: '#fff', 'stroke-width': 4, 'paint-order': 'stroke', text: n + "'" }, g);
    });
    // 記錄表
    tPanel.innerHTML = ''; H('h3', { html: `記錄表：<b>${TF[key].name}</b>` }, tPanel);
    table = api.table(['點', '原來的坐標', '影像的坐標'], tPanel);
    pts.forEach(([n, x, y]) => { const [a, b] = TF[key].f(x, y); table.add([`${n} → ${n}'`, co(x, y), coHL(a, b, a !== x, b !== y)]); });
    busy = false; setBtns();
  }
  let allowed = [];
  function setBtns() { Object.entries(btns).forEach(([k, b]) => b.disabled = busy || !allowed.includes(k)); }

  async function run() {
    build();
    const pc = api.panel('魔鏡與轉盤');
    const ctl = H('div', { class: 'ctrls' }, pc);
    let onPress = null;
    ['ry', 'rx', 'r180', 'r90'].forEach(k => {
      btns[k] = api.button(TF[k].name, async () => { if (busy) return; await play(k); if (onPress) onPress(k); }, '', ctl);
    });
    btns.r90.style.display = 'none';
    tPanel = api.panel('記錄表');
    H('div', { class: 'note', text: '按上面的按鈕，記錄表會並排列出原來的點和影像的坐標。' }, tPanel);
    const steps = [['ry', 0], ['rx', 1], ['r180', 2]];
    const OPT = ['x 坐標', 'y 坐標', 'x 坐標和 y 坐標都是'];
    /* --- 玩 → 觀察（每種變換一次） --- */
    for (const [k, ans] of steps) {
      api.phase('play');
      allowed = [k]; setBtns();
      api.say(`按「<b>${TF[k].name}</b>」，看看小屋的<b>影像</b>在哪裏。`);
      await api.p(res => { onPress = kk => { if (kk === k) { onPress = null; res(); } }; });
      allowed = []; setBtns();
      api.phase('observe');
      await api.ask(`比較記錄表兩欄（有變的數字用粗體和底線）。${TF[k].name}後，哪個坐標變成了<b>相反數</b>？`, OPT, ans,
        ['看看哪一欄有粗體和底線的數字。', `例如 ${pts[1][0]}${co(pts[1][1], pts[1][2])} → ${pts[1][0]}'${co(...TF[k].f(pts[1][1], pts[1][2]))}，哪個數的正負號變了？`]);
    }
    img.innerHTML = '';
    /* --- 預測 → 驗證 --- */
    let pick = null, picking = false;
    const ghost = S('g', { opacity: 0 }, extra);
    S('circle', { r: 13, fill: 'none', stroke: INK, 'stroke-width': 3, 'stroke-dasharray': '5 4' }, ghost);
    S('text', { y: 6, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 900, fill: INK, text: '?' }, ghost);
    tapLayer(svg, VW, VW, e => {
      if (!picking) return; const s = cp.snap(e.clientX, e.clientY); if (!s.ok) return;
      pick = [s.x, s.y]; ghost.setAttribute('transform', `translate(${cp.X(s.x)} ${cp.Y(s.y)})`); ghost.setAttribute('opacity', 1); Sfx.play('tap');
    });
    for (const pr of D.predict) {
      api.phase('predict');
      const [x, y] = pr.p, [ax, ay] = TF[pr.t].f(x, y);
      const pg = S('g', {}, extra);
      S('circle', { cx: cp.X(x), cy: cp.Y(y), r: 8, fill: '#e8590c', stroke: INK, 'stroke-width': 2.5 }, pg);
      S('text', { x: cp.X(x) + 10, y: cp.Y(y) - 10, 'font-size': 18, 'font-weight': 900, fill: INK, stroke: '#fff', 'stroke-width': 4, 'paint-order': 'stroke', text: 'P' + co(x, y) }, pg);
      pick = null; ghost.setAttribute('opacity', 0); picking = true;
      api.say(`點 <b>P${co(x, y)}</b> ${TF[pr.t].name}。它的影像 P' 在哪裏？在方格上<b>點一下</b>，再按「確定」。`);
      const which = pr.t === 'ry' ? 'x 坐標變成相反數，y 坐標不變' : pr.t === 'rx' ? 'x 坐標不變，y 坐標變成相反數' : 'x 坐標和 y 坐標都變成相反數';
      const hn = api.hinter([`回看記錄表：${TF[pr.t].name}，哪個坐標會變成相反數？`, `${TF[pr.t].name}：${which}。`]);
      await confirmLoop(api, hn, () => pick, [ax, ay], () => { pick = [ax, ay]; ghost.setAttribute('transform', `translate(${cp.X(ax)} ${cp.Y(ay)})`); ghost.setAttribute('opacity', 1); });
      picking = false;
      api.phase('verify');
      const dot = S('circle', { r: 8, fill: '#1c7ed6', stroke: INK, 'stroke-width': 2.5 }, pg);
      Sfx.play('whoosh');
      await api.tween(1100, t => { const [a, b] = TF[pr.t].anim(x, y, t); dot.setAttribute('cx', cp.X(a)); dot.setAttribute('cy', cp.Y(b)); });
      S('text', { x: cp.X(ax) + 10, y: cp.Y(ay) - 10, 'font-size': 18, 'font-weight': 900, fill: INK, stroke: '#fff', 'stroke-width': 4, 'paint-order': 'stroke', text: "P'" + co(ax, ay) }, pg);
      ghost.setAttribute('opacity', 0);
      api.praise(`P${co(x, y)} 的影像是 <b>P'${co(ax, ay)}</b>。`);
      await api.wait(2000);
      pg.remove();
    }
    /* --- 附加挑戰：逆時針旋轉 90° --- */
    api.phase('play');
    btns.r90.style.display = ''; allowed = ['r90']; setBtns();
    api.say('<b>附加挑戰</b>：按「繞原點逆時針旋轉 90°」，看看影像。');
    await api.p(res => { onPress = kk => { if (kk === 'r90') { onPress = null; res(); } }; });
    allowed = []; setBtns();
    api.phase('observe');
    await api.ask('看看記錄表。(x, y) 繞原點逆時針旋轉 90° 後，影像的坐標是……', [`(${MINUS}y, x)`, `(y, ${MINUS}x)`, `(${MINUS}x, ${MINUS}y)`], 0,
      [`看看 ${pts[1][0]}${co(pts[1][1], pts[1][2])} → ${pts[1][0]}'${co(...TF.r90.f(pts[1][1], pts[1][2]))}：兩個數的位置有沒有對調？`, `x 坐標和 y 坐標對調了，而且新的 x 坐標加上了「${MINUS}」號。`],
      '兩個數對調位置，第一個數再變成相反數。');
    api.complete();
  }
  run();
};

/* =================================================================
   [K2] 面積體積島 4 關
   ================================================================= */
/** 方格紙（y 向上）：P(x, y) → 螢幕座標 */
function areaGrid(parent, { cols, rows, u, ox, oy }) {
  const g = S('g', {}, parent);
  for (let i = 0; i <= cols; i++) S('line', { x1: ox + i * u, y1: oy, x2: ox + i * u, y2: oy - rows * u, stroke: '#ced8e2', 'stroke-width': 1.3 }, g);
  for (let j = 0; j <= rows; j++) S('line', { x1: ox, y1: oy - j * u, x2: ox + cols * u, y2: oy - j * u, stroke: '#ced8e2', 'stroke-width': 1.3 }, g);
  const P = (x, y) => [ox + x * u, oy - y * u];
  return { g, P, pts: arr => arr.map(([x, y]) => P(x, y).join(',')).join(' '), u };
}
/** 共用花紋：dots / lines / cross（黑白列印、色弱也能分辨） */
function addPatterns(svg) {
  const defs = S('defs', {}, svg);
  const mk = (id, inner) => { const p = S('pattern', { id, width: 10, height: 10, patternUnits: 'userSpaceOnUse' }, defs); p.innerHTML = inner; };
  mk('pDots', '<circle cx="5" cy="5" r="1.7" fill="#1d2b3a"/>');
  mk('pLines', '<path d="M0 10 L10 0" stroke="#1d2b3a" stroke-width="1.4"/>');
  mk('pCross', '<path d="M0 5 H10 M5 0 V10" stroke="#1d2b3a" stroke-width="1.2"/>');
  mk('pBack', '<path d="M0 0 L10 10" stroke="#1d2b3a" stroke-width="1.4"/>');
}
const rot180 = ([x, y], [cx, cy], t) => {
  const a = Math.PI * t, dx = x - cx, dy = y - cy;
  return [cx + dx * Math.cos(a) - dy * Math.sin(a), cy + dx * Math.sin(a) + dy * Math.cos(a)];
};

/* =================================================================
   面積體積島 第 1 關：推推平行四邊形
   推斜長方形（底、高不變）→ 剪下三角形移到右邊數格
   → 兩個相同三角形、兩個相同梯形拼成平行四邊形
   ================================================================= */
LEVEL_FUNCS.a1 = function (api, D) {
  const u = 32, VW = 640, VH = 290, OX = 16, OY = 262;
  let svg, G, layer;
  function newStage() {
    api.stage.innerHTML = '';
    svg = S('svg', { viewBox: `0 0 ${VW} ${VH}`, class: 'stage-svg', role: 'img', 'aria-label': '方格紙' }, api.stage);
    addPatterns(svg);
    S('rect', { x: 0, y: 0, width: VW, height: VH, fill: '#fff' }, svg);
    G = areaGrid(svg, { cols: 19, rows: 7, u, ox: OX, oy: OY });
    layer = S('g', {}, svg);
  }
  /** 畫平行四邊形（底 b、高 h、推斜 s），回傳可移動的三角形 */
  function drawPara(b, h, s, x0 = 1, y0 = 1) {
    layer.innerHTML = '';
    const body = S('polygon', { points: G.pts([[x0 + s, y0], [x0 + b, y0], [x0 + b + s, y0 + h], [x0 + s, y0 + h]]), fill: '#ffd8a8', stroke: 'none' }, layer);
    const tri = S('polygon', { points: G.pts([[x0, y0], [x0 + s, y0], [x0 + s, y0 + h]]), fill: '#ffd8a8', stroke: 'none' }, layer);
    const triP = S('polygon', { points: G.pts([[x0, y0], [x0 + s, y0], [x0 + s, y0 + h]]), fill: 'url(#pLines)', opacity: s ? .5 : 0 }, layer);
    S('polygon', { points: G.pts([[x0, y0], [x0 + b, y0], [x0 + b + s, y0 + h], [x0 + s, y0 + h]]), fill: 'none', stroke: INK, 'stroke-width': 4, 'stroke-linejoin': 'round', class: 'outline' }, layer);
    const [hx, hy1] = G.P(x0 + s, y0 + h), [, hy0] = G.P(x0 + s, y0);
    if (s) S('line', { x1: hx, y1: hy1, x2: hx, y2: hy0, stroke: INK, 'stroke-width': 2.5, 'stroke-dasharray': '7 5' }, layer);
    S('text', { x: hx + (s ? 6 : -8), y: (hy0 + hy1) / 2 + 6, 'text-anchor': s ? 'start' : 'end', 'font-size': 18, 'font-weight': 900, fill: INK, text: `高 ${h}` }, layer);
    const [bx0, by] = G.P(x0, y0), [bx1] = G.P(x0 + b, y0);
    S('text', { x: (bx0 + bx1) / 2, y: by + 22, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 900, fill: INK, text: `底 ${b}` }, layer);
    return { body, tri: [tri, triP] };
  }
  /** 剪下左邊三角形移到右邊，再逐格數 */
  async function cutCount(b, h, s, x0 = 1, y0 = 1) {
    const { tri } = drawPara(b, h, s, x0, y0);
    if (s) {
      Sfx.play('whoosh');
      await api.tween(900, t => tri.forEach(e => e.setAttribute('transform', `translate(${b * u * t} 0)`)));
    }
    const nums = S('g', {}, layer);
    let k = 0;
    for (let j = 0; j < h; j++) for (let i = 0; i < b; i++) {
      k++;
      const [x, y] = G.P(x0 + s + i + .5, y0 + j + .5);
      S('text', { x, y: y + 6, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 800, fill: INK, text: k }, nums);
      if (k % 2) Sfx.tone(500 + k * 12, .04, 'triangle', .06);
      await api.wait(Math.max(25, 600 / (b * h)));
    }
    return b * h;
  }

  runAll();

  async function runAll() {
    newStage();
    api.phase('play');
    const pc = api.panel('推推看');
    const lab = H('div', { style: 'font-weight:800' }, pc);
    const slider = H('input', { type: 'range', min: 0, max: D.maxPush, step: 1, value: 0, class: 'big-range', 'aria-label': '推斜' }, pc);
    const ctl = H('div', { class: 'ctrls' }, pc);
    const table = api.table(['底', '高', '推斜', '面積（格）'], api.panel('自動記錄表'));
    let cur = D.shapes[0], busy = false, onCount = null;
    const redraw = () => { lab.textContent = `推斜：${slider.value} 格`; drawPara(cur.b, cur.h, +slider.value); };
    slider.addEventListener('input', () => { if (!busy) { Sfx.play('move'); redraw(); } });
    const countBtn = api.button('剪拼數一數', async () => {
      if (busy) return; busy = true; countBtn.disabled = slider.disabled = true;
      const s = +slider.value, a = await cutCount(cur.b, cur.h, s);
      table.add([cur.b, cur.h, s, a], [3]);
      api.say(`推斜 ${s} 格：剪拼後變成 ${cur.b} × ${cur.h} 的長方形，面積 <b>${a} 格</b>。`);
      await api.wait(1300);
      busy = false; countBtn.disabled = slider.disabled = false;
      if (onCount) onCount(s);
    }, 'pri', ctl);
    for (let si = 0; si < D.shapes.length; si++) {
      cur = D.shapes[si]; slider.value = 0; redraw();
      const need = si === 0 ? 3 : 2, seen = new Set();
      api.say(si === 0
        ? `拖動滑桿把長方形<b>推斜</b>（底和高不變），再按「剪拼數一數」。試 <b>${need}</b> 個不同的推斜度！`
        : `換一個：底 ${cur.b}、高 ${cur.h}。再試 <b>${need}</b> 個不同的推斜度。`);
      await api.p(res => { onCount = s => { seen.add(s); if (seen.size >= need) { onCount = null; res(); } else api.say(`再推到<b>另一個</b>位置試試！（已試 ${seen.size} / ${need}）`); }; });
    }
    countBtn.disabled = slider.disabled = true;
    api.phase('observe');
    await api.ask('看看記錄表：推斜以後，面積有沒有改變？', ['沒有改變', '變大了', '變小了'], 0, ['比較底和高相同的幾行。', '推斜 0 格和推斜 2 格，面積都是多少？']);
    const s0 = D.shapes[0];
    await api.ask('面積和<b>底</b>、<b>高</b>有什麼關係？', ['底 × 高', '底 + 高', '底 × 高 ÷ 2'], 0,
      [`看看第一行：底 ${s0.b}、高 ${s0.h}，面積 ${s0.b * s0.h}。`, `${s0.b} 和 ${s0.h} 怎樣得到 ${s0.b * s0.h}？`]);
    /* 預測 → 驗證 */
    api.phase('predict');
    const pr = D.predict;
    cur = pr; drawPara(pr.b, pr.h, pr.s);
    const A = pr.b * pr.h;
    const opts = [A, pr.b + pr.h, (pr.b + pr.s) * pr.h].sort((a, b) => a - b);
    await api.ask(`預測一下：這個平行四邊形（底 ${pr.b}、高 ${pr.h}）的面積是多少格？`, opts.map(v => v + ' 格'), opts.indexOf(A),
      ['推斜不會改變面積，用剛才發現的關係。', `底 × 高 = ${pr.b} × ${pr.h}。`]);
    api.phase('verify');
    api.say('剪拼數一數，驗證一下！');
    await cutCount(pr.b, pr.h, pr.s);
    table.add([pr.b, pr.h, pr.s, A], [3]);
    api.praise(`真的是 <b>${A} 格</b>！`);
    await api.next();

    /* ---------- 2. 兩個相同三角形 → 平行四邊形 ---------- */
    async function joinTwo(poly, center, offset, kind, info) {
      api.phase('play');
      layer.innerHTML = '';
      const p1 = S('polygon', { points: G.pts(poly), fill: '#ffd8a8', stroke: INK, 'stroke-width': 4, 'stroke-linejoin': 'round' }, layer);
      const p2 = S('polygon', { fill: '#a5d8ff', stroke: INK, 'stroke-width': 4, 'stroke-dasharray': '10 5', 'stroke-linejoin': 'round' }, layer);
      const p2p = S('polygon', { fill: 'url(#pDots)', opacity: .45 }, layer);
      const setP2 = t => { const pts = poly.map(q => { const r = rot180(q, center, t); return [r[0] + offset * (1 - t), r[1]]; }); p2.setAttribute('points', G.pts(pts)); p2p.setAttribute('points', G.pts(pts)); };
      setP2(0);
      info(layer);
      api.say(`這裏有兩個<b>一模一樣</b>的${kind}。按「拼起來」，把右邊那個轉半個圈，拼到左邊那個旁邊。`);
      await api.next('拼起來 ↻');
      Sfx.play('whoosh');
      await api.tween(1600, setP2);
      Sfx.play('glow');
    }
    // 三角形
    api.side.innerHTML = '';
    const nb = api.panel('發現');
    const T = D.triangle, tb = T.b, th = T.h;
    const triPoly = [[1, 1], [1 + tb, 1], [1 + T.top, 1 + th]];
    await joinTwo(triPoly, [(1 + tb + 1 + T.top) / 2, 1 + th / 2], 9, '三角形', g => {
      const [x0, y] = G.P(1, 1), [x1] = G.P(1 + tb, 1);
      S('text', { x: (x0 + x1) / 2, y: y + 22, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 900, fill: INK, text: `底 ${tb}` }, g);
      const [hx, hy1] = G.P(1 + T.top, 1 + th), [, hy0] = G.P(1 + T.top, 1);
      S('line', { x1: hx, y1: hy1, x2: hx, y2: hy0, stroke: INK, 'stroke-width': 2.5, 'stroke-dasharray': '7 5' }, g);
      S('text', { x: hx + 6, y: (hy0 + hy1) / 2, 'font-size': 18, 'font-weight': 900, fill: INK, text: `高 ${th}` }, g);
    });
    api.phase('observe');
    await api.ask('兩個三角形拼成了什麼？', ['平行四邊形', '正方形', '梯形'], 0, ['看看拼好的圖形：對邊是不是平行？', '它像第一部分被推斜的長方形。']);
    await api.ask('<b>一個</b>三角形的面積，是這個平行四邊形的……', ['一半', '一樣', '兩倍'], 0, ['平行四邊形是由幾個三角形拼成的？', '兩個一樣的三角形拼成一個平行四邊形。']);
    H('div', { class: 'note', html: `平行四邊形：${tb} × ${th} = ${tb * th} 格<br>一個三角形：${tb} × ${th} ÷ 2 = <b>${tb * th / 2} 格</b>` }, nb);
    await api.next();
    // 梯形
    const Z = D.trapezoid;
    const trap = [[1, 1], [1 + Z.bottom, 1], [1 + Z.left + Z.top, 1 + Z.h], [1 + Z.left, 1 + Z.h]];
    await joinTwo(trap, [(1 + Z.bottom + 1 + Z.left + Z.top) / 2, 1 + Z.h / 2], 9, '梯形', g => {
      const [x0, y] = G.P(1, 1), [x1] = G.P(1 + Z.bottom, 1);
      S('text', { x: (x0 + x1) / 2, y: y + 22, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 900, fill: INK, text: `下底 ${Z.bottom}` }, g);
      const [t0, ty] = G.P(1 + Z.left, 1 + Z.h), [t1] = G.P(1 + Z.left + Z.top, 1 + Z.h);
      S('text', { x: (t0 + t1) / 2, y: ty - 8, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 900, fill: INK, text: `上底 ${Z.top}` }, g);
      S('text', { x: x0 - 4, y: (y + ty) / 2, 'text-anchor': 'start', 'font-size': 18, 'font-weight': 900, fill: INK, text: `高 ${Z.h}` }, g);
    });
    api.phase('observe');
    await api.ask('拼成的平行四邊形，底有多長？', [`上底 + 下底（${Z.top} + ${Z.bottom}）`, `下底（${Z.bottom}）`, `上底 × 下底（${Z.top} × ${Z.bottom}）`], 0,
      ['看看拼好的圖形最下面那條邊：由哪兩段組成？', `左邊一段是第一個梯形的下底 ${Z.bottom}，右邊一段是第二個梯形的上底 ${Z.top}。`]);
    await api.ask('那麼<b>一個</b>梯形的面積 = ……', ['(上底 + 下底) × 高 ÷ 2', '(上底 + 下底) × 高', '上底 × 下底 ÷ 2'], 0,
      ['平行四邊形面積 = 底 × 高，底是「上底 + 下底」。', '兩個梯形才拼成平行四邊形，一個梯形要 ÷ 2。']);
    H('div', { class: 'note', style: 'margin-top:.4em', html: `一個梯形：(${Z.top} + ${Z.bottom}) × ${Z.h} ÷ 2 = <b>${(Z.top + Z.bottom) * Z.h / 2} 格</b>` }, nb);
    await api.next('完成 ★');
    api.complete();
  }
};

/* =================================================================
   面積體積島 第 2 關：剪剪貼貼（分割法、填補法）
   ================================================================= */
LEVEL_FUNCS.a2 = function (api, D) {
  const u = 46, VW = 600, VH = 400, OX = 40, OY = 360, SX = 2, SY = 1; // 圖形放在格 (2,1)
  let svg, G, layer, table;
  const sh = arr => arr.map(([x, y]) => [x + SX, y + SY]);
  function newStage() {
    api.stage.innerHTML = '';
    svg = S('svg', { viewBox: `0 0 ${VW} ${VH}`, class: 'stage-svg', role: 'img', 'aria-label': '多邊形' }, api.stage);
    addPatterns(svg);
    S('rect', { x: 0, y: 0, width: VW, height: VH, fill: '#fff' }, svg);
    G = areaGrid(svg, { cols: 11, rows: 7, u, ox: OX, oy: OY });
    layer = S('g', {}, svg);
  }
  function drawShape(poly) {
    layer.innerHTML = '';
    S('polygon', { points: G.pts(sh(poly)), fill: '#ffe8cc', stroke: INK, 'stroke-width': 4, 'stroke-linejoin': 'round' }, layer);
  }
  const PATS = ['pDots', 'pLines', 'pCross'], FILLS = ['#ffd8a8', '#a5d8ff', '#b2f2bb'];
  /** 分割：各塊分開一點，標示「闊 × 高 = 面積」 */
  async function split(poly, pieces) {
    layer.innerHTML = '';
    const cxA = poly.reduce((s, p) => s + p[0], 0) / poly.length, cyA = poly.reduce((s, p) => s + p[1], 0) / poly.length;
    const gs = pieces.map((pc, i) => {
      const g = S('g', {}, layer);
      S('polygon', { points: G.pts(sh(pc.poly)), fill: FILLS[i % 3], stroke: INK, 'stroke-width': 3.5 }, g);
      S('polygon', { points: G.pts(sh(pc.poly)), fill: `url(#${PATS[i % 3]})`, opacity: .35 }, g);
      const mx = pc.poly.reduce((s, p) => s + p[0], 0) / pc.poly.length, my = pc.poly.reduce((s, p) => s + p[1], 0) / pc.poly.length;
      const [tx, ty] = G.P(mx + SX, my + SY);
      S('rect', { x: tx - 52, y: ty - 18, width: 104, height: 32, rx: 8, fill: '#fff', stroke: INK, 'stroke-width': 2 }, g);
      S('text', { x: tx, y: ty + 5, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 900, fill: INK, text: `${pc.w} × ${pc.h} = ${pc.w * pc.h}` }, g);
      const dx = mx - cxA, dy = my - cyA, L = Math.hypot(dx, dy) || 1;
      return { g, dx: dx / L * .35 * u, dy: -dy / L * .35 * u };
    });
    Sfx.play('whoosh');
    await api.tween(600, t => gs.forEach(o => o.g.setAttribute('transform', `translate(${o.dx * t} ${o.dy * t})`)));
    return pieces.reduce((s, p) => s + p.w * p.h, 0);
  }
  /** 填補：補上缺口，顯示大長方形減去補上部分 */
  function drawFill(poly, F, big) {
    const [fx, fy, fw, fh] = F;
    const r = sh([[fx, fy], [fx + fw, fy], [fx + fw, fy + fh], [fx, fy + fh]]);
    S('polygon', { points: G.pts(r), fill: '#e9ecef', stroke: INK, 'stroke-width': 3, 'stroke-dasharray': '8 5' }, layer);
    S('polygon', { points: G.pts(r), fill: 'url(#pCross)', opacity: .4 }, layer);
    const [cx, cy] = G.P(fx + fw / 2 + SX, fy + fh / 2 + SY);
    S('text', { x: cx, y: cy + 6, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 900, fill: INK, stroke: '#fff', 'stroke-width': 4, 'paint-order': 'stroke', text: `補上 ${fw} × ${fh} = ${fw * fh}` }, layer);
    const [bw, bh] = big;
    S('polygon', { points: G.pts(sh([[0, 0], [bw, 0], [bw, bh], [0, bh]])), fill: 'none', stroke: INK, 'stroke-width': 6 }, layer);
    const [lx, ly] = G.P(SX + bw / 2, SY);
    S('text', { x: lx, y: ly + 26, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 900, fill: INK, text: `大長方形 ${bw} × ${bh} = ${bw * bh}` }, layer);
  }
  function banner(txt) {
    const g = S('g', {}, layer);
    S('rect', { x: 140, y: 6, width: 320, height: 40, rx: 12, fill: '#fff9db', stroke: INK, 'stroke-width': 3 }, g);
    S('text', { x: 300, y: 33, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 900, fill: INK, text: txt }, g);
  }
  /** 「補一塊」卡：拖到缺口 */
  function fillCard(F, label) {
    return api.p(res => {
      const pc = api.panel('工具：補一塊');
      const c = H('div', { class: 'dcard', html: `<svg width="${F[2] * 14}" height="${F[3] * 14}" style="margin-right:.4em"><rect x="1" y="1" width="${F[2] * 14 - 2}" height="${F[3] * 14 - 2}" fill="#e9ecef" stroke="#1d2b3a" stroke-width="2" stroke-dasharray="4 3"/></svg>${label}` }, pc);
      const zone = S('rect', { x: 0, y: 0, width: 0, height: 0, fill: 'transparent' }, layer);
      const [zx, zy] = G.P(F[0] + SX, F[1] + F[3] + SY);
      zone.setAttribute('x', zx); zone.setAttribute('y', zy); zone.setAttribute('width', F[2] * u); zone.setAttribute('height', F[3] * u);
      const hn = api.hinter(['把它放在圖形<b>缺了的位置</b>，令圖形變成一個大長方形。', '缺口在圖形上面凹了進去的地方。'],
        async () => { c.classList.add('demo'); await api.wait(500); c.classList.remove('demo'); await flyCard(c, zone); c.classList.add('used'); res(); });
      makeDraggable(c, {
        onDrop: (cx, cy) => {
          if (hitEl(zone, cx, cy, 20)) { hn.reset(); c.classList.add('used'); Sfx.play('drop'); res(); return true; }
          hn.wrong(); return false;
        }
      });
    });
  }

  async function run() {
    newStage();
    const L = D.shapeL;
    drawShape(L.poly);
    table = api.table(['方法', '算式', '面積'], api.panel('自動記錄表'));
    /* --- 玩：分割法（剪刀） --- */
    api.phase('play');
    api.say('這個 L 形有多大？用<b>剪刀</b>沿虛線剪一刀，把它分成簡單的圖形。點一下虛線！');
    const goodDone = new Set();
    while (goodDone.size < L.cuts.filter(c => !c.bad).length) {
      drawShape(L.poly);
      const cutG = S('g', {}, layer);
      const hn = api.hinter(['這一刀要把圖形<b>分成兩塊</b>才行。', '試試由一條邊一直剪到另一條邊的虛線。']);
      const chosen = await api.p(res => {
        L.cuts.forEach((c, i) => {
          if (goodDone.has(i)) return;
          const [[a, b], [cc, d]] = sh(c.seg);
          const [x1, y1] = G.P(a, b), [x2, y2] = G.P(cc, d);
          const g = S('g', { style: 'cursor:pointer' }, cutG);
          S('line', { x1, y1, x2, y2, stroke: '#e8590c', 'stroke-width': 5, 'stroke-dasharray': '10 7' }, g);
          S('text', { x: x1 + (x1 === x2 ? -24 : -4), y: y1 + (x1 === x2 ? -6 : -10), 'font-size': 24, fill: INK, text: '✂' }, g);
          const hitL = S('line', { x1, y1, x2, y2, stroke: 'transparent', 'stroke-width': 34 }, g);
          hitL.addEventListener('pointerdown', e => {
            e.preventDefault();
            if (c.bad) { hn.wrong(); return; }
            res(i);
          });
        });
      });
      cutG.remove();
      const c = L.cuts[chosen];
      const a = await split(L.poly, c.pieces);
      table.add(['分割法', c.pieces.map(p => p.w * p.h).join(' + '), a], [2]);
      api.praise(`分成 ${c.pieces.map(p => `${p.w} × ${p.h}`).join(' 和 ')}，面積 = ${c.pieces.map(p => p.w * p.h).join(' + ')} = <b>${a} 格</b>。`);
      goodDone.add(chosen);
      await api.wait(1500);
      if (goodDone.size < L.cuts.filter(c => !c.bad).length) { api.say('還有另一種剪法嗎？再試另一刀！'); await api.next('還原 ↺'); }
    }
    /* --- 玩：填補法 --- */
    drawShape(L.poly);
    api.say('換個方法：用「<b>補一塊</b>」把缺口補上，變成一個大長方形！把卡拖到缺口。');
    await fillCard(L.fill.rect, `補一塊（${L.fill.rect[2]} × ${L.fill.rect[3]}）`);
    drawShape(L.poly); drawFill(L.poly, L.fill.rect, L.fill.big);
    const big = L.fill.big[0] * L.fill.big[1], add = L.fill.rect[2] * L.fill.rect[3];
    table.add(['填補法', `${big} ${MINUS} ${add}`, big - add], [2]);
    api.say(`大長方形 ${big} 格，減去補上的 ${add} 格，L 形是 <b>${big - add} 格</b>。`);
    await api.wait(1500);
    api.phase('observe');
    await api.ask('看看記錄表：「剪開」和「補上」兩個方法得到的面積……', ['一樣', '不一樣'], 0, ['比較記錄表「面積」那一欄。', `每一行的面積都是 ${big - add}。`]);
    banner('兩條路都到達同一終點！');
    Sfx.play('glow');
    await api.next();
    /* --- 預測 → 驗證：凹形 --- */
    const U = D.shapeU;
    api.side.innerHTML = '';
    table = api.table(['方法', '算式', '面積'], api.panel('自動記錄表'));
    drawShape(U.poly);
    api.phase('predict');
    api.say('新挑戰：這個<b>凹形</b>。先用「補一塊」把缺口補上。');
    await fillCard(U.fill.rect, `補一塊（${U.fill.rect[2]} × ${U.fill.rect[3]}）`);
    drawShape(U.poly); drawFill(U.poly, U.fill.rect, U.fill.big);
    const B2 = U.fill.big[0] * U.fill.big[1], A2 = U.fill.rect[2] * U.fill.rect[3], ans = B2 - A2;
    table.add(['填補法', `${B2} ${MINUS} ${A2}`, ans], [2]);
    const opts = [ans, B2, B2 + A2].sort((a, b) => a - b);
    await api.ask('預測：凹形的面積是多少格？', opts.map(v => v + ' 格'), opts.indexOf(ans),
      ['大長方形裏，有一部分是補上去的，不屬於凹形。', `大長方形 ${B2} 格，要減去補上的 ${A2} 格。`]);
    api.phase('verify');
    api.say('用<b>剪刀</b>（分割法）驗證一下……');
    await api.wait(700);
    drawShape(U.poly);
    const a = await split(U.poly, U.pieces);
    table.add(['分割法', U.pieces.map(p => p.w * p.h).join(' + '), a], [2]);
    banner('兩條路都到達同一終點！');
    api.praise(`分割法：${U.pieces.map(p => p.w * p.h).join(' + ')} = <b>${a} 格</b>，和填補法一樣！`);
    await api.next('完成 ★');
    api.complete();
  }
  run();
};

/** 立體小圖示（分類卡用） */

LEVEL_FUNCS.a3 = function (api, D) {

  let svg, cubes;

  function drawStack(cells, layers, dropTop = 0) {
    cubes.innerHTML = '';
    const list = [];
    for (let z = 0; z < layers; z++) cells.forEach(([x, y]) => list.push([x, y, z]));
    list.sort((p, q) => p[2] - q[2] || (p[0] + p[1]) - (q[0] + q[1]));
    list.forEach(([x, y, z]) => {
      const g = S('g', {}, cubes);
      if (z === layers - 1 && dropTop) g.setAttribute('transform', `translate(0 ${-dropTop})`), g.setAttribute('data-top', 1);
      S('polygon', { points: ptsI([[x, y + 1, z], [x + 1, y + 1, z], [x + 1, y + 1, z + 1], [x, y + 1, z + 1]]), fill: '#fab005', stroke: INK, 'stroke-width': 2 }, g);
      S('polygon', { points: ptsI([[x + 1, y, z], [x + 1, y + 1, z], [x + 1, y + 1, z + 1], [x + 1, y, z + 1]]), fill: '#e67700', stroke: INK, 'stroke-width': 2 }, g);
      S('polygon', { points: ptsI([[x, y, z + 1], [x + 1, y, z + 1], [x + 1, y + 1, z + 1], [x, y + 1, z + 1]]), fill: '#ffe066', stroke: INK, 'stroke-width': 2 }, g);
    });
  }
  async function dropAnim() {

  }

  async function warmup() {
    api.phase('play');

    const wrap = H('div', { style: 'width:100%;display:flex;flex-direction:column;gap:.8em;padding:.4em' }, api.stage);
    const deck = H('div', { class: 'cards', style: 'justify-content:center;min-height:80px' }, wrap);
    const row = H('div', { style: 'display:flex;gap:.8em;flex-wrap:wrap' }, wrap);

    let left = D.solids.length;
    await api.p(res => {
      D.solids.forEach(s => {
        const c = H('div', { class: 'dcard', html: solidIcon(s.k) + s.name, style: 'flex-direction:column;font-size:.9em' }, deck);
        const tgt = s.flat ? bF : bC;
        const put = () => { c.classList.add('used'); H('div', { class: 'dcard', html: solidIcon(s.k) + s.name, style: 'flex-direction:column;font-size:.8em;cursor:default' }, s.flat ? inF : inC); Sfx.play('drop'); left--; if (!left) setTimeout(res, 900); };
        const hn = api.hinter(['看看它有沒有圓圓的、彎曲的面。', `${s.name}${s.flat ? '的每個面都是平的多邊形' : '有一個彎曲的面'}。`],

        makeDraggable(c, {

    });

  }

  async function stack() {
    api.phase('play');
    api.stage.innerHTML = '';
    svg = S('svg', { viewBox: `0 0 ${VW} ${VH}`, class: 'stage-svg', role: 'img', 'aria-label': '疊方塊' }, api.stage);
    S('rect', { x: 0, y: 0, width: VW, height: VH, fill: '#f8f9fa' }, svg);
    cubes = S('g', {}, svg);
    const pc = api.panel('揀一個底');
    const bRow = H('div', { class: 'ctrls' }, pc);
    const cnt = H('div', { class: 'eq', style: 'text-align:center;margin:.3em 0' }, pc);
    const ctl = H('div', { class: 'ctrls' }, pc);
    const table = api.table(['底', '每層方塊數', '層數', '總數'], api.panel('自動記錄表'));
    let base = D.bases[0], layers = 1, busy = false, onAdd = null, locked = false;
    const upd = () => { cnt.innerHTML = `${base.name}底：每層 ${base.cells.length} 個 × ${layers} 層<br>方塊總數：<b>${base.cells.length * layers}</b> 個`; };
    const baseBtns = D.bases.map(b => {
      const x = api.button(baseMini(b.cells) + b.name, () => { if (busy || locked) return; base = b; layers = 1; drawStack(b.cells, 1); upd(); baseBtns.forEach(y => y.classList.toggle('on', y === x)); if (onAdd) onAdd('base'); }, '', bRow);

      busy = true; layers++; drawStack(base.cells, layers, 60); await dropAnim(); upd();
      table.add([base.name, base.cells.length, layers, base.cells.length * layers], [3]);

    }, 'pri', ctl);
    const remBtn = api.button('拿走一層 ▼', () => { if (busy || locked || layers <= 1) return; layers--; drawStack(base.cells, layers); upd(); }, '', ctl);
    drawStack(base.cells, 1); upd();
    for (const task of D.stackTasks) {

      api.say(`揀「<b>${b.name}</b>」底，按「加一層」一直疊到 <b>${task.layers} 層</b>。看看記錄表！`);

    }
    locked = true; [...baseBtns, addBtn, remBtn].forEach(x => x.disabled = true);

    await api.ask('看看記錄表：方塊總數 = ……', ['每層方塊數 × 層數', '每層方塊數 + 層數', '層數 × 層數'], 0,
      ['看看任何一行的三個數。', `例如每層 ${D.bases[0].cells.length} 個、${D.stackTasks[0].layers} 層，總數是 ${D.bases[0].cells.length * D.stackTasks[0].layers}。`]);
    api.phase('predict');
    const pr = D.stackPredict, pb = D.bases[pr.base], ans = pb.cells.length * pr.layers;
    base = pb; layers = 1; drawStack(pb.cells, 1); upd(); baseBtns.forEach(y => y.classList.toggle('on', y.textContent.includes(pb.name)));
    const opts = [ans, pb.cells.length + pr.layers, ans - pb.cells.length].sort((a, b) => a - b);
    await api.ask(`預測：用「${pb.name}」底（每層 ${pb.cells.length} 個）疊 <b>${pr.layers} 層</b>，總共有多少個方塊？`, opts.map(v => v + ' 個'), opts.indexOf(ans),
      ['用剛才發現的關係：每層方塊數 × 層數。', `${pb.cells.length} × ${pr.layers} = ？`]);

  /** 切蛋糕：L 形角柱（連續立體），平面 z = h + k(x − cx) */
  async function cake() {
    api.phase('play');
    api.stage.innerHTML = ''; api.side.innerHTML = '';
    const base = D.cakeBase, Hh = D.cakeHeight, a = 46, ox = 250, oy = 380;

    const P = arr => arr.map(p => I(...p).join(',')).join(' ');
    svg = S('svg', { viewBox: `0 0 ${VW} ${VH}`, class: 'stage-svg', role: 'img', 'aria-label': '切蛋糕' }, api.stage);

    const solid = S('g', {}, svg), planeG = S('g', {}, svg);
    // 角柱：底 → 側面（由後至前）→ 頂
    S('polygon', { points: P(base.map(([x, y]) => [x, y, 0])), fill: '#ffd8a8', stroke: INK, 'stroke-width': 2 }, solid);
    const sides = base.map((p, i) => [p, base[(i + 1) % base.length]]).sort((s1, s2) => (s1[0][0] + s1[0][1] + s1[1][0] + s1[1][1]) - (s2[0][0] + s2[0][1] + s2[1][0] + s2[1][1]));
    sides.forEach(([p, q]) => S('polygon', { points: P([[...p, 0], [...q, 0], [...q, Hh], [...p, Hh]]), fill: '#ffe8cc', 'fill-opacity': .75, stroke: INK, 'stroke-width': 2 }, solid));
    S('polygon', { points: P(base.map(([x, y]) => [x, y, Hh])), fill: '#ffd8a8', stroke: INK, 'stroke-width': 2.5 }, solid);

    let k = 0, moves = 0, onChange = null;
    const xs = base.map(p => p[0]), xc = (Math.min(...xs) + Math.max(...xs)) / 2, span = (Math.max(...xs) - Math.min(...xs)) / 2;
    const draw = () => {
      const lo = .4 + Math.abs(k) * span, hi = Hh - .4 - Math.abs(k) * span;
      const h = lo + (hi - lo) * slider.value / 100;
      const zf = (x) => h + k * (x - xc);
      planeG.innerHTML = '';
      const ex = [[-1, -1], [Math.max(...xs) + 1, -1], [Math.max(...xs) + 1, Math.max(...base.map(p => p[1])) + 1], [-1, Math.max(...base.map(p => p[1])) + 1]];
      S('polygon', { points: P(ex.map(([x, y]) => [x, y, zf(x)])), fill: '#74c0fc', 'fill-opacity': .3, stroke: '#1c7ed6', 'stroke-width': 2.5, 'stroke-dasharray': '8 5' }, planeG);
      S('polygon', { points: P(base.map(([x, y]) => [x, y, zf(x)])), fill: '#ffe066', stroke: INK, 'stroke-width': 4 }, planeG);
      S('text', { x: I(ex[1][0], ex[1][1], zf(ex[1][0]))[0] + 6, y: I(ex[1][0], ex[1][1], zf(ex[1][0]))[1], 'font-size': 18, 'font-weight': 900, fill: '#1c7ed6', text: '刀' }, planeG);
      // 2D 截面真實形狀（斜切時 x 方向拉長）與底（虛線）比較
      secG.innerHTML = '';

        S('polygon', { points: base.map(([x, y]) => `${ox2 + (x - Math.min(...xs)) * sc * f},${20 + (my - y) * sc}`).join(' '), ...style }, secG);

    };
    const pBtn = api.button('平行於底切', () => { k = 0; pBtn.classList.add('on'); sBtn.classList.remove('on'); draw(); if (onChange) onChange('k'); }, 'on', ctl);
    const sBtn = api.button('斜切', () => { k = D.cakeTilt; sBtn.classList.add('on'); pBtn.classList.remove('on'); draw(); if (onChange) onChange('k'); }, '', ctl);
    sBtn.disabled = true;
    slider.addEventListener('input', () => { draw(); moves++; if (moves % 4 === 0) Sfx.play('move'); if (onChange) onChange('s'); });
    draw();
    api.say('切蛋糕！拖動下面的滑桿，<b>平行於底</b>切下去，看看右邊的截面。上上下下多試幾次！');
    await api.p(res => { onChange = () => { if (moves >= 12) { onChange = null; res(); } }; });
    api.phase('observe');
    await api.ask('平行於底切，無論切在哪裏，截面……', ['形狀和大小永遠和底一樣', '愈高愈大', '每次都不同'], 0,
      ['比較右邊的「底」和「截面」。', '再拖動滑桿，截面有沒有改變？']);
    api.phase('play');
    sBtn.disabled = false;
    api.say('現在按「<b>斜切</b>」，再拖動滑桿。截面變成怎樣？');
    let sl = 0;
    await api.p(res => { onChange = (w) => { if (k !== 0 && w === 's') sl++; if (k !== 0 && sl >= 6) { onChange = null; res(); } }; });
    api.phase('observe');
    await api.ask('斜切時，截面和底……', ['不一樣（被拉長了）', '一模一樣'], 0, ['比較右邊的「底」和「截面」的闊度。', '截面比底闊了。']);
    await api.next('完成 ★');
  }

  async function run() {
    await warmup();
    api.side.innerHTML = '';
    await stack();
    await cake();
    api.complete();
  }
  run();
};

/* =================================================================
   面積體積島 第 4 關：拆盒子（直立角柱的展開）
   ================================================================= */
LEVEL_FUNCS.a4 = function (api, D) {
  const VW = 640, VH = 380, a = 34, OXI = 190, OYI = 210, NX = 230, NY = 240, U = 30;
  const iso = (x, y, z) => [OXI + (x - y) * a * .866, OYI + (x + y) * a * .5 - z * a];
  let svg, table;

  /** 建立一個角柱的所有面：每個面有 3D 角點和展開圖角點 */
  function makeFaces(pr) {
    const B = pr.base, PH = pr.h, n = B.length, faces = [];
    let cum = 0;
    const PATS = ['pDots', 'pLines', 'pCross', 'pBack'], FILLS = ['#ffd8a8', '#a5d8ff', '#b2f2bb', '#eebefa'];
    for (let i = 0; i < n; i++) {
      const p = B[i], q = B[(i + 1) % n], L = Math.round(Math.hypot(q[0] - p[0], q[1] - p[1]) * 100) / 100;
      faces.push({ kind: 'side', L, fill: FILLS[i % 4], pat: PATS[i % 4],
        d3: [[...p, 0], [...q, 0], [...q, PH], [...p, PH]].map(v => iso(...v)),
        d2: [[cum, 0], [cum + L, 0], [cum + L, PH], [cum, PH]].map(([x, y]) => [NX + x * U, NY - y * U]),
        depth: p[0] + p[1] + q[0] + q[1] });
      cum += L;
    }
    faces.sort((f, g) => f.depth - g.depth);
    const bot = { kind: 'base', d3: B.map(([x, y]) => iso(x, y, 0)), d2: B.map(([x, y]) => [NX + x * U, NY + y * U]), fill: '#fff3bf', pat: 'pDots' };
    const top = { kind: 'base', d3: B.map(([x, y]) => iso(x, y, PH)), d2: B.map(([x, y]) => [NX + x * U, NY - (PH + y) * U]), fill: '#fff3bf', pat: 'pDots' };
    return { faces, bot, top, per: cum };
  }
  function drawFaces(F, t, baseOp) {
    svg.querySelector('#faces')?.remove();
    const g = S('g', { id: 'faces' }, svg);
    const lerp = f => f.d3.map((p, i) => [p[0] + (f.d2[i][0] - p[0]) * t, p[1] + (f.d2[i][1] - p[1]) * t]);
    const one = (f, op = 1) => {
      const pts = lerp(f).map(p => p.join(',')).join(' ');
      S('polygon', { points: pts, fill: f.fill, stroke: INK, 'stroke-width': 3, opacity: op, 'stroke-dasharray': f.kind === 'base' && op < 1 ? '6 4' : '' }, g);
      S('polygon', { points: pts, fill: `url(#${f.pat})`, opacity: .3 * op }, g);
    };
    one(F.bot, baseOp); F.faces.forEach(f => one(f)); one(F.top, baseOp);
    return g;
  }
  async function unfold(F, baseOp) {
    Sfx.play('whoosh');
    await api.tween(1800, t => drawFaces(F, t, baseOp * (1 - t * .0)));
  }
  function edgeLabels(F, pr) {
    const g = S('g', {}, svg);
    let cum = 0;
    F.faces.slice().sort((f, h) => f.d2[0][0] - h.d2[0][0]).forEach(f => {
      const L = f.L;
      S('text', { x: NX + (cum + L / 2) * U, y: NY - pr.h * U / 2 + 6, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 900, fill: INK, stroke: '#fff', 'stroke-width': 4, 'paint-order': 'stroke', text: `${L} × ${pr.h}` }, g);
      cum += L;
    });
    return g;
  }

  async function prismRound(pr, idx) {
    api.stage.innerHTML = '';
    svg = S('svg', { viewBox: `0 0 ${VW} ${VH}`, class: 'stage-svg', role: 'img', 'aria-label': '拆盒子' }, api.stage);
    addPatterns(svg);
    S('rect', { x: 0, y: 0, width: VW, height: VH, fill: '#fff' }, svg);
    const F = makeFaces(pr);
    drawFaces(F, 0, 1);
    return F;
  }

  async function run() {
    /* ---------- 1. 直立三角柱：拆開 + 拖標籤 ---------- */
    api.phase('play');
    const p1 = D.prisms[0];
    let F = await prismRound(p1, 0);
    table = api.table(['側面', '闊 × 高', '面積'], api.panel('自動記錄表'));
    api.say(`這是一個<b>${p1.name}</b>（高 ${p1.h}）。按「拆開」，看看它的所有側面！`);
    await api.next('拆開 ✂');
    await unfold(F, 0);
    const lbl = edgeLabels(F, p1);
    let total = 0;
    F.faces.slice().sort((f, h) => f.d2[0][0] - h.d2[0][0]).forEach((f, i) => { total += f.L * p1.h; table.add([`側面 ${i + 1}`, `${f.L} × ${p1.h}`, f.L * p1.h]); });
    table.add(['<b>全部</b>', '', `<b>${total}</b>`], [2]);
    /* 拖標籤到大長方形的邊 */
    api.phase('observe');
    api.say('所有側面排成了一個<b>大長方形</b>！把標籤拖到大長方形<b>正確的邊</b>上。');
    const zB = S('rect', { x: NX - 6, y: NY - 18, width: F.per * U + 12, height: 36, fill: 'transparent' }, svg);
    const zH = S('rect', { x: NX - 22, y: NY - p1.h * U - 6, width: 44, height: p1.h * U + 12, fill: 'transparent' }, svg);
    const lp = api.panel('標籤');
    const deck = H('div', { class: 'cards' }, lp);
    let need = 2;
    await api.p(res => {
      [['底的周界', zB], ['角柱的高', zH], ['底面積', null]].forEach(([t, zone]) => {
        const c = H('div', { class: 'dcard', text: t }, deck);
        const put = () => {
          c.classList.add('used'); Sfx.play('drop');
          if (zone === zB) {
            S('path', { d: `M${NX} ${NY + 22} H${NX + F.per * U}`, stroke: INK, 'stroke-width': 3 }, svg);
            S('path', { d: `M${NX} ${NY + 22} l10 -6 v12 z M${NX + F.per * U} ${NY + 22} l-10 -6 v12 z`, fill: INK }, svg);
            S('text', { x: NX + F.per * U / 2, y: NY + 48, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 900, fill: INK, text: `底的周界 = ${F.faces.map(f => f.L).sort((x, y) => y - x).join(' + ')} = ${F.per}` }, svg);
          } else {
            S('text', { x: NX - 12, y: NY - p1.h * U / 2, 'text-anchor': 'end', 'font-size': 19, 'font-weight': 900, fill: INK, text: `高 = ${p1.h}` }, svg);
            S('path', { d: `M${NX - 6} ${NY} V${NY - p1.h * U}`, stroke: INK, 'stroke-width': 3 }, svg);
          }
          need--; if (!need) setTimeout(res, 900);
        };
        const hn = api.hinter([
          t === '底面積' ? '「底面積」是一個面的大小，不是一條邊的長度哦。' : '大長方形的長邊是由哪些邊接起來的？短邊又是什麼？',
          t === '底的周界' ? '長邊 = 所有側面的闊接起來 = 繞底走一圈的長度。' : t === '角柱的高' ? '短邊就是每個側面的高，即是角柱的高。' : '這張標籤不用放在邊上。'
        ], zone ? async () => { c.classList.add('demo'); await api.wait(500); c.classList.remove('demo'); await flyCard(c, zone); put(); } : null);
        makeDraggable(c, {
          onDrop: (x, y) => {
            const at = hitEl(zB, x, y, 10) ? zB : hitEl(zH, x, y, 10) ? zH : null;
            if (!at) return false;
            if (at === zone) { hn.reset(); api.praise(); put(); return true; }
            hn.wrong(); return false;
          }
        });
      });
    });
    lp.remove();
    await api.ask(`記錄表中所有側面的總面積是 ${total}。${total} = ……`, [`底的周界 × 高（${F.per} × ${p1.h}）`, `底面積 × 高`, `底的周界 + 高（${F.per} + ${p1.h}）`], 0,
      ['大長方形的面積 = 長 × 闊。', `大長方形的長是底的周界 ${F.per}，闊是高 ${p1.h}。`]);
    await api.next('下一個盒子 ▶');

    /* ---------- 2. 長方體：先預測，再拆開驗證，再加兩個底 ---------- */
    const p2 = D.prisms[1];
    api.side.innerHTML = '';
    table = api.table(['側面', '闊 × 高', '面積'], api.panel('自動記錄表'));
    F = await prismRound(p2, 1);
    api.phase('predict');
    const dims = p2.base;
    const per = F.per;
    const opts = [per, per / 2, per - dims[1][0] + 0].filter((v, i, s) => s.indexOf(v) === i).sort((x, y) => x - y);
    const lens = F.faces.map(f => f.L).sort((x, y) => y - x);
    api.say(`這是一個<b>${p2.name}</b>（底 ${lens[0]} × ${lens[lens.length - 1]}，高 ${p2.h}）。`);
    await api.ask(`拆開前先預測：所有側面拼成的大長方形，長（底的周界）是多少？`, opts.map(String), opts.indexOf(per),
      ['底的周界 = 繞底走一圈的長度。', `底的四條邊是 ${lens.join('、')}。`]);
    api.phase('verify');
    await unfold(F, .35);
    edgeLabels(F, p2);
    let t2 = 0;
    F.faces.slice().sort((f, h) => f.d2[0][0] - h.d2[0][0]).forEach((f, i) => { t2 += f.L * p2.h; table.add([`側面 ${i + 1}`, `${f.L} × ${p2.h}`, f.L * p2.h]); });
    table.add(['<b>全部</b>', `${per} × ${p2.h}`, `<b>${t2}</b>`], [2]);
    api.praise(`長真的是 <b>${per}</b>！所有側面的總面積 = ${per} × ${p2.h} = <b>${t2}</b>。`);
    await api.next();
    api.phase('observe');
    await api.ask('要計算整個盒子的<b>總表面面積</b>，還要加上什麼？', ['兩個底', '一個底', '不用加'], 0,
      ['看看展開圖上，淡淡的虛線面還未計算。', '盒子有上下兩個底。']);
    drawFaces(F, 1, 1);
    edgeLabels(F, p2);
    const bA = lens[0] * lens[lens.length - 1];
    table.add(['兩個底', `2 × ${bA}`, 2 * bA], [2]);
    table.add(['<b>總表面面積</b>', `${2 * bA} + ${t2}`, `<b>${2 * bA + t2}</b>`], [2]);
    Sfx.play('glow');
    api.say(`總表面面積 = 2 × 底面積 + 所有側面的總面積 = 2 × ${bA} + ${t2} = <b>${2 * bA + t2}</b>`);
    await api.next('完成 ★');
    api.complete();
  }
  run();
};

/* =================================================================
   [L] 啟動
   ================================================================= */
function init() {
  Store.load();
  document.querySelectorAll('[data-guide]').forEach(el => el.innerHTML = guideHtml());
  document.querySelectorAll('[data-go="map"]').forEach(b => b.addEventListener('click', () => { Sfx.play('tap'); goMap(); }));
  document.querySelectorAll('[data-sound]').forEach(b => b.addEventListener('click', () => {
    Store.data.sound = !Store.data.sound; Store.save(); updSoundBtns(); Sfx.play('tap');
  }));
  $('#btnAlbum').addEventListener('click', () => { Sfx.play('tap'); goAlbum(); });
  $('#btnCert').addEventListener('click', () => { Sfx.play('tap'); goCert(false); });
  $('#btnReset').addEventListener('click', () => {
    Sfx.play('tap');
    openModal('<h2>重設進度？</h2><p>所有星星、徽章和發現卡都會清除，要重新開始。</p>', [
      { label: '取消' },
      { label: '確定重設', cls: 'pri', fn: () => { Store.reset(); goMap(); } }
    ]);
  });
  // 防止 iPad 雙擊放大和長按選取
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', e => { if (e.target.closest('.dcard,svg')) e.preventDefault(); });
  updSoundBtns();
  goMap();
}
init();
</script>
